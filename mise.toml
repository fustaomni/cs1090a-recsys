# mise.toml
# TASKS, MIRRORED FROM cscie103-data-engineering. contracts/provenance.toml records the
# source commit. Every [tasks.*] block below is cscie103's, verbatim at that commit; any
# change made here is a later, governed edit, so each difference is a reviewable diff.
#
# NO NIX ON THIS MACHINE. FAS OnDemand has no /nix, so the toolchain cscie103 takes from
# flake.nix is pinned in a [tools] block with a lockfile instead -- the arrangement
# cscie103 itself used before its Nix cutover. That block is added with its versions
# grounded, never guessed.
min_version = "2026.10.4"

[task_config]
# bash -c, NOT sh: sh is dash on Ubuntu and a task body must run the same everywhere.
# cscie103 wraps this in `nix develop --command`; with no Nix here, bash runs directly.
# Multi-command tasks open with `set -euo pipefail`, because overriding the shell drops
# mise's own errexit and pipefail.
shell = "bash -c"

[tasks.fmt]
description = "Apply every safe autofix: formatting AND import ordering"
# TWO OPERATIONS, NOT ONE. `ruff format` handles layout; import ORDERING is the
# I lint rule, fixed by `ruff check --fix`. Treating fmt as though it covered
# both meant every import change became a hand edit lint caught afterwards.
#
# `;` NOT `&&`, AND NOT `set -e`. ruff check --fix exits non-zero when a finding
# has no safe autofix, which with && stopped the formatter running -- and the
# formatter is often what resolves the remaining finding, since line-length is
# fixed by rewrapping. The `lint` gate still reports both, so continuing hides
# nothing.
run = "uv run --no-sync ruff check --no-cache --fix . ; uv run --no-sync ruff format ."

[tasks.lint]
description = "Lint (the same invocation CI uses)"
# WITHOUT --fix, DELIBERATELY. A CI job that fixes its own input can pass while
# the committed code stays wrong.
run = "uv run --no-sync ruff check --no-cache ."

[tasks.types]
description = "Static type check, for every platform this code runs on"
# BOTH PLATFORMS, DELIBERATELY. mypy defaults to whichever OS it runs on and
# NARROWS sys.platform comparisons, so a Darwin-only branch is invisible to a
# Linux run and vice versa. This repo is a macOS laptop plus a Linux runner;
# either gap is a branch nobody checks.
#
# mypy has no native multi-platform mode (python/mypy#12286); invoking it once
# per target is the documented approach and far cheaper than a CI OS matrix.
run = '''
set -euo pipefail
uv run --no-sync mypy --platform darwin
uv run --no-sync mypy --platform linux
'''

[tasks.test]
description = "Hermetic tests: no network, no credentials"
# addopts in pyproject.toml deselects the integration marker, so this is safe in
# check:offline behind the pre-push hook.
run = "uv run --no-sync pytest"

[tasks.check]
description = "The quality gate. CI runs exactly this task; nothing is restated in ci.yml"
# SINGLE SOURCE OF TRUTH. A second copy of the gate list in ci.yml would drift
# the moment a check is added here and forgotten there.
#
# NOT depends = [...]. mise runs dependencies in PARALLEL with no order and
# reports failure as soon as one fails. Observed: `test` failed at 1.4s and
# `types` never reported at all, because mypy was still running and nobody was
# listening. A gate whose result is never printed is indistinguishable from one
# that passed.
#
# scripts/check_all.py runs every gate to completion and reports all failures in
# one pass. Serial and slower, deliberately: on a gate that runs every commit,
# telling the whole truth beats a few seconds.
run = "uv run --no-sync python scripts/check_all.py"

[tasks."check:offline"]
description = "The gate minus anything needing network or Databricks auth (git hooks)"
# SAME LIST, FILTERED -- not a second list. scripts/check_all.py marks each gate
# with whether it needs the network; --offline selects the rest.
#
# WHY HOOKS DO NOT RUN THE FULL GATE: prereqs and env-parity need a live
# workspace and valid auth. A pre-commit that fails on a plane is one people
# bypass with --no-verify, and a bypassed hook catches nothing. CI runs the full
# gate; that is the layer where a bypass is caught.
run = "uv run --no-sync python scripts/check_all.py --offline"

[tasks.setup]
description = "One-command onboarding: dependencies and git hooks"
# `lefthook install` writes into .git/hooks, which is NOT version controlled. A
# fresh clone has no hooks at all, so the person who most needs the guardrails
# is the one running without them.
#
# NO `mise install` HERE. recsys's tools are installed --locked from mise.lock by the
# founding bootstrap, and env:bootstrap (H1) will own that step; setup installs only what a
# fresh clone lacks: the locked environment and the hooks. (cscie103 used nix develop.)
#
# NEVER ADD -f TO lefthook install. Without it, lefthook declines when
# core.hooksPath points elsewhere. With it, lefthook force-installs into
# whatever that path resolves to -- and when that is a GLOBAL hooks directory,
# this repo's hooks start running in every repository on the machine. A real
# 2026 incident; the fix was deleting the flag.
#
# THE QUOTING IS LOAD-BEARING. TOML basic strings treat backslash as an escape
# opener, so a shell body containing `\.sample` fails to parse -- this task was
# written that way first and broke the whole config. Literal strings (three
# single quotes) do no escape processing.
run = '''
set -euo pipefail

hooks_path="$(git config --get core.hooksPath || true)"
if [ -n "$hooks_path" ]; then
  echo "refusing: core.hooksPath is set to '$hooks_path'." >&2
  echo "lefthook would decline rather than clobber it, which is correct --" >&2
  echo "but you would be left with no hooks and no explanation." >&2
  echo "" >&2
  echo "inspect first:" >&2
  echo "  git config --show-origin --get-all core.hooksPath" >&2
  echo "then clear it deliberately:" >&2
  echo "  git config --unset core.hooksPath          # local" >&2
  echo "  git config --global --unset core.hooksPath # global" >&2
  exit 1
fi

uv sync --locked
lefthook install

echo
echo "setup complete. hooks active:"
# RESOLVE THE HOOKS PATH; NEVER ASSUME .git/hooks. In a linked worktree .git is
# a FILE pointing at .git/worktrees/<name>, so `ls .git/hooks` fails with "Not a
# directory" -- and that cosmetic listing once took the exit code with it after
# every real step had succeeded.
hooks_dir="$(git rev-parse --git-path hooks)"
if [ -d "$hooks_dir" ]; then
  ls "$hooks_dir" | grep -v sample | sed 's|^|  |'
else
  echo "  (none found at $hooks_dir)"
fi
'''

# --- Workflow -----------------------------------------------------------------
# EVERY PROJECT OPERATION IS A TASK. Not a remembered command, not a paste from
# scrollback. A one-off CLI invocation is behavior that exists only in one
# person's history: untested, undiscoverable, impossible to change deliberately.
#
# NOTE: there is no `start` task. It ran `git switch -c` inside a mise task,
# which runs in a SUBSHELL -- so the switch died with that subshell and the
# caller stayed on develop, while the task printed "on feature/x" and reported
# success. `start:here` PRINTS the command for the caller to eval instead, and
# `start:check` fails loudly when work happens on a protected branch anyway.
#
# NOTE: there is no pr-wait task. `gh pr checks --watch` exits immediately when
# no check has registered yet, so it reported "no checks reported" and returned
# a verdict it had not determined. `pr` waits properly, in three bounded phases.

[tasks.commit]
description = "Commit exactly the named paths with a conventional message, through the hooks"
# COMMITTING WAS NEVER A TASK, and it is the operation performed most often here.
# Every commit was `git commit --file /tmp/msg.txt --no-verify`, which skipped
# start:check, fmt and lint on every single one -- the gate was reached only at
# push time.
#
# NAMED PATHS, NEVER -A: a stray zero-byte file was swept into a commit that way.
# The outcome is a command-outcome/v1 envelope on stdout and 0, 1 or 2 as the
# exit code, so a caller branches on a refusal without parsing a word.
#
#   mise run commit -- --message "feat(x): subject" --path scripts/x.py
run = "uv run --no-sync python scripts/commit.py"

[tasks.status]
description = "Show branch, working tree, and how it relates to develop"
# READ OPERATIONS ARE PROJECT OPERATIONS TOO. `git status` typed by hand is
# still a throw-away CLI: the next person guesses which flags matter.
run = '''
set -euo pipefail
echo "branch:   $(git rev-parse --abbrev-ref HEAD)"
echo "upstream: $(git rev-parse --abbrev-ref --symbolic-full-name '@{u}' 2>/dev/null || echo '(none)')"
echo
echo "--- working tree ---"
if [ -z "$(git status --porcelain)" ]; then
  echo "clean"
else
  git status --short
fi
echo
echo "--- unmerged into develop ---"
git log --oneline develop..HEAD 2>/dev/null || echo "(on develop)"
echo
echo "--- local branches ---"
git branch -vv
'''

[tasks."start:check"]
description = "Refuse to work on a protected branch"
# Wired into the pre-commit hook so the guard fires before a commit lands rather
# than after. Fails closed, which is what an unattended run needs: it will not
# notice a warning, but it will notice a non-zero exit.
run = '''
set -euo pipefail
# symbolic-ref NAMES THE BRANCH EVEN BEFORE ITS FIRST COMMIT. rev-parse --abbrev-ref HEAD
# fails there, and under set -e the guard crashed instead of deciding (recsys founding F6d).
branch="$(git symbolic-ref --quiet --short HEAD || echo HEAD)"
case "$branch" in
  develop|main)
    # THE ROOT COMMIT IS THE ONE EXCEPTION: no branch can be cut from a main with no commit,
    # so the commit that creates it is allowed, once per repository, and says so.
    if ! git rev-parse --quiet --verify 'HEAD^{commit}' >/dev/null; then
      echo "allowing: '$branch' has no commit yet; this is the repository's root commit." >&2
      exit 0
    fi
    echo "refusing: on protected branch '$branch'." >&2
    echo "" >&2
    echo "GitFlow: work happens on a feature branch cut from origin/develop." >&2
    echo "" >&2
    echo "nothing is lost -- carry the work across with:" >&2
    echo "  git switch -c feature/<slug>" >&2
    echo "or start cleanly with:" >&2
    echo "  eval \"\$(mise run start:here <slug>)\"" >&2
    exit 1 ;;
esac
echo "on $branch (not protected)"
'''

[tasks."start:here"]
description = "Cut a feature branch from origin/develop in THIS shell"
# PRINTS the command instead of pretending to run it, because a mise task runs
# in a subshell and cannot change the invoking shell's branch:
#
#   eval "$(mise run start:here <slug>)"
#
# Uncommitted work carries across automatically: `git switch -c` keeps the
# working tree, so a modified file on develop lands on the new branch.
usage = '''
arg "<slug>" help="Short kebab-case description, e.g. assignment-01-spark-api"
'''
run = '''
set -euo pipefail
slug="$usage_slug"

case "$slug" in
  *[!a-z0-9-]*|"")
    echo "echo 'slug must be lowercase kebab-case: $slug' >&2; false" ;;
  *)
    echo "git fetch origin --prune --quiet && git switch -c feature/$slug origin/develop" ;;
esac
'''

# --- Planning -----------------------------------------------------------------

[tasks."plan:trace"]
description = "Check the plan, its trace and its id ledger agree, and report it as data"
# A MATRIX NOBODY VERIFIES IS AN ARCHIVE: it looks complete because nothing
# contradicts it. This names an item no source authorises, a claim about an
# item the plan dropped, an id never issued and a retired id back in use. The
# same checks run in the test gate; this is the question asked directly.
run = "uv run --no-sync python scripts/plan_files.py"

[tasks."plan:status"]
description = "Decide each step's state from the evidence on origin/develop, and record it"
# THE DECISION IS POLICY. This observes what holds on the integration branch,
# policies/plan decides each step's state, and the decision is recorded under
# .artifacts/plan-status/ so progress is compared from data, not from memory.
run = "uv run --no-sync python scripts/plan_status.py"

[tasks."plan:trailers"]
description = "Refuse a commit that names no plan step, or one never issued or retired"
# TWO POINTS, ONE POLICY. With a message file it is the commit-msg hook; with
# none it judges every commit on this branch since origin/develop, as the gate does.
usage = '''
arg "[message]" help="A commit message file; the branch since origin/develop when omitted"
'''
run = 'uv run --no-sync python scripts/plan_trailers.py ${usage_message:-}'

[tasks."plan:matrix"]
description = "Derive the requirement matrix, record it, and refuse what fails to trace"
# DERIVED, NEVER WRITTEN BY HAND. Every change on develop must trace to a step,
# and every done step to the change that did it; policies/plan decides.
run = "uv run --no-sync python scripts/plan_matrix.py"

[tasks."runs:verify"]
description = "Verify the run ledger's hash chain is intact, and record the run"
# A BROKEN CHAIN IS REFUSED AND NOT APPENDED TO, so the break stays visible.
run = "uv run --no-sync python scripts/run_ledger.py"

[tasks.run]
description = "Run any task, stream its output to the console, and record the run in the ledger"
# EVERY OPERATION GOES THROUGH HERE: mise run run <task> [arguments...]. raw_args passes
# every argument -- --help included -- untouched, and no usage spec reinterprets any.
raw_args = true
run = "uv run --no-sync python scripts/run_task.py"

[tasks."plan:step"]
description = "Read one plan step as validated data and exactly as written, with line numbers"
# THE VALIDATED STEP AND ITS BLOCK AS WRITTEN: an edit anchors on real text, not a guess.
usage = 'arg "<id>" help="Step id, e.g. D.12"'
run = 'uv run --no-sync python scripts/plan_step.py "${usage_id?}"'

[tasks."plan:add"]
description = "Add plan steps, their ids and one trace entry from a spec, preserving every comment"
# tomlkit keeps every comment; the three files are validated together before any is written.
usage = 'arg "<spec>" help="TOML spec: [[steps]] and one [trace]"'
run = 'uv run --no-sync python scripts/plan_edit.py add "${usage_spec?}"'

[tasks."plan:amend"]
description = "Replace named fields of one plan step from a spec, preserving every comment"
usage = 'arg "<spec>" help="TOML spec: id, and a [set] table of fields"'
run = 'uv run --no-sync python scripts/plan_edit.py amend "${usage_spec?}"'

[tasks."plan:record"]
description = "Record trace sources and candidates that need no new step, preserving every comment"
# D.114: each candidate maps to steps already planned or is declared not a plan item; the plan
# and its trace are validated together before either is written.
usage = 'arg "<spec>" help="TOML spec: [[sources]] and [[candidates]]"'
run = 'uv run --no-sync python scripts/plan_edit.py record "${usage_spec?}"'

[tasks."plan:retract"]
description = "Withdraw recorded trace candidates, each with its reason, never leaving a step untraced"
# D.131: an invalid spec, an unrecorded candidate, or a removal leaving a step traced to no
# source writes nothing; each reason is carried in the outcome and so in the signed run record.
usage = 'arg "<spec>" help="TOML spec: [[candidates]] with source, ref and reason"'
run = 'uv run --no-sync python scripts/plan_edit.py retract "${usage_spec?}"'

[tasks."plan:init"]
description = "Start this project's plan, trace and id ledger, refusing when a plan already exists"
# A GENERATED PROJECT'S SECOND OPERATION, after identity:set: its plan starts here.
run = "uv run --no-sync python scripts/plan_init.py"

[tasks."keys:provision"]
description = "Create or load your Ed25519 signing key and publish its public half here"
# D.109: the private key stays under ~/.config, mode 0600; only the public half is committed, and
# only a key listed here ever signs this project's claims.
run = "uv run --no-sync python scripts/signing.py"

[tools]
betterleaks = "1.9.0"
lefthook = "2.2.0"
opa = "1.21.1"
regal = "0.43.0"
uv = "0.12.23"
zizmor = "1.30.1"

[settings]
lockfile = true
minimum_release_age = "2026-10-08T00:00:00Z"

[env]
UV_CACHE_DIR = "{{config_root}}/.cache/uv"

# Ported from cscie103-data-engineering at 58af9d3 (plan A.18): every mutation is a spec.
[tasks."claims:audit"]
description = "Audit the claims register: pillars need contract, task, proofs and passing ledger runs"
run = "uv run --no-sync python scripts/claims_audit.py"

[tasks."test:green"]
description = "Run the full suite, or a selection with its reason, and judge GREEN from the JUnit report"
run = "uv run --no-sync python scripts/green_verify.py"

[tasks."test:red"]
description = "Run one named proof and judge its RED from the JUnit report: exit 0 only for a behavioural red"
run = "uv run --no-sync python scripts/red_verify.py"

[tasks."source:read"]
description = "Read a file's lines, numbered, as data, refusing a missing file or a range past its end"
run = "uv run --no-sync python scripts/source_read.py"

[tasks."source:outline"]
description = "Outline a Python file's definitions with their line ranges, as data"
run = "uv run --no-sync python scripts/source_outline.py"

[tasks."source:search"]
description = "Search tracked source for a pattern, returning each match as data"
run = "uv run --no-sync python scripts/source_search.py"

[tasks."upstream:checkout"]
description = "Check out another repository at a pinned 40-character commit, blobless, under .artifacts/upstream"
run = "uv run --no-sync python scripts/upstream.py"

[tasks."source:port"]
description = "Plan a port: print a source:apply spec bringing files from another checkout, as they are"
run = "uv run --no-sync python scripts/source_port.py"

[tasks."source:apply"]
description = "Create and edit source from a declarative spec, judged by policy, all or nothing"
# THE ONLY WAY SOURCE CHANGES (D.25): a source-apply/v1 spec, or - for stdin. No
# edit logic is written at execution time; runs.source_apply judges every operation.
run = "uv run --no-sync python scripts/source_apply.py"

# Ported from cscie103-data-engineering at 58af9d3 (plan A.20).
[tasks."deps:add"]
description = "Add a dependency with uv and its lock, refusing any change to packages already locked"
# AN ADDITION ONLY ADDS: a stale lock, or any locked package changed or removed, is
# refused and both files restored. raw_args passes --group <name> through untouched.
raw_args = true
run = "uv run --no-sync python scripts/deps_add.py"

[tasks."deps:install"]
description = "Install exactly what uv.lock pins, refusing a lock that no longer resolves"
# --locked, NOT --frozen: --frozen installs a stale lock without complaint and
# lets a later `uv run` fail for it under another step's name. --locked never
# rewrites uv.lock, so starting this task cannot dirty the lockfile (D.9).
run = "uv sync --locked"
