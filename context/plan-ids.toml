  { id = "A.198", first_title = "Hooks are evidence only once observed: lefthook fails closed with assert_lefthook_installed, and hooks:verify observes the effective hooks directory, core.hooksPath with its origin in every config scope, and each required hook present, executable and current, in check, after setup, worktree:add and sync, and in status" },
  { id = "A.199", first_title = "Every git-behaviour proof runs in one hermetic git fixture, global and system config off, an empty template directory, no env-injected config or repository-locating variable, fixed identity and stdin closed, and every refusal proof is differential: the operation succeeds unguarded, fails guarded with its refusal read as a contract, and leaves refs, HEAD and the index unchanged" },
  { id = "A.200", first_title = "A lineage decision passes the governance spine: each ref update is classified into a closed set and recorded as lineage-evidence/v1 observations, runs.lineage judges it per rule as pass, fail or unknown, the decision allows only on an explicit allow with review routed as a named deny, and every decision is appended to a hash-chained audit file the gateway ingests into the signed ledger" },
  { id = "A.201", first_title = "A declared sequence is journaled and resumable: an attempt marker is persisted before every write, and on resume each unfinished write is reconciled from the record it leaves, a commit by its Run-Id trailer, a push by the remote ref, a pull request by its head, a merge by its state, stopping for a person when the outcome cannot be resolved; no write is retried blind, and nothing is compensated by rewriting" },
  { id = "A.202", first_title = "A delivery is a typed agent-workflow/v1 graph, validated before it runs, acyclic, each step a registered capability declaring input and output schemas, effect class, authorization requirement and idempotency policy; the gateway runs it through the journaled step states, and a completed workflow is an in-toto statement signed by the ledger key binding its commit, artifact, policy, test-verdict and decision digests, its identity and its authorizing key, verified by signature and by policy over the claim" },
  { id = "A.204", first_title = "upstream:tip resolves a source's branch to its full commit by ls-remote, without cloning, so a read is pinned to a recorded resolution; a missing, ambiguous or unreachable ref and an option-shaped argument are each refused by name" },
  { id = "A.203", first_title = "sibling:pin writes a sibling's FAS pins from its own flake.lock: each pin is the one version mise lists that matches what nixpkgs ships at the locked revision, and --check refuses a stale pin by name" },
  { id = "A.205", first_title = "Every task and script this repository has that cscie103 lacks at its resolved develop tip is listed by a recorded task, and each is classified in contracts/centralization.toml as generic or project-specific with its reason; an unclassified one is refused" },
  { id = "A.206", first_title = "Every generic capability in contracts/centralization.toml names the cscie103 step and commit that carry it, so a capability born here is centralized, and a generic entry without them is refused by the gate" },
  { id = "A.207", first_title = "worktree:refresh merges without committing, gates and trusts a merged mise.toml that changed, and only then commits the merge, so the merge commit's own hooks run against a trusted config; a refused config is never committed" },
  { id = "A.208", first_title = "sibling:override trusts the clone's own mise.toml too, once judged unmodified at the commit the clone is at, so a sibling on a feature branch runs its own tasks" },
  { id = "A.209", first_title = "sibling:refresh merges a sibling's declared branch into the clone's feature branch: staged without committing, the merged mise.toml trusted only when byte-identical to a reviewed commit, then the merge commit; a conflict stops with its files named and nothing committed" },
  { id = "A.210", first_title = "sibling:conclude finishes a stopped sibling merge: the clone's own plan-file resolver runs first, the merge is refused while any path stays unmerged or any conflict marker remains, its mise.toml is trusted only when byte-identical to a reviewed commit, and the merge commit names the plan step" },
  { id = "A.211", first_title = "sibling:trust shows a sibling clone's edited mise.toml against its commit and trusts it only at the digest its reviewer names, recording the decision; any other content is refused, and an unmodified config needs no review" },
  { id = "A.212", first_title = "A stopped sibling merge stays workable: sibling:refresh trusts the merged mise.toml before reporting a conflict when a reviewed commit holds it, sibling:conflicts reads the clone's conflict blocks as data, and sibling:conclude stages an unmerged path once its file holds no marker" },
  { id = "A.213", first_title = "sibling:conclude refuses, naming them, while any tracked file holds unstaged changes once its resolved paths are staged, so no part of a resolution is left out of the merge commit" },
  { id = "A.214", first_title = "sibling:conclude stages the paths its resolution names with --include, modified, deleted or new, refuses any new file left out and any include with no change behind it, and commits the merge in the cleaned environment" },
  { id = "A.215", first_title = "sibling:override trusts every tracked environment config of the clone, mise.<env>.toml, only when unmodified at HEAD as it trusts mise.toml, refuses a modified one by name, and never trusts an untracked one" },
  { id = "A.216", first_title = "sibling:conclude stages every conflicted path its resolution left without a marker before deciding whether the clone's plan-file resolver runs, so a plan file resolved by hand never reaches the resolver" },
  { id = "A.217", first_title = "source:port plans into a named checkout with --into: judged against that tree, its plan saved under that checkout's .artifacts, and create operations only where the destination keeps no port record, as the canonical source does" },
  { id = "A.218", first_title = "sibling:conclude trusts a merged mise.toml that matches neither parent only at the digest its reviewer recorded against the current HEAD, read into a contract; any other merged content, and a review against another HEAD, is still refused" },
  { id = "A.219", first_title = "sibling:origin realigns a declared sibling's origin to its declared source when only the transport differs, judged on the spine, and refuses an origin that names another repository" },
  { id = "A.220", first_title = "A declared sibling with no FAS mode is cloned only to be measured: its origin judged on the spine and nothing written, trusted or set up, so the hub can read every sibling it declares from FAS" },
  { id = "A.221", first_title = "The site data has two versioned Pydantic contracts, site-project/v1 and site-mechanisms/v1: each document names its contract, every model and technique declares its estimand, unit of analysis, prediction-time inputs, assumptions, diagnostic and limitation, unexpected fields are refused at every depth, JSON Schema and Zod are generated deterministically at build time and committed, drift is refused, golden valid and invalid fixtures get identical verdicts in Python and Zod, every rule JSON Schema cannot express is written on both sides, and one written compatibility policy, shared by every versioned contract the repository publishes, classifies each change and checks superset compatibility" },
  { id = "A.222", first_title = "Displayed counts are derived and completeness is independent: the page shows the validated arrays' lengths, a governed design-acceptance/v1 contract lists each required model and technique with its provenance and is checked against the site data, mutants that drop or renumber an entry are killed, and labs are discovered lazily by glob only as evidence for the registry, which alone declares them, refusing an extra, missing, duplicate or malformed lab" },
  { id = "A.223", first_title = "The design carries the verified additions, required first: models 13, a crossed random-effects bias model, and 14, ordinal regression as a sensitivity rung, and techniques 11, a prediction-interval coverage audit, and 12, a user-level sign-flip permutation test, enter design-acceptance/v1 with their provenance in their own commit, then the site data, each declaring its estimand, unit, prediction-time inputs, assumptions, diagnostic and limitation, with bias defined as the baseline user and movie offsets fitted on the training window, elastic net inside the ridge and lasso rung, ordinal regression out of the exclusions, and each new lab registered as planned" },
  { id = "A.241", first_title = "The three kinds of truth stay separate by audit: requirement contracts, the plan, design-acceptance, the site contracts and quality rules, change only through reviewed commits and a task that writes one is refused; observation contracts carry no verdict, pass or verified field, refused by a structural audit over every contract class; every verdict names its policy and that policy's digest, the digest of the observation it judged and its time, so it can be recomputed offline from those alone; and completion is read only from verdicts and evidence bundles" },
  { id = "A.235", first_title = "data:fetch acquires MovieLens 1M as an untrusted download under a fenced per-checkout lock: its trust root is the reviewed SHA-256 pin committed in the repository, recorded with its origin URL, the date it was first fetched, the publisher's MD5 it was corroborated against and the commit that reviewed it, and never the publisher's MD5, which is checked only against accidental corruption; it fetches only from the allow-listed HTTPS origin, refusing a redirect to another host or a plain-HTTP fallback, to a staging path with a network timeout and bounded retries; it verifies the archive against the pin before opening it, extracts member by member refusing absolute paths, parent references, escaping resolutions, links and devices within size and count limits, verifies each extracted file against its pin, publishes the directory atomically only while its fence is current, does nothing when a verified copy is already published, states that a matching digest proves the bytes equal the reviewed pin and not that the source is trustworthy, and writes observations only, judged on the spine by runs.data_fetch where an unknown observation is refused and every refusal carries a registered problem code" },
  { id = "A.224", first_title = "A teammate on FAS OnDemand reaches a working checkout in one light, non-interactive command whose every input is declared in an onboarding-manifest/v1 requirement contract changed only by reviewed commits: the canonical repository URL from the project identity and the ref with its expected commit, verified after cloning so an origin or HEAD that differs stops onboarding; the tool versions in the FAS tools lock, installed only through tools:install; uv.lock, synced with --locked; the data's origin and SHA-256, fetched through data:fetch; the allowed install locations, the checkout, the uv cache and one kernel directory, with a write anywhere else refused; and the kernel's scope, a user kernel named from the project identity that never overwrites one this checkout did not create. It records each stage only after verifying its result so a rerun resumes at the first unverified stage and a second run after success changes nothing, refuses a kernel whose kernel.json does not name this checkout's interpreter, never executes the notebook, keeps within a declared memory and disk budget, and ends in an onboarding-result/v1 of observations only, judged on the spine by runs.onboarding where an unknown observation is refused and every refusal carries a registered problem code" },
  { id = "A.237", first_title = "notebook:run executes a notebook as governed evidence under a fenced per-checkout lock: papermill in a fresh kernel in an OnDemand Jupyter session, parameters injected only into a cell tagged parameters, the executed copy written, a dirty notebook, lock or data refused, and an ms2-results/v1 contract of observations, versioned under the shared compatibility policy, written only while its fence is current, in which every number is a named field with its unit and tolerance class, exact or a declared rtol and atol, every figure is an entry with its id, path, SHA-256, title, axis labels, caption and the results fields it was drawn from, rendered deterministically so its digest reproduces, and the provenance names the commit, notebook digest, data and lock digests, interpreter version, platform and installed-package digest, seed, split digest and the run's execution id; runs.notebook_run gives the verdict, every refusal carries a registered problem code, two clean runs agree exactly on exact fields and figure digests and within tolerance on the rest, a notebook that relies on hidden kernel state fails, and results bound to another revision or another data digest are refused" },
  { id = "A.225", first_title = "The Milestone 2 notebook gets, understands and cleans MovieLens 1M in order: the group and its members, the data's size in megabytes, what a row and each column mean with shape, types and summary statistics, cleaning driven by a ratings-quality/v1 contract whose validity, uniqueness, referential-integrity and completeness rules each produce pass, fail or unknown with its count and are judged on the spine, a temporal split before any feature is computed with no feature drawn from a rating after its prediction time, and the revised question stated so its answer can be judged, recording every number it reports into ms2-results/v1 as it computes it" },
  { id = "A.238", first_title = "The proposal and the slides are rendered from templates in which every number is a binding to an ms2-results/v1 or site-data path with a declared format rule, so 0.83427 under percent:1 renders as 83.4 percent, and every figure is a binding to a results figure entry by id; the renderer emits a claims-manifest/v1 of observations, versioned under the shared compatibility policy, naming each binding's path, value, rule, rendered text, page or slide and each output's digest, so every rendered number and figure traces through its results entry and execution id to its dataset digest; runs.document_render gives the verdict, every refusal carries a registered problem code, and it refuses a numeral in prose without a binding, a binding whose path is missing, a figure whose file digest differs from its entry or whose source fields are stale, an obsolete results contract version, results whose notebook, data or lock digest differs from the current commit's, and an output edited after it was rendered; its first acceptance test, written red before any step of the milestone is widened, carries one number from the verified archive to a rendered line" },
  { id = "A.226", first_title = "The revised proposal is one to two pages rendered through the document renderer: the question and how it changed, the data source with its link, the cleaned rows and columns, the findings that change the plan and the plan for features, models and evaluation with each method's estimand and assumptions, every number and method bound rather than typed, and each staff condition met if the project is conditionally approved" },
  { id = "A.227", first_title = "The Milestone 2 slides are rendered through the document renderer, numbered with one point each, every number and figure bound rather than typed or pasted, every figure titled with labelled axes as its results entry records, checked from that entry and never by parsing an image, and each member's part named" },
  { id = "A.228", first_title = "plan:add and source:apply are idempotent: a spec already applied is reported as already applied and writes nothing, so a rerun after a partial failure resumes instead of refusing" },
  { id = "A.229", first_title = "The plan's dependency graph is validated, every dependency existing and no cycle allowed, and each dependency's kind, mandatory or discretionary, each milestone's date and each step's owner are plan data, so plan:status reports the critical path to a milestone and each step's float" },
  { id = "A.230", first_title = "Model 13, the crossed random-effects bias model, is fitted at scale on the training window only and proven before it is used: the grouping structure is checked first, user and movie counts, ratings per group and both factors crossing, and refused below a declared minimum; on synthetic ratings with known variance components it recovers them within a declared tolerance over at least twenty seeds; convergence is checked apart from singularity, by agreement of the log-likelihood across optimizers, and a fit that does not converge is refused; a singular fit is reported as an identifiability failure; crossed effects are never fitted as nested; and a cold user or movie is predicted at the fixed effects as its stated limitation" },
  { id = "A.231", first_title = "Model 14, ordinal regression, is a sensitivity rung whose assumption is checked rather than assumed: it recovers known thresholds on synthetic ordinal data, the proportional-odds assumption is tested per predictor with its graphical check beside the test, a violation by some predictors falls back to partial proportional odds, and its expected rating is scored by the same RMSE and MAE as every other model" },
  { id = "A.232", first_title = "Elastic net, inside the ridge and lasso rung, standardises and tunes inside each time-ordered fold only: a mutant that fits the scaler or the penalty on all the data is caught, and its selection stability across folds is reported beside ridge and lasso" },
  { id = "A.233", first_title = "Technique 11, the prediction-interval coverage audit, declares its target coverage levels and its interval methods, bootstrap, Bayesian posterior predictive and split conformal, before any evaluation, then reports each method's empirical coverage on the temporal test set, clustered by user, as a curve across nominal levels and stratified by user activity: on synthetic data with known coverage it recovers that coverage, and the dependence between a user's ratings is stated as its limitation" },
  { id = "A.234", first_title = "Technique 12, the sign-flip permutation test, flips the sign of each user's mean loss difference, never an individual rating: on synthetic correlated ratings under the null it holds its nominal Type I error while rating-level flipping does not, and the symmetry of the per-user differences is reported beside the p-value" },
  { id = "A.243", first_title = "The Phase 12 calibration diagnostic is proven before it is used: each model's point predictions are regressed on the observed ratings, reporting the calibration slope and intercept with their joint test, calibration-in-the-large and a decile plot of predicted against observed means, stratified by user activity so a cold-user miscalibration cannot hide in the pooled figure, and a deliberately miscalibrated synthetic model is flagged" },
  { id = "A.236", first_title = "The research is accepted only against what was declared before results: the primary comparison resolves to one of its pre-specified verdicts, every claim names the diagnostic behind it, and a claim without one, or a result reached with leakage, is refused" },
  { id = "A.239", first_title = "A step starts only when it is ready: worktree:add for a planned step's branch, and any commit naming the step, are refused while any of its mandatory dependencies is not verified, the refusal a typed decision/v1 whose action is blocked and which names the dependency that blocks it" },
  { id = "A.240", first_title = "plan:status distinguishes planned, implemented, tested and verified, and a step is verified only by an evidence bundle bound to its source commit, built from proof-observation/v1 records that only the executor which ran the tests writes from its own JUnit report, each naming the node id, its closed outcome as the report recorded it, passed, failed, error, skipped, xfailed, xpassed or not_run, the report's digest, the commit and tree digest and the run id; a caller-supplied result is refused, failure and error stay distinct, only passed counts, a required proof that is skipped, xfailed, errored or absent leaves the step unverified, and the bundle's red and green verdicts, killed mutants and run records are each hashed and checked by a read-only verifier that fails closed on anything missing, mis-bound or recorded at another commit" },
  { id = "A.242", first_title = "plan:change makes every plan change one governed operation: a plan-change/v1 contract carries the steps, trace entry, record candidates and each finding as a structured record of its id, root cause, resolution and affected steps; it moves through a closed set of states, requested, validated, applied and verified, with refused, rolled_back and failed as the other terminals, each transition written to its journal before the state changes and no terminal state ever changing; before anything is written, runs.plan_change decides a fail-closed preflight that refuses a taken id, a missing dependency, a cycle, an unproven step, a malformed proof target, an unsafe path, a because map that does not cover exactly its dependencies, a branch not matching the feature pattern, and a worktree whose origin is not the project's canonical repository or whose base is not origin/develop; the write, add, record, trace and matrix stages run in the change's own worktree, each recorded on completion so a rerun resumes at the first unfinished stage without duplicating a step, and each emits a CI/CD task-run span sharing the change's trace id and naming the stage, its run id and its result, a refused stage's failure kept distinct from a broken runner's error; every provisional state's rollback discards that worktree, ending rolled_back when it succeeds and failed with the divergence recorded when it does not; verified is entered only after the read-back stages pass; and a plan-change-result/v1 of observations binds the spec's digest to the resulting plan, trace and id-ledger digests, signed where the ledger key is present, and leaving develop and the main checkout untouched" },
  { id = "A.244", first_title = "The walking skeleton runs Milestone 2 end to end at its thinnest before any step widens it: one number, the count of ratings, travels from an archive verified against its pinned digest, through a notebook run that records it in a results contract with its provenance, to one rendered line of the proposal, and that line's claim traces back to the archive's digest; the slice is production code, built red first and proven hermetically on an archive the test makes, and each lane-two step widens it rather than replacing it" },
  { id = "A.245", first_title = "The project site holds no typed-in data: Project Group #34 is its three members with TF mentor Sukanya Krishna and a first TF meeting still to be set, the title is 'A recommender that records why it recommended, and is judged on it', the open seats, the join call and its note are gone, every count and every number in the site's text is bound to its source, the MovieLens figures to the generated movielens.json and the model, technique and milestone counts to their arrays' lengths, a number typed into the site's text is refused by a check, and Results has a section per milestone filled only from recorded evidence, Milestone 2's from milestone2-results/v1" },
  { id = "A.246", first_title = "Models 13, a crossed random-effects bias model, and 14, ordinal regression as a sensitivity rung, and techniques 11, a prediction-interval coverage audit, and 12, a user-level sign-flip permutation test, are on the project site, each with a built interactive lab registered beside M1 to M12 and T1 to T10; ordinal regression leaves the exclusions; the Roadmap to December, the phases, the models and techniques and the interactive mechanisms read fourteen models and twelve techniques from the site data, never from typed text" },
  { id = "A.247", first_title = "cs1090a-recsys's walking skeleton is classified as this project's own in its centralization register, as the hub declines it under X.10, so centralization:inventory passes" },
  { id = "A.248", first_title = "status:paths prints every changed path a commit should name, adopted from cscie103 D.355 at 25ed9e7, where it was ported from this repository's own commit paths, which develop no longer holds" },
  { id = "A.249", first_title = "plan:resolve resolves a merge or rebase stopped on the three plan files as data, appending every entry the other side added and refusing an id issued or an entry edited on both sides, adopted from cscie103 D.129 at 25ed9e7, which ported it from this repository, whose develop no longer holds it" },
  { id = "A.251", first_title = "A registered worktree whose directory is gone is reported prunable and never inspected, adopted from cscie103 D.442 at 9911174, so one vanished snapshot no longer breaks every observation of this repository" },
  { id = "A.252", first_title = "repo:state's report names a worktree git marks prunable and counts nothing inside it, adopted from cscie103 D.443 at d1fbaf0, so this repository's observation survives a vanished snapshot end to end" },
  { id = "A.253", first_title = "The Milestone 2 presentation to TF Sukanya Krishna is scheduled in the week of November 9 and recorded in a reviewed file: eight to ten minutes from the numbered slides, the three members each presenting a named part of roughly equal length following the brief's suggested structure, the conditions summarised if the project is conditionally approved, and the questions for the TF listed" },
  { id = "A.254", first_title = "The deployed project site is develop's: the site with its fourteen models and twelve techniques, each with its lab, is deployed through site:deploy and the deployment recorded, naming the commit it was built from, the deployment id and the model and technique counts the built data carries, so that onboarding begins only once the live site is the one the repository holds" },
  { id = "A.256", first_title = "The Overview page is accurate: the milestones' statuses follow the calendar, Milestone 1 done and Milestone 2 current; Milestone 2 is described as the brief states it, an 8 to 10 minute presentation to the TF with the slides, the notebook and a one to two page revised proposal due Friday November 13 at 9:59 pm ET; and its phases are the data work the brief asks for, the distributional EDA and feature engineering moving to Milestone 3, since the brief puts exploratory analysis and the baseline there; then the site is deployed and the deployment recorded" },
  { id = "A.257", first_title = "The Scope page is reviewed against the data and the review and found accurate: the four removed items with their reasons, the three retained ones with their bound counts, and the principle that every question, feature and metric concerns rating submissions, recorded as asserted content so a later change is a reviewed one" },
  { id = "A.258", first_title = "The Phases page names every model and technique the same way: each reference is a binding to the models and techniques data, rendered as Model N or Technique N with its name, a typed reference is refused by a check, every model appears in the phase the data places it in, Model 10 AdaBoost included in Phase 9, every technique appears in each phase its where names, Techniques 2 and 4 included in Phase 3, and the split's T_test and T_val render as subscripted names; then the site is deployed and the deployment recorded" },
  { id = "A.259", first_title = "The Models and techniques page is accurate: the fourteen models by family and the twelve techniques with where each is used match the data and the Phases page, and the baseline note names Model 12 by binding instead of the twelfth model; then the site is deployed and the deployment recorded" },
  { id = "A.260", first_title = "The Interactive mechanisms page is reviewed from its source: each of the twenty-six labs is titled Model N or Technique N from the data, in the data's order, and every claim a lab states is checked against its computation; then the site is deployed and the deployment recorded" },
  { id = "A.261", first_title = "The Results page is reviewed from its source: each milestone's section states only what its recorded evidence holds, Milestone 2's from milestone2-results/v1, and any model or technique it names is named Model N or Technique N; then the site is deployed and the deployment recorded" },
  { id = "A.255", first_title = "npm 12.2.2 is the site's package manager: installed through the pinned toolchain, the site's dependency install scripts allowed only by an exact-version allowScripts list reviewed in site/package.json, the lock checked for git and remote dependencies that npm 12 refuses by default, and site:build, site:test and site:status proven under it" },
  { id = "A.262", first_title = "The acceptance sandbox copies only what a commit of the working tree could contain, from git's own file list as safeguards.copy_committable does, so ignored build output such as site/node_modules never reaches it and a full gate after a site build is not slowed by copying it" },
  { id = "A.263", first_title = "Every pytest run reports its slowest twenty setup, call and teardown phases over one second, from the one addopts in pyproject.toml, so a gate's time is measured on every run instead of guessed" },
  { id = "A.264", first_title = "worktree:add, refresh and remove share one lowercase kebab-case slug rule, checked before any path or branch is built, so a malformed name such as a branch name is refused instead of reported already removed, while an absent well-formed slug stays the idempotent success D.105 decided" },
  { id = "A.266", first_title = "worktree:refresh gives git merge its Plan-Step message with -m, so a merge stopped on conflicts keeps the step in MERGE_MSG and worktree:conclude commits it, instead of git's default message that commit-msg refuses" },
  { id = "A.265", first_title = "ci:rerun retries, once and through the gateway, a CI run on this branch's current head that finished without any job running a step, refuses every other run, and reads the new attempt back, so a GitHub-side scheduling failure is recovered without a raw gh call, a new full dispatch or a throwaway commit" },
  { id = "A.267", first_title = "A commit is type-checked before it is made: pre-commit runs mypy incrementally, with its cache, on the staged Python files only, so a type error is refused at the commit that makes it, while the full two-platform types gate stays at pre-push and in pr" },
  { id = "A.268", first_title = "The live site's Railway service is declared in Infrastructure as Code, .railway/railway.ts pulled from the live project, with site:config-plan reporting no drift and nothing destructive, the service cut over from Config as Code and railway.json removed, and a deploy afterwards succeeding with no deprecation warning, before Railway stops reading Config as Code on 2026-12-01" },
  { id = "A.269", first_title = "Milestone 2's notebook gets, loads and cleans MovieLens 1M and restates the question the data can answer, covering Phases 0, 1A and 2, and runs top to bottom from a clean kernel under automation, with seeds set, the raw data never modified, and its logic imported from the repository's modules" },
  { id = "A.270", first_title = "Milestone 2's slides, delivered as a PDF of at most ten slides for an eight to ten minute talk to the project TF, run question, data, cleaning, findings and the revised plan with its next steps, carrying charts from the notebook, little text and no code" },
  { id = "A.271", first_title = "Milestone 2's revised proposal, one to two pages, restates the project question the cleaned data can answer, what changed since Milestone 1 and why, and the plan for Milestone 3" },
  { id = "A.272", first_title = "sibling_pins.fetch retries a throttled or transient fetch with curl's own exponential backoff, which honours Retry-After on a 429, bounded by --retry-max-time, so a rate-limited CI runner no longer fails the integration gate while a fetch that keeps failing is still refused by its URL" },
  { id = "A.273", first_title = "Every Railway CLI task runs the CLI from the site's locked install: the locked packages are installed first when absent, and the CLI is run by an npm script resolving to @railway/cli's own binary, never through npx, which falls back to the registry and resolves the name railway to Railway's IaC SDK" },
  { id = "A.274", first_title = "mypy searches scripts/ exactly as pytest imports it, mypy_path matching pythonpath, so the staged type check resolves a test's imports when the test is staged without the script it imports, and the full two-platform gate still passes with no module found twice" },
  { id = "A.275", first_title = "Each platform keeps its own mypy cache, .mypy_cache/darwin and .mypy_cache/linux, shared by the staged check and the full types gate, so a check after another runs incrementally instead of starting cold because the other platform's run had invalidated every entry" },
  { id = "A.276", first_title = "site:test runs vitest from the site's locked install, by the npm script test after site:install, never through npx, and no task reaches any tool through npx, so the site's tests run in a fresh checkout as the Railway tasks do since A.273" },
  { id = "A.281", first_title = "The project site prints its content and nothing covers it: a print stylesheet, by CSS media query and never by script, hides the sticky navigation and other screen-only controls or makes them static, keeps every page's text, readouts, provenance and footer, and lets no fixed element repeat over content on any printed page, proven against the built stylesheet and confirmed on a printed page of the live site" },
  { id = "A.282", first_title = "The project site states the evidence chain on every page it governs: Overview, Scope, Phases, Models and techniques, Interactive mechanisms and Results each say how a recommendation becomes a traceable decision with supporting evidence, Policy as Code to Evidence as Data to Evaluator to Verdict to Decision to Enforcement, offline and within the TF's scope, and name each of the seven disciplines with its status and the step that delivers it, or the reason it is outside the TF's scope" },
  { id = "A.283", first_title = "Every offline evaluation run's evidence is a validated data structure: an evaluation-evidence/v1 record per run names the data snapshot's hashes, the protocol digest, every seed, the code commit, the environment lock, the tuning budget and each metric with its user-clustered interval, its schema is committed, and a record missing any of them is refused" },
  { id = "A.284", first_title = "Every offline evaluation follows one documented protocol fixed before any result: contracts/evaluation-protocol.toml declares the split quantiles, the baselines, the tuning budget, the metrics and the pre-registered primary test, every evidence record names its digest, and a split audit refuses a training rating dated after the test boundary and reports the cold users and movies the split creates" },
  { id = "A.285", first_title = "A policy gate decides whether the evidence supports each conclusion the project reports: a Rego policy over the evidence records returns a verdict, the verdict becomes a decision, and the report and site state a conclusion only through that decision, so a missing reproduction, a leaking split or an interval that overlaps the baseline blocks the conclusion, and any claim that a recommendation changed user behaviour is refused, since causal evaluation is outside the TF's offline scope" },
  { id = "A.286", first_title = "Every research conclusion traces to the offline run that supports it: each measured Results row and the primary verdict name their evidence record's run id and digest, and the site build refuses a result or a verdict that names none" },
  { id = "A.287", first_title = "Reproducibility is tested automatically: a recorded offline run is re-run from its evidence record alone, its data snapshot, seeds, protocol and commit, and its metrics must match the recorded ones within a declared tolerance, while a changed data snapshot is refused before anything re-runs" },
  { id = "A.288", first_title = "Each model's offline predictions are explained from the model that made them, never a mimic: coefficients for the linear rungs, permutation importance on the temporal validation set, and exact tree attributions computed on the fitted tree ensembles, each explanation recorded beside the evidence run of the model it explains" },
  { id = "A.289", first_title = "Each conclusion is re-judged on later time windows, offline: a rolling-origin re-evaluation over the MovieLens timeline judges each later window by the same gate, measures how far each window's feature distributions have drifted from training, and reports any window that breaches its declared threshold, a temporal-robustness check with no deployment or online monitoring, which are outside the TF's scope" },
  { id = "A.290", first_title = "The project card names the first TF meeting as scheduled, Friday, November 13, 2026, at 7:00 PM ET, in place of TBD" },
  { id = "A.291", first_title = "The evaluator is separate from every model, as a recommender must itself be evaluated as a treatment: the offline evaluation harness alone holds the split, the held-out ratings and the metric code, a model receives only the user, movie and time of each rating it must predict and returns predictions, and a model that reads a held-out rating is refused" },
  { id = "A.292", first_title = "Every feature is point-in-time correct, and stricter than an inclusive bound: each value for a rating is built only from ratings dated strictly before it, since MovieLens timestamps have one-second resolution and collide, so a same-second rating, the target included, never feeds its own features, and a feature built from a same-second or later rating is refused" },
  { id = "A.293", first_title = "Every offline pipeline stage records its lineage as OpenLineage run events: loading, the structural audit, the split, the features, each fit and each evaluation write a START and a COMPLETE event as JSON files, naming their input and output datasets with digests, so every evidence run traces back to the three MovieLens files" },
  { id = "A.294", first_title = "The site states which 2026 industry practices the project applies offline and which are outside the TF's scope: Overview lists each practice with the step that applies it or its reason, Phases states the strict point-in-time rule and the lineage record, and Results states that predicting a rating well is not evidence that recommending it adds value" },
  { id = "A.295", first_title = "Offline experiment runs are tracked in a local MLflow file store, with no server: each fit logs its parameters, seed, runtime and metrics, each fitted model is a logged model linked to the digests of the datasets it was trained and measured on, and each evidence record names its MLflow run and model ids, so the typed record stays the source of truth and MLflow the index" },
  { id = "A.296", first_title = "Every offline prediction is recorded as typed, append-only evidence: the predicted rating, the model id, the evaluator run, and each feature's provenance, the latest rating time it was built from, so one prediction traces to its inputs, and a record that is rewritten is refused" },
  { id = "A.297", first_title = "Each reported conclusion is sealed in an immutable evidence bundle with a reproducibility manifest: the code commit, the uv.lock digest, the data hashes, the evidence and prediction records, and the OpenTelemetry trace ids a file exporter writes offline for every stage, content-addressed so any changed artifact breaks the bundle's digest" },
  { id = "A.298", first_title = "The site shows the research architecture: Models and techniques draws the flow from versioned MovieLens data through the split, the models, the evidence, the evaluator, the verdicts and the decision policy to the immutable evidence bundle, names each of the seven typed components with the step that builds it, and Results names the decision each pre-registered verdict leads to" },
  { id = "A.299", first_title = "Each prediction's outcome is a separate, append-only record written only when its ground truth is observed: it references the prediction id and holds the observed rating with its event and observation times, a prediction record never carries or is edited to carry its outcome, an outcome observed before its prediction was made is refused, and evaluation joins outcomes to predictions as of a stated time, as monitoring platforms join delayed actuals by prediction id" },
  { id = "A.300", first_title = "Every rating carries two times, its event time, when the user rated the movie, and its observation time, when the system learned of it: MovieLens 1M records only the event time, so the research policy declares the observation-time assumption a time-ordered replay uses, the files' acquisition time and digest are recorded as their real observation, and a feature built from a rating observed after the prediction time is refused" },
  { id = "A.301", first_title = "The site shows an illustrative prediction evidence record, labelled as simulated and never computed from MovieLens: Models and techniques sets the prediction record, written when the prediction is made, beside its separate outcome record, written only when the ground truth is observed, and Phases states the event-time and observation-time rule" },
  { id = "A.302", first_title = "The evidence, verdict and decision boundary is typed in Pydantic v2: frozen models and StrEnum verdicts and actions; an EvaluationPolicy that declares the test statistic, the interval method, the significance level, the practical threshold and the rule for a test and an interval that disagree; a ComparisonEvidence whose validators refuse an interval out of order, one that excludes its own point estimate, or one built by a method the policy does not declare; and an EvaluationResult naming the policy and evidence digests it was reached from, with every schema committed" },
  { id = "A.303", first_title = "The statistical evaluation package produces comparison evidence and never a decision: the paired improvement's interval from a bootstrap that resamples users, not ratings, the pre-declared user-level sign-flip test, Holm adjustment across the exploratory comparisons, a test window evaluated exactly once, and practical and statistical significance reported apart" },
  { id = "A.304", first_title = "Results states how a verdict is reached: the pre-registered verdicts restated against the practical threshold declared before any result, the three-sided rule and the agreement it requires between the interval and the sign-flip test, and a worked example, labelled hypothetical, in which a lower observed RMSE with an interval from minus 0.005 to 0.045 is inconclusive" },
  { id = "A.305", first_title = "The research policy declares three research questions and what MovieLens 1M can answer: whether a model predicts a user's next observed rating, the primary objective; whether a prediction can be reproduced and its model-based basis explained, an independently testable objective with its own criteria, reproduction within tolerance, complete lineage and feature provenance, and explanations recomputed from their recorded method and version; and whether showing a recommendation caused a user to watch or enjoy more, a future research extension needing randomized exposure; every reported claim names its question, and a claim on the third is refused" },
  { id = "A.306", first_title = "The site states the three research questions: Overview gives each its answerability, its role and its evidence, laid out to print in full, Scope names causal recommendation effectiveness as a future research extension and the randomized exposure or holdback data it would need, and the causal discipline points to that extension" },
  { id = "A.307", first_title = "The research system is one uv-locked package whose modules are enforced boundaries: contracts, data_pipeline, models, evaluation, evidence and governance as subpackages with an offline research runner, and Import Linter contracts in the gate so that models cannot import the evaluator, evaluation cannot import the decision layer, and governance imports only contracts and evidence, with no dashboard application since the static project site is the report" },
  { id = "A.308", first_title = "The site states the research objective and why to trust it: Overview states the objective, a leakage-safe MovieLens rating prediction system whose model selection, performance, uncertainty and conclusions rest on versioned, reproducible evidence and explicit policies, and the three meanings of why, each with its steps; Phases lists the delivery priorities to December 10 as essential, useful extension or future research, each with its steps; and Models and techniques states the code organisation and its boundaries" },
  { id = "A.309", first_title = "The practical threshold is a first-class decision record, contracts/practical-threshold.toml validated by a Pydantic contract: its method family, its anchor and the source that justifies it, its formula relative to the baseline's RMSE on the same test window, its sensitivity bounds, a detectability check run on the validation window only, who decided it and when; the gate reaches no verdict without the record, refuses one declared after the test window was first read, and reports the verdict at each sensitivity bound beside the primary one" },
  { id = "A.310", first_title = "Results states how the practical threshold is set and its status: the proposed formula, 1% of the baseline's RMSE on the same test window, anchored to the Netflix Prize's progress bar, the sensitivity bounds at half and double, the detectability check on the validation window, the magic-barrier caution that rating noise makes small differences harder to resolve, and that the threshold awaits the group's decision" },
  { id = "A.311", first_title = "The practical threshold is declared before any result, as a preregistration: contracts/practical-threshold.toml, committed on 12 November 2026 while no result exists, names its method, anchor, sources, formula of 1% of the regularised bias baseline's RMSE on the test window, sensitivity bounds, detectability rule, who decided it and when; the commit's timestamp is the registration, the file is never edited, and any later change is a dated amendment file" },
  { id = "A.312", first_title = "Every recorded explanation is checked against the model that made it: an additive explanation, the bias model's global mean and user and movie offsets, a linear model's coefficient-by-feature terms, or exact tree attributions, must sum to the prediction within a stated tolerance, and masking its k largest contributors must move the prediction more than masking k control features, the masking test 2026 recommender studies apply to explanations; an explanation that fails either is refused" },
  { id = "A.313", first_title = "The evaluator cannot be edited after the declaration: before the test window is first read, the evaluation package's source digest is recorded as a dated amendment beside contracts/practical-threshold.toml, and the gate refuses any verdict whose evidence was produced by evaluator code with another digest, as 2026 audits of self-evolving recommender loops ask for an evaluator the evaluated system cannot change" },
  { id = "A.314", first_title = "The project publishes an Evaluation Card for its primary comparison in the 2026 Evaluation Cards rollout hierarchy, MovieLens 1M, then Protocol A's split, then each metric, with its four signals, reproducibility, documentation completeness, provenance and score comparability, each computed from committed evidence and never typed by hand" },
  { id = "A.315", first_title = "The site states this round's practices and how each prediction is explained: Overview's industry practice list gains verified masking of explanations, a frozen evaluator and Evaluation Cards with their steps, and statement ranking and LLM components with why they are outside scope; Models and techniques states, for each model family, the explanation that sums to its prediction and the masking check it must pass" },
  { id = "A.316", first_title = "Every fitted model and every sealed evidence bundle carries an in-toto statement with a SLSA v1 provenance predicate: its content digest as subject, the source repository and commit, the builder, the run gateway on a named device, and the run's ledger id, signed in a DSSE envelope with the device key the run ledger already uses; the gate admits no model or bundle whose attestation is missing, unsigned, or names another digest" },
  { id = "A.317", first_title = "Every prediction record carries a split-conformal interval at a declared coverage, calibrated on the validation window's residuals and never on the test window; because a temporal split breaks the exchangeability conformal guarantees assume, the test window's empirical coverage is reported overall and per user-activity band, and a band below its declared coverage is reported, never hidden" },
  { id = "A.318", first_title = "MovieLens 1M has a BenchmarkCard committed before evaluation that separates task assumptions, that ratings are submitted preferences, that timestamps are submission times, and how users' sign-up rating bursts shape the timeline, from outcome assumptions, that a lower RMSE means better recommendations, and a staged evaluation tests each task assumption on the data while outcome assumptions are stated as untestable offline" },
  { id = "A.319", first_title = "The site states this round's practices and shows confidence beside contributors: Overview's practice list gains model attestations, MLflow autologging, a BenchmarkCard with staged evaluation and conformal confidence with their steps, and knowledge-graph and LLM reasoning and runtime verification with why they are outside scope; the illustrative evidence record gains its confidence interval" },
  { id = "A.277", first_title = "Every task and script cscie103 lacks at its resolved develop tip is classified in contracts/centralization.toml: types:staged and its script, rebase_state.py and site_deployed.py now; and a proof in the integration tier, which CI runs with network, fails whenever one is unclassified, so a new capability cannot land unclassified again" },
  { id = "A.278", first_title = "The hermetic test gate's deadline is computed, not typed: check_all.py declares the slowest passing run measured, with its host and date, and the runaway-backstop multiplier, and the gate's timeout is their product, so a suite that is slow but passing is never killed and a hung one still fails; a proof holds the arithmetic" },
  { id = "A.320", first_title = "Every raw_args task declares its arguments as its script states them: each of the twelve tasks that forward arguments unparsed carries a mise usage spec, which mise tasks info and --help show while the arguments still pass unchanged, and A.44's capability findings refuse a raw_args task with no usage spec or with an argument its script's own usage line does not name; it is the first slice of A.178's declared inputs, later moved into A.162's typed input schemas" },
  { id = "A.321", first_title = "secrets:report is ported from cscie103's D.465 at its merge commit, so this repository's failing secrets (history) gate names each finding by rule, file, line, commit and fingerprint on the spine, never its secret, halting on a failed, reshaped or self-contradicting scan, and the finding can be classified" },
  { id = "A.322", first_title = "The secrets (history) gate's one finding is classified by its fingerprint: generic-api-key at scripts/tools_verify.py:35 in 549173b4 pins nodejs/release-keys by a public commit SHA, so it is a false positive, suppressed in .betterleaksignore by that commit-scoped fingerprint alone with its reason, reviewer, date and re-review trigger, never by a path or rule allowlist" },
  { id = "A.323", first_title = "The secrets (history) gate judges the history of the branch it gates, not every local ref, so an unlanded local branch cannot fail another branch's gate, while secrets:report keeps scanning the whole history as the baseline" },
  { id = "A.325", first_title = "DATA.MEMBER_UNSAFE's mutant disables the unsafe-member rule and still compiles: the iteration that binds each unsafe member name iterates an undefined input path instead of being replaced by false, so safeguards:prove judges the guard by its proof rather than reporting the trial inconclusive because the policy no longer compiles" },
  { id = "A.326", first_title = "Milestone 2's wrangling is a module of pure functions, scripts/wrangling.py, that the notebook only calls: it reads MovieLens 1M's ratings, users and movies as their documented columns and types, judges them by a ratings-quality/v1 contract whose validity, uniqueness, referential-integrity and completeness rules each give pass, fail or unknown with its count, splits the ratings at one absolute time point so every training rating precedes every test rating, and refuses a feature computed from a rating after that point, each proven by pytest on rows the test writes, the raw files never modified" },
  { id = "A.327", first_title = "The steps done outside this repository or bound to FAS OnDemand are retired as decisions, each with its reason, once A.82's plan:decide records one: A.224 because FAS OnDemand is closed and development moved to the MacBook Pro; A.226, A.227, A.238, A.253, A.270 and A.271 because the group prepares the revised proposal, the slides and the presentation outside the repository; and A.269 because A.225 supersedes it" },
  { id = "A.340", first_title = "The integration gate's deadline is computed as A.278 computes the test gate's: check_all.py declares the slowest passing integration run measured, with its host and date, and the gate's timeout is that times the runaway-backstop multiplier, so the integration tier that passes in 1130 s on FAS node cr-2 is never killed at a typed 1200 s, and a hung one still fails" },
  { id = "A.328", first_title = "Every cleaning check the Milestone 2 brief lists is a pure function of MovieLens 1M's raw files in the wrangling module the notebook only calls: the archive's size in megabytes, each numerical column's count, mean, minimum and maximum, the missing fields per column and by group counted on the raw text, each impossible demographic value counted by the documented rule it breaks, and every rating class counted even when empty, so the notebook reports each with its finding and decision" },
  { id = "A.329", first_title = "ms2:execute runs the committed Milestone 2 notebook in a fresh kernel by nbclient on the MovieLens 1M folder data:fetch verified and published, and saves the executed notebook with its outputs and figures and its results file into a named folder, refusing a folder that lacks any of the three tables before any kernel starts, so the notebook submitted for Milestone 2 shows its findings on the real data" },
  { id = "A.330", first_title = "The Milestone 2 notebook answers its review: it reports the joined table's rows and columns after cleaning, audits the time-point split for test ratings whose user or movie never appears in training, shows every time as its UTC date, replaces the all-zero missing-data plot with ratings per user, prints each finding on one readable line with class shares, names TF mentor Sukanya Krishna in its header, and ends its cleaning with a data wrangling summary table of check, finding and decision computed from the data" },
  { id = "A.331", first_title = "The Milestone 2 notebook puts each test rating in exactly one bucket by its training history, warm, new user, new movie or both new, reports the buckets and plans the evaluation per bucket with a new user predicted by the movie's training mean, and lists each of the joined table's ten columns with its type and meaning" },
  { id = "A.333", first_title = "Each type gate's deadline is computed as A.278 and A.340 compute the test tiers': the slowest recorded run of the type checks on FAS node cr-2 times the runaway-backstop headroom, so a passing type check is never killed under check's load and a hung one still is" },
]
