  { source = "TEMPLATE", ref = "day one", text = "its own plan, from day one", maps_to = ["A.1"] },
  { source = "SESSION", ref = "2026-10-15 F6c", text = "recsys is founded by porting cscie103's governance kernel; it was not generated from the platform template that the day-one TEMPLATE source describes", maps_to = ["A.1"] },
  { source = "SESSION", ref = "2026-10-15 F6c", text = "a 0600 key under a group-writable directory can be replaced: make the directory 0700 and refuse the key at use", maps_to = ["A.2"] },
  { source = "SESSION", ref = "2026-10-15 F7", text = "the pre-push gate failed closed on twenty gates naming scripts, tasks or tools recsys does not have", maps_to = ["A.3", "A.4"] },
