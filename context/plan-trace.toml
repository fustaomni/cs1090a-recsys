  { source = "SESSION", ref = "2026-10-15 founding outstanding", text = "the founding left seven known debts: patches unchecked, pins in two places, group-writable state, unattested tools, stray installs, Regal findings, withdrawn gates", maps_to = ["A.6", "A.7", "A.8", "A.9", "A.10", "A.11"] },
  { source = "SESSION", ref = "2026-10-15 A.9 rerun", text = "a repeated commit sent an empty stage to git; the task reported lefthook's banner, and git's reason, printed on stdout, was lost", maps_to = ["A.12"] },
  { source = "SESSION", ref = "2026-10-15 spec-driven mutation", text = "every repository mutation goes through mise run run source:apply with a spec on stdin; plan specs are created under .artifacts/plan-specs by the same task. source:apply lands whole once, as the precedent requires: it cannot apply its own first implementation.", maps_to = ["A.18"] },
  { source = "SESSION", ref = "2026-10-15 publishing", text = "A.18 cannot reach develop: pr is not on develop, and a raw push or gh merge is forbidden. pr arrives with its closure, so the branch publishes itself.", maps_to = ["A.19"] },
  { source = "SESSION", ref = "2026-10-15 publishing needs a check", text = "pr fails closed when no check reports: verify_checks refuses an empty rollup and readiness waits on zero checks. recsys has no CI, so publishing needs its own quality gate workflow first.", maps_to = ["A.20"] },
  { source = "SESSION", ref = "2026-10-15 phase S and the source:apply lesson", text = "source:apply existed in cscie103 at fb58ccd, nine days before recsys was founded, and the founding port left it out; edits then went through hand-built heredoc writers, and the paused port's copies, provenance edits and deletions bypassed it even after it arrived there. Phase S closes that: deps:add (A.21), the zizmor pin (A.22), the workflow audit (A.23), ci.yml (A.20), pr (A.19), and removal through a spec (A.24), so the port resumes with every write judged.", maps_to = ["A.21", "A.22", "A.23", "A.24"] },
  { source = "SESSION", ref = "2026-10-15 raw operations in every run", text = "Every run still used raw operations: mise trust, lock and install, the founding gate as raw opa eval, the trust log by printf, git clone and show of cscie103, git status and log, and spec builders as raw uv run python. None left a run record. A repository cannot trust itself, so trust is a machine-level task; the rest become repository tasks. worktree:add could only cut from origin/develop, so it gains a base first.", maps_to = ["A.25", "A.26", "A.27", "A.28", "A.29"] },
  { source = "SESSION", ref = "2026-10-15 critique rounds 1-4 (C1-C34)", text = "Thirty-four critiques of the A.25 arrival script, each grounded by a live 2026 search and recorded before any code. They found: a readable policy file taken for an admitted set and failed reads taken for absence; RED and GREEN asserted from log text with exit statuses discarded and set -E mistaken for errexit; a shared scratch log; task definitions read by line number; no authorisation, preflight, sealed plan, transaction, receipt, deadline, lock or idempotency; no typed result, events, provenance or post-apply policy evaluation; pillars credited by file names; unversioned machine scripts sourced into every run, with mise trust bypass CVE-2026-35533 in scope; and two proposed orchestrators that reintroduced refuted patterns. The register resolves them as steps A.30-A.81 and decisions A.50, A.70, A.75, A.76, in a single acyclic graph: A.26-A.28 now depend on A.18, since all work stays on this branch, A.29 stays done with pinning carried by A.62, and A.64 precedes A.25. Implementation order: inspection (A.52, A.36), then A.31, A.32, A.34, A.35, then A.41, A.38, A.55, A.62, A.72, A.73, then the rest by dependency.", maps_to = ["A.30", "A.31", "A.32", "A.33", "A.34", "A.35", "A.36", "A.37", "A.38", "A.39", "A.40", "A.41", "A.42", "A.43", "A.44", "A.45", "A.46", "A.47", "A.48", "A.49", "A.51", "A.52", "A.53", "A.54", "A.55", "A.56", "A.57", "A.58", "A.59", "A.60", "A.61", "A.62", "A.63", "A.64", "A.65", "A.66", "A.67", "A.68", "A.69", "A.71", "A.72", "A.73", "A.74", "A.77", "A.78", "A.79", "A.80", "A.81", "A.82"] },
  { source = "SESSION", ref = "2026-10-16 A.32 design: a feature brings several proofs red at once", text = "Designing A.32 showed that a new feature's proofs all fail together, while test:red accepts one named proof and refuses when any other test fails, so it cannot certify such a red. Until A.83 lands, a multi-proof red is claimed only as exit 1 with a report from that run.", maps_to = ["A.83"] },
  { source = "SESSION", ref = "2026-10-16 A.36 inspection: source:search reads patterns as basic regex", text = "source:search hands its pattern to git grep without -E, so the pattern is basic regex, where parentheses and the bar are literal. An extended-looking pattern then either fails to parse or matches nothing, and nothing matching looks like absence: the earlier provenance search for ported policy paths, path = (policies/machine/(setup|environment)/|...), returned zero for that reason and is not evidence that those paths are absent. The search tool must match in one declared dialect and record it.", maps_to = ["A.84"] },
  { source = "SESSION", ref = "2026-10-16 A.84 inspection: adapted ports were hand-patched", text = "Changing the ported source_search.py requires a vendor patch and an [[adapted]] provenance entry, which test_provenance.py proves by reversing the patch to the upstream digest. No task produces either: all nineteen existing adaptations were written by hand. provenance:adapt plans both as one source-apply spec after checking the upstream copy against the recorded digest and proving the patch reverses, and A.84 is its first use.", maps_to = ["A.85"] },
  { source = "SESSION", ref = "2026-10-16 A.52 second pass: the ledger's guards", text = "The chain rule ERR_LEDGER_CHAIN_BROKEN was tested only through verify's intact flag, never by the policy's code, so a disabled rule would survive; A.86 adds the policy-level proof and registers all five ledger guards. A live search showed that truncating a hash chain's tail leaves a valid, shorter chain, caught only by a signed checkpoint of the length and head; this ledger has that exposure, recorded as A.87.", maps_to = ["A.86", "A.87"] },
  { source = "SESSION", ref = "2026-10-16 A.86 trials: proofs that passed were judged stale", text = "safeguards:prove judged a passing baseline and a passing control as reports that predated their runs. A report's mtime is stamped by the file system's clock, which on network storage is the server's, while started came from time.time(); a sub-second proof falls inside the skew. Freshness is now compared in one clock, from a marker written in the report's directory before the run, and a run that writes no report returns its exit code and last line of output.", maps_to = ["A.88"] },
  { source = "SESSION", ref = "2026-10-16 gateway inspection: 30 closed codes under policies/runs, 13 registered", text = "Thirteen of the thirty closed codes under policies/runs are registered safeguards: run_request (the gateway), git_spawns, signing_keys and source_outline hold the other seventeen, and packages outside runs may hold more. Registering them one by one invites the omission that left three source:apply guards unproven, so a coverage proof reads every closed code under policies and requires each to be a registered guard; it turns green only when the last is registered and its mutant killed.", maps_to = ["A.89"] },
  { source = "SESSION", ref = "2026-10-16 runs 5ea06d4adbf748f7b9fb37888fd7d0df and ab3f2b3ec8744b16b308393547c4c824", text = "The full online check failed on one lane: test (integration) collected 330 items, deselected all 330, and pytest exited 5, NO_TESTS_COLLECTED, which run_gate counts as failure. No test is integration-level, so check could never pass and every gate run used check:offline. Passing an empty lane would hide a unit lane whose tests vanished, so a lane declares whether it may be empty, and an allowed empty lane is reported as nothing_to_run: neither pass nor failure, named in the summary.", maps_to = ["A.90"] },
  { source = "SESSION", ref = "2026-10-16 run 80b3d2437bbd4b88806972e5979a5313 and its neighbours", text = "Forty-seven commits existed only on this machine, and the ledger anchor protects only once it is where the ledger's writer cannot reach. No task, script or policy on this branch pushes: a push would have been a raw git push with nothing refusing develop or main. branch:push derives the refspec from HEAD so a branch is written only to its own ref, never forces, and runs.branch_push refuses an absent request, a detached head, a protected target and a commit with no passing check recorded in the ledger.", maps_to = ["A.91"] },
  { source = "SESSION", ref = "2026-10-16 A.65 inspection of plan_status.gather", text = "plan:status builds its proofs fact by parsing the test functions defined in files on the ref, so a proof expectation is satisfied when its test exists, not when it has passed: a step can read as done while its proof is red. A live search found the same failure named in traceability practice, where a linked test can still be red and linked alone reports it as covered. A.65 registers green-verdict/v1 by test:green as the proof kind's runtime record; A.92 makes plan:status require it.", maps_to = ["A.92"] },
  { source = "SESSION", ref = "2026-10-16 A.93 inventory through the three-step error protocol", text = "worktree:add existed only on another branch and cut only from origin/develop, so stacked work could not get its own worktree, and every worktree needed a shell step to be trusted. The real upstream paths were found in the provenance record of the pinned commit after six guessed paths were not_found: worktree.py with setup_env.py and env_sync.py, the machine.setup policy in setup_env.rego and machine.environment in environment.rego, and the worktree env, refresh and remove tests; the conflicts and continue tests need rebase_state and move to a later artifact. A 2026 search found base refs resolved explicit first, never hardcoded, and trust granted per worktree only after review; this project's own earlier port found branches must be created with --no-track. Refresh still rebases onto origin/develop; refreshing a stacked branch onto its base remains A.25's.", maps_to = ["A.93"] },
  { source = "SESSION", ref = "2026-10-16 project site request", text = "The project needs a public site to show the professor it can be completed end to end before December and to recruit at least three members, since a solo group is not allowed. It shows the scope after review, the phases, the models with their baselines and the supporting techniques, interactive 3D mechanisms, and results updated at each milestone. A 2026 search found Railway building React on Vite from railway.json in the repository and redeploying on every push of a tracked branch, a committed lockfile required, and site data kept as one source of truth the pages render, with CI refusing drift.", maps_to = ["A.95"] },
  { source = "SESSION", ref = "2026-10-16 provenance:adapt FileNotFoundError in the project-site worktree", text = "provenance:adapt raised FileNotFoundError in a worktree cut by worktree:add, because the pinned cscie103 checkout lived only in the worktree where upstream:checkout ran: .artifacts is ignored, and git does not carry ignored files into a new worktree. A 2026 search confirmed ignored files never come along to a new worktree, that download caches should be shared per clone, and that git worktree remove deletes ignored files without asking. This project's own earlier tooling resolved the same class with one evidence root per clone, the main checkout's .artifacts found through git's worktree list, which the run ledger already uses. Pinned checkouts move there, and a missing upstream is refused with a closed outcome.", maps_to = ["A.96"] },
  { source = "SESSION", ref = "2026-10-16 source:apply founding_refused with no reason", text = "source:apply refused a mise.toml with only the message that the founding policy refuses it. Reading policies/founding/mise_config.rego showed the cause, a task key outside allowed_task_keys, but the policy's violations set, which says exactly that, never reached the operator: founding_allows evaluates allow alone and returns a boolean. A refusal must carry each violation so the fix starts from the rule, not from reading the policy.", maps_to = ["A.97"] },
  { source = "SESSION", ref = "2026-10-16 railway status deprecation warning", text = "railway status warned that Config as Code (railway.json) is deprecated in favour of Infrastructure as Code in .railway/railway.ts, and that existing files keep working only until 2026-12-01, nine days before the project's final milestone on December 10. The site's configuration moves before then, through railway config migrate, so the deployed site cannot stop building in the last week.", maps_to = ["A.98"] },
  { source = "SESSION", ref = "2026-10-16 22 example specs registered, then build started", text = "Twenty-two lab specs, one per model and technique, were critiqued against live 2026 sources and registered before any code, with seven design corrections recorded along the way. Every lab computes its numbers, curves and surfaces from seeded data in the browser; nothing on screen is drawn by hand. A 2026 search grounded the stack: Plotly's gl3d partial bundle carries scatter, scatter3d, surface and mesh3d, and plotly.js 4 shows a cloud button by default, so it is turned off; heavy chart code is split behind React.lazy and a dynamic import so the page stays small; Vitest 5 runs the math proofs on Node 22.12 or later with Vite 7; and Math.random cannot be seeded, so a mulberry32 generator draws the data.", maps_to = ["A.99"] },
  { source = "SESSION", ref = "2026-10-17 critique C1: model parameters are learned artifacts with a traceable origin", text = "Critique 1: a parameter such as 0.627 means something only with the training rows, feature definitions, scaling and model specification that produced it, so a fit must pass the same declared, observed, evidence, verdict and decision chain as every other governed action. 2026 practice: provenance records for training inputs, steps and packaged outputs, with CI gates that verify approved provenance before promotion; lineage events bound into attestations for attestation-gated, reproducible promotion that detects unverified or mis-ordered stages; ML-specific facts inside SLSA-style provenance; point-in-time feature correctness; data version and model schema pinned per run. Resolution: a declared model-run contract (features, quantile cutoffs, method, grid, seed, scaler, metrics), a model-run/v1 record per fit (data fingerprint and row range, last training timestamp, feature definition digests, scaler parameters, commit, lock digest, fitted parameters, validation metrics) chained into the run ledger with the artifact digest, an OPA policy refusing fits past T_val, undeclared or non-point-in-time features, fingerprint mismatches, early test-window reads and missing metrics, and scoring gated on a passing verdict bound to the artifact digest. Recorded before coding; implementation waits until every critique round is processed.", maps_to = ["A.100"] },
  { source = "SESSION", ref = "2026-10-17 integration inventory", text = "Integrating A.24 found no recorded way to merge: no pr, sync or merge task on any branch. cscie103 holds both at the pinned commit. pr is planned as A.19 with A.20 and A.23 before it; sync has no step. Its closure is sync.py, repo_state.py and the machine.branches policy, with env_sync.py already ported by A.93. Ids are minted above every branch's ledger, so this step is A.101, past project-site's A.100.", maps_to = ["A.101"] },
  { source = "SESSION", ref = "2026-10-18 A.19 inventory: pr needs gh", text = "pr.py calls gh for pr list, pr create, pr view and the merge endpoint. cscie103 takes gh from its Nix flake; recsys pins every tool three times, in mise.toml's [tools], in the founding data's pins (judged equal by input.tools == expected_tools) and in mise.lock, and gh is in none. The founding gate reads its data from disk, so the pin lands as two judged writes, the founding data first. The lock entry must come from a recorded task, so A.102 waits for A.26.", maps_to = ["A.102"] },
  { source = "SESSION", ref = "2026-10-18 A.102: gh installed itself", text = "After gh was pinned in mise.toml, the next task run printed installed 1 tool: gh@2.102.0, before tools:lock had written gh's entry. mise's auto-install fetched it outside tools:install. mise's source shows auto_install is the master switch (exec skips installing when exec_auto_install or auto_install is false), and the founding gate requires [settings] to equal the founding data's settings pins.", maps_to = ["A.103"] },
  { source = "SESSION", ref = "2026-10-18 PR #9: CI ran a claim about this machine", text = "The first CI run of the integration PR passed 499 tests and failed one: test_mise_state_is_owner_only, A.8's proof that this FAS OnDemand machine's mise state is owner-only. It refused because GitHub's runner has no ~/.config/mise, exactly as written, since a check that finds nothing must not pass. The claim is about this machine, so it belongs to a machine lane declared by directory (A.39), which the hooks and the pre-publication snapshot run here and CI's gate omits by declaration, never by detecting CI.", maps_to = ["A.104"] },
  { source = "SESSION", ref = "2026-10-18 PR #9: a running gate read UNSTABLE", text = "pr refused PR #9 with ERR_MERGE_UNSTABLE while quality gate was still running; the check then passed. develop has no ruleset requiring the check, and GitHub reports UNSTABLE for non-required non-passing checks and BLOCKED only for required ones. 2026 practice requires the CI job by name through a repository ruleset, pinned to the GitHub Actions app (integration_id 15368) so a same-named check from another app cannot satisfy it, and keeps rulesets as code in .github/rulesets.", maps_to = ["A.105"] },
  { source = "SESSION", ref = "2026-10-18 gate mirror audit against cscie103's 25 gates", text = "cscie103's check runs 25 gates; this repository's ran 8 plus one invented lane. The founding withdrew twelve gates promising each would return with its script, and none has; none of the fifteen missing scripts is ported, and evaluate_policies.py was avoided for its Databricks import. cscie103's nix contract gate runs in the hooks and judges the machine by policy, and its comment records that confining a machine gate to one side was backwards; A.104 confined this machine's claims away from CI with a runs_in_ci field, a check:ci task and a test level cscie103 does not have. Each missing gate returns by port before pr integrates the stack.", maps_to = ["A.106", "A.107", "A.108", "A.109", "A.110", "A.111", "A.112"] },
  { source = "SESSION", ref = "2026-10-18 A.106 closure: cscie103's policy tree could not be listed", text = "Porting policy decisions needs the exact set of cscie103's policy packages, and nothing could list cscie103's tree: not cscie103's tasks, not this stack's (upstream.py has only checkout and main), and not the main checkout's branch. That branch instead holds a large uncommitted, unverified copy of cscie103 scripts, policies, tests and contracts, the source of the repo:history run in the shared ledger. 2026 vendoring practice verifies copies against the pinned upstream commit, never a local copy, and a blobless clone holds every tree at the pin, so the listing is local and fetches no blob.", maps_to = ["A.113", "A.114"] },
  { source = "SESSION", ref = "2026-10-18 A.107 first run of audit:models on this repository", text = "audit:models found eleven classes deriving from BaseModel directly, all in this repository's own scripts: claims_audit's AuditReport, Claim, ClaimsRegister, Finding and Pillar; green_verify's GreenVerdict; red_verify's RedVerdict; and safeguards' Safeguard, SafeguardsRegister, Trial and TrialReport. cscie103's baseline at the pin is empty, its migration finished. Migrating changes behaviour, since Contract is strict and frozen and Reading is lax, so the eleven are baselined as the ratchet begins and each migrates in this step, removing its line.", maps_to = ["A.115"] },
  { source = "SESSION", ref = "2026-10-18 A.109 closure: mutation anchors needs the mutation:check harness", text = "cscie103's mutation_anchors.py imports MutantSpec and MutationSpec from mutation_check, so the gate counts anchors exactly as the harness does. This repository has neither the module nor the mutation:check task: it proves its guards with safeguards:prove and contracts/safeguards.toml, a mechanism built here with no cscie103 counterpart. Under the rule that every capability is ported from cscie103 before anything is invented, the harness returns first, then the two mechanisms are reconciled, then mutation anchors ports with its harness present.", maps_to = ["A.116", "A.117"] },
  { source = "SESSION", ref = "2026-10-18 A.114 inventory through repo:state", text = "repo:state showed the main checkout on feature/port-cscie103-capabilities, three commits ahead of develop and holding five modified tracked files and over two hundred untracked copies. Accounting for them needs the three commits read as data and the five files restored once their changes are shown superseded. cscie103 has both capabilities at the pin, repo:history and source:restore; neither is here or planned.", maps_to = ["A.118"] },
  { source = "SESSION", ref = "2026-10-18 A.114: the port branch's five commits must reach develop", text = "After A.114 the main checkout is clean, and feature/port-cscie103-capabilities holds five commits no merged pull request contains: A.13 to A.17's plan entries, A.13's provenance fixes, and ten preserved files. Never pushed, it reaches develop by a rebase, and its files conflict with develop's rebuilt versions. worktree:refresh is here, but a stopped rebase has no governed way to be read or continued. cscie103 has both at the pin, worktree:conflicts and worktree:continue in rebase_state.py with runs.worktree_continue.", maps_to = ["A.120"] },
  { source = "SESSION", ref = "2026-10-18 the course assigns a new project", text = "The course replaced the MovieLens 1M project with forecasting S&P 500 stock volatility. The new repository, fustaomni/cs1090a-volatility, needs every capability this repository and cscie103 hold. cscie103 generates new projects with a Copier template pipeline (template:new, template:init, template:identity, template:publish, identity:set), which this repository lacks, so it is ported, with identity reduced to name and repository since this repository withdrew Databricks, and the clone made over HTTPS since FAS OnDemand reaches GitHub only through gh's OAuth helper. Resuming the paused port-carry rebase needs a trusted worktree to trust another, which machine:trust cannot do: under paranoid mode an untrusted checkout runs none of its own tasks.", maps_to = ["A.121", "A.122"] },
  { source = "SESSION", ref = "2026-10-18 A.121: provenance:adapt refused a patch holding three single quotes", text = "Recording contracts/project-identity.toml's adaptation, provenance:adapt refused: the patch removes a cscie103 slot line holding three single quotes, and it writes every patch as a TOML multi-line literal string, which cannot contain them. source:port planned the same file without refusal, because it writes content as a TOML basic string through json.dumps. provenance:adapt's other writer, _toml_string, escapes only backslash and quote, so a value holding a newline would be written invalid. Both are replaced by the basic-string writer source:port uses.", maps_to = ["A.124"] },
  { source = "SESSION", ref = "2026-10-18 A.121: the generated-project gate test cannot keep its upstream path", text = "tests/test_generated_gate.py marks its three proofs integration, and this repository takes a test's level from its directory (A.39), so at tests/ it is refused as unit. provenance.toml records a ported file only at its upstream path, with no field for a file moved to tests/integration, so moving it would lose its byte-for-byte record. It was withdrawn by name, with its digest and this step as its reason. Provenance gains an upstream_path for a relocated port, and the gate test returns at tests/integration with its provenance whole.", maps_to = ["A.123"] },
  { source = "SESSION", ref = "2026-10-19 A.122 integration and the port-carry rebase", text = "Recording A.122's adaptation, provenance:adapt raised FileNotFoundError for an upstream path absent from a fresh worktree, a traceback instead of a closed refusal. After PR #16, sync pulled a rewritten mise.toml into the template-pipeline checkout and left it untrusted, the gap A.122 closed for worktree:refresh only. Resuming the port-carry rebase, commits 1 to 3 replayed, while commits 4 and 5 preserve the main checkout's pre-A.114 state and five copies that fail verification against the pin; develop superseded both, and both remain on feature/port-cscie103-capabilities. cscie103's rebase_state.py at the pin has conflicts and continue only, so a governed skip is built here, refusing unless another named ref preserves the stopped commit and a reason is given.", maps_to = ["A.125", "A.126", "A.127"] },
  { source = "SESSION", ref = "2026-10-19 plan:add refused a spec by traceback", text = "Planning A.125 to A.127, plan:add was given a [trace] table carrying maps_to, which plan_edit.py fills itself from the steps being added (line 185). The strict _Trace contract refused it, correctly, but plan_edit.add let pydantic's ValidationError escape as a traceback, so the refusal had no command-outcome/v1 envelope and no code a caller can branch on.", maps_to = ["A.128"] },
  { source = "SESSION", ref = "2026-10-15 operating rules", text = "every repository operation is a mise task run through mise run run and recorded; strict GitFlow as cscie103 (worktree:add, pr, release, ruleset); every applicable cscie103 capability ported before repo-specific work; plan data on disk before any code. This branch alone is cut by hand, because worktree:add arrives with the port it carries.", maps_to = ["A.13", "A.14", "A.15", "A.16", "A.17"] },
  { source = "SESSION", ref = "2026-10-19 cs1090a-volatility's first setup", text = "Generating cs1090a-volatility, template:identity refused a spec whose repository was owner/name with only '1 validation error for IdentitySpec', since project_identity.py and template_identity.py keep the first line of the error, which drops the field and its pattern. Once published, setup's uv sync --locked refused the lock: identity:set renames pyproject.toml's project, while uv.lock still records its root package under the template's name. uv.lock is exempt from the literal scan in cscie103 and here, and was never a slot, so every generated project is born with a stale lock.", maps_to = ["A.129", "A.130"] },
  { source = "SESSION", ref = "2026-10-19 cs1090a-volatility's first branch", text = "Cutting cs1090a-volatility's first branch, start:here printed git switch -c feature/lock-name origin/develop, and git answered that the branch was set up to track origin/develop. Under git's default branch.autosetupmerge a branch started from a remote-tracking ref inherits it as upstream, and a 2026 report shows a plain git push from such a branch landing feature commits on a shared dev branch with no review, the fix named being --no-track and a check that the new branch tracks nothing. worktree:add made that choice in A.93; start:here, mirrored from cscie103, did not, and no proof ever ran its printed command.", maps_to = ["A.131"] },
  { source = "SESSION", ref = "2026-10-19 A.130's first RED failed on its own spec file", text = "A.130's first RED failed with a TOML parse error, not the behaviour under test: the proof's spec text was written with a doubled backslash inside a source:apply literal string, and TOML literal strings do no escaping, so Python received a backslash and an n, not a newline. A search of tests found the same doubled escape merged in test_worktree_skip.py (A.127) and test_start_here.py (A.131), where the fixtures they describe as multi-line are one line of escape text. A 2026 fix of the same defect used a single escape and verified it by the written file's real content; no general lint flags it, since a doubled backslash is a valid escape.", maps_to = ["A.132"] },
  { source = "SESSION", ref = "2026-10-19 A.126's proofs and A.122's raising=False", text = "Writing A.126's proofs, which patch sync._trust with raising=False until GREEN, the same pattern was found merged in test_worktree_retrust.py from A.122, though worktree._trust has existed since PR #16. pytest's setattr raises AttributeError for a missing attribute unless raising=False, and a 2026 review names the risk: a misspelt or renamed attribute is set as a new one and the patch gives no warning. Here it is worse, since the no-trust guard asserts that nothing was trusted, so a rename would make it pass with nothing called.", maps_to = ["A.133"] },
  { source = "SESSION", ref = "2026-10-19 eight template fixes and cs1090a-volatility", text = "cs1090a-volatility was generated at b71f347, before eight template fixes merged (A.125 to A.133). Repairing it by hand would make it drift from the template its answers record. cscie103's pipeline has no update operation at the pin: provenance lists no such path, and the only matches are comments naming copier update as the reason for the pipeline's design. 2026 practice applies template changes with copier update, a three-way merge from the recorded _commit to the target, on a dedicated branch, always pinned since a bare update destroyed the project it was upgrading, non-interactive with defaults, and on a clean tree. Copier's API requires overwrite=True for an update, and its default conflict mode is inline, so rej is chosen to leave each conflict as a file reported by path.", maps_to = ["A.134"] },
  { source = "SESSION", ref = "2026-10-20 branch hygiene and cscie103's branches:prune", text = "Ten merged worktrees were removed, but sync cannot see a merged branch with no upstream, and pr pushes without tracking, so worktree-less merged branches and remote branches stay unobserved. cscie103 built branches:prune for exactly this (its D.11) after this repository's pin, and is private, so neither the web nor a task here can name its commit. Its blobless clone under .artifacts/upstream holds every commit, and git and GitHub document git log, with or without a path, as fully supported on a blobless clone; only patch output fetches contents. cscie103 has no cross-repository reader to port, so repo:history's main, which alone hard-wired this checkout, gains --repository, bounded to those clones.", maps_to = ["A.135"] },
  { source = "SESSION", ref = "2026-10-20 branches:prune is at cscie103's 25061c1", text = "Read through A.135, cscie103's develop holds branches:prune unchanged since release 184, at its tip 25061c1, after this repository's pin 58af9d3. provenance.toml's header says each file is recorded at the commit it was read, but it carries one file-wide commit, and no entry a commit of its own. Its proofs check each file against its recorded digest only and read no upstream, so only the record is false for a later port. 2026 vendoring tools record each entry's resolved commit beside its content hash, and resolve one logical artifact at one atomic commit, so the port of branches:prune takes what it needs from 25061c1 together.", maps_to = ["A.136"] },
  { source = "SESSION", ref = "2026-10-20 GitFlow branch hygiene", text = "Every merged feature branch must be deleted locally and on origin, and finished worktrees removed. sync deletes a local branch only when its upstream is gone, but pr pushes without tracking, so worktree-less merged branches and origin's branches stayed unseen. cscie103 built branches:prune for exactly this (D.11), with D.227 making cleanup one pass, remote then local; it is unchanged at cscie103's tip 25061c1 since release 184. It reads Branch.upstream, which this repository's repo_state at the pin lacks, so repo_state and its proofs move to 25061c1 with it, one artifact at one commit as vendoring practice resolves one, each entry recording that commit (A.136).", maps_to = ["A.137"] },
  { source = "SESSION", ref = "2026-10-20 GitFlow branch hygiene", text = "After branches:prune left no merged branch, feature/port-cscie103-capabilities remained: its first three commits landed through PR 18 and its last two were skipped as superseded, so git will never see it merged and the only advice was git branch -D by hand. cscie103 built branches:retire for this (D.228): a named branch and the plan step that superseded it, judged, its tip archived as a pushed archive/<branch> tag before any deletion; it is at cscie103's tip 25061c1. Its proof also requires worktree:remove's refusal to name branches:retire. cscie103's D.229 found branch -d proves a push for a branch with an upstream, never a merge, so a branch is deleted only once origin/develop contains it. Both are carried onto this repository's adapted worktree.py; D.241, orphaned folders, is a separate capability and is not.", maps_to = ["A.138"] },
  { source = "SESSION", ref = "2026-10-20 restoring the main checkout to develop", text = "To retire feature/port-cscie103-capabilities, the main checkout must leave it, and sync returns a checkout to develop, but a linked worktree, template-pipeline, holds develop. Removing that worktree through worktree:remove would remove it and then ask merge-base about feature/template-pipeline, which branches:prune already deleted, and report it kept with exit 1. The absent-worktree path already asks rev-parse first and reports a branch already gone; the present path did not.", maps_to = ["A.139"] },
  { source = "SESSION", ref = "2026-10-20 restoring the main checkout to develop", text = "The main checkout sat on feature/port-cscie103-capabilities, whose tree predates the sync port, so sync could not run there, and a linked worktree had held develop. 2026 worktree tools and this repository's start:here agree that a task cannot change the invoking shell's checkout and must print the command the shell evaluates. This repository's earlier tooling had start:switch for exactly this: switch to an existing branch, refusing an unknown branch and one another worktree holds before git would.", maps_to = ["A.140"] },
  { source = "SESSION", ref = "2026-10-20 an integration proof the verifiers could not run", text = "Porting the generated-project gate to tests/integration (A.123), red_verify and green_verify were found to run named proofs through pyproject's addopts, whose marker expression not integration and not machine deselects them, so an integration proof could be shown neither RED nor GREEN. check's integration gate had reported NONE, so nothing showed it. pytest takes the last -m given, and an empty one selects every test.", maps_to = ["A.141"] },
  { source = "SESSION", ref = "2026-10-20 a failed CI run with no reader", text = "PR 35's quality gate failed in CI after check passed locally with the integration tier, and pr:logs was refused as ERR_RUN_TASK_UNDECLARED: scripts/pr_logs.py and tests/test_pr_logs.py were ported from cscie103 and recorded in provenance, but the task that runs them never reached this repository's mise.toml, nor its capability or its read-only classification.", maps_to = ["A.142"] },
  { source = "SESSION", ref = "2026-10-20 cs1090a-volatility's identity commit, untraced", text = "cs1090a-volatility's check refused bb8df64, chore: take the project identity, as ERR_MATRIX_COMMIT_UNTRACED. template:identity commits with a bare message, while template:init's first commit carries Plan-Step: A.1 (D.61), and the day-one plan's A.1 lists identity:set among its done_when. cscie103 at 25061c1 commits the same bare message, so there is nothing to port.", maps_to = ["A.145"] },
  { source = "SESSION", ref = "2026-10-20 a slot no proof read", text = "Choosing the proof for cs1090a-volatility's A.2, the lock that names its project, the identity policy was found to hold two rules only, ERR_IDENTITY_LITERAL and ERR_IDENTITY_INPUT_MISSING: it scans for the declared value outside slots and never checks that a slot holds the declared value, so a lock still naming the template passes. cscie103 met the same stale lock in agentic-ai-engineering and is proving it with uv lock --check --offline (its D.263, unmerged); this repository takes that check, since its slot (A.129) already renames the lock.", maps_to = ["A.146"] },
  { source = "SESSION", ref = "2026-10-21 a search that could not look", text = "Porting pr:checks, source:search over files in an upstream:checkout clone returned success with zero matches for tasks the clone holds, because the clone is ignored and git grep searches tracked files only. A search that cannot look reported silence as an answer. cscie103 fixed this as D.230 (its PR #179, feature/source-search-refuses-silence).", maps_to = ["A.148"] },
  { source = "SESSION", ref = "2026-10-21 production-grade architecture review, round 1", text = "A production-grade review of one command, mise run run status, found these properties not demonstrated: strict schema boundaries, evidence, verdict and decision as data, policy as code, cryptographic governance, deterministic orchestration, structured observability and Outside-In TDD, with standardized invocation, fail-fast and non-interactive execution only partly shown. The 2026 resolutions recorded: a versioned JSON envelope on every command with a capability audit (A.149); runner-enforced non-interaction that fails closed (A.150); OpenTelemetry's environment-variable carrier for TRACEPARENT (A.151); SLSA verification summary attestations as in-toto statements (A.152); declared sequences (A.153); acceptance proofs through the gateway (A.154). Recorded before any coding; implementation waits until every review round is in.", maps_to = ["A.149", "A.150", "A.151", "A.152", "A.153", "A.154"] },
  { source = "SESSION", ref = "2026-10-21 production-grade architecture review, round 2", text = "Round 2 refined round 1: non-interaction does not guarantee a process cannot hang, so timeouts, cancellation and supervision of the whole process tree are needed; a trace id and span id do not reconstruct a trace without parent links and span lifecycle; a signed verdict proves integrity and signer, not that the policy is right or the evidence true; a declared sequence is not reproducible without pinned inputs, a recorded environment and handled side effects; and a valid envelope proves shape, not truth. A production system needs reliable mechanisms and accurate claims about what they guarantee, so each mechanism's claim is scoped (A.155) and envelope facts are cross-checked by independent observation (A.156).", maps_to = ["A.155", "A.156"] },
  { source = "SESSION", ref = "2026-10-21 production-grade architecture review, round 2, round-1 steps narrowed", text = "Round 2 narrowed five round-1 steps to accurate claims: A.150 adds wall and idle deadlines, cancellation and SIGTERM then SIGKILL to the whole process group; A.151 records complete spans with parent links, start, end and status; A.152 binds the policy and evidence by digest and claims integrity and signer only; A.153 records input digests and the environment and classifies each effect read, idempotent or write; A.154 claims shape only.", maps_to = ["A.150", "A.151", "A.152", "A.153", "A.154"] },
  { source = "SESSION", ref = "2026-10-21 production-grade architecture review, round 3", text = "Round 3 set ten Outside-In acceptance criteria for an improved status before any code: a schema-valid result for a valid repository; a typed failure for an invalid path; a detached HEAD represented explicitly; a missing upstream as null, never fabricated; no interactive input; equivalent factual evidence from unchanged state, excluding run metadata; an observation failure blocking dependent state-changing actions unless an authorized recovery policy permits them; stdout for the result contract and diagnostics apart; no unexpected mutation; and untrusted paths and malformed output unable to bypass validation. git's porcelain v2 headers mark (detached), (initial) and an absent upstream, and plain git status may refresh and write the index unless GIT_OPTIONAL_LOCKS is 0, which today's status task does not set.", maps_to = ["A.157"] },
  { source = "SESSION", ref = "2026-10-21 production-grade architecture review, round 3, observation failures block writes", text = "Round 3's seventh criterion, that an observation failure prevents dependent state-changing actions unless an explicitly authorized recovery policy permits them, holds for every reader followed by a writer, so A.153's declared sequences gain it as a proof as well as status's acceptance criteria.", maps_to = ["A.153"] },
  { source = "SESSION", ref = "2026-10-21 production-grade architecture review, round 4", text = "Round 4: nothing prevents the next command, the assistant's or anyone's, from being a raw shell, git or gh command again. Every-operation-is-a-task was a rule in prose only, and four raw gh reads were proposed and run earlier in the session with nothing refusing them. 2026 practice stacks enforcement: a bash extdebug DEBUG-trap guard that skips commands, allowlisting the words that may start one since string matching is bypassed by indirection (A.158); a signed trailer only the sanctioned path writes, required by commit-msg, which --no-verify, rebase and cherry-pick skip (A.159); and server-side verification of every pull request commit, which cannot be bypassed (A.160). Raw reads leave nothing to verify and are refused only in a guarded shell.", maps_to = ["A.158", "A.159", "A.160"] },
  { source = "SESSION", ref = "2026-10-21 production-grade architecture review, round 4, each layer names its bypass", text = "Each enforcement layer's scoped claim names what bypasses it: the shell guard, another shell or an unset trap; the commit-msg check, --no-verify, rebase, cherry-pick or an unhooked clone; and CI verification, raw reads, which leave no commit to verify.", maps_to = ["A.155"] },
  { source = "SESSION", ref = "2026-10-21 production-grade architecture review, round 5", text = "Round 5 judged the invocation itself. Accurate and new: absolute user-specific paths in invocations and in records leak identity and layout and do not port (A.161); a task name with untyped string arguments is not an intent an agent can state and get a validated result for, which 2026 MCP tools give with inputSchema, outputSchema and structuredContent (A.162); nothing authorizes a run by actor or effect (A.163); and a record names a task but not the definition that ran (A.164).", maps_to = ["A.161", "A.162", "A.163", "A.164"] },
  { source = "SESSION", ref = "2026-10-21 production-grade architecture review, round 5, claims corrected", text = "Round 5 also claimed nothing is recorded as structured evidence, there is no machine-readable verdict, and success is only an exit code. The gateway appends a signed, hash-chained run-summary/v2 record per run with its exit code, verdict, run id, output digest and a decision/v1 with reason code and verdict digest; runs:verify reported 2653 records, all signed. What holds is narrower: the task's own payload is prose (A.149, A.157) and a redirected stdin is not fail-closed (A.150).", maps_to = ["A.149", "A.150", "A.157"] },
  { source = "SESSION", ref = "2026-10-21 production-grade architecture review, round 6", text = "Round 6 described the target: one validated, machine-readable task taking a structured request instead of positional arguments, returning a structured result with an evidence event and a verdict of pass, fail or unknown, defined once as code, with the same contract for humans and agents, and a logical project reference. Most of it maps onto rounds 1 to 5. New: the run request becomes the one entry contract, making the request runs.run_request already judges external, with stable operation names (A.165); and unknown becomes a verdict that never satisfies a gate requiring pass and never combines into pass, as policy engines treat Indeterminate (A.166).", maps_to = ["A.165", "A.166"] },
  { source = "SESSION", ref = "2026-10-21 production-grade architecture review, round 6, the shell line scoped", text = "Round 6 said the original shell line must disappear. A process still needs an entry, so the accurate claim is narrower: the shell line stops carrying meaning and reduces to one fixed, argument-free entry point that reads a validated request, every operation's meaning living in the request and the registry.", maps_to = ["A.155"] },
  { source = "SESSION", ref = "2026-10-21 production-grade architecture review, round 7", text = "Round 7 assessed the command and marked machine-readable output, validation, authorization, determinism, observability, provenance, idempotency and SOC 2 controls unverified. Its root finding: a property an outside reviewer cannot check reads as absent, so each run gains a receipt verifiable from published keys alone (A.167). Control effectiveness is a property of a period, not a command, so a controls register maps each control to its enforcing step, evidence and test, with a windowed report, claiming evidence production rather than effectiveness (A.168). Idempotency becomes each capability's declared effect class (A.169).", maps_to = ["A.167", "A.168", "A.169"] },
  { source = "SESSION", ref = "2026-10-21 production-grade architecture review, round 7, existing properties corrected", text = "Round 7 marked a run id, an event schema, signing and task authorization unverified. Each run already carries a run id, a run-summary/v2 schema, chained digests and a decision/v1, signed in the ledger, and runs.run_request refuses an undeclared task before it runs. What holds is that none of this is checkable from outside without reading code, which A.167 addresses, and that authorization governs which task, not who, which A.163 addresses.", maps_to = ["A.163", "A.167"] },
  { source = "SESSION", ref = "2026-10-21 production-grade architecture review, round 8, one directory per chain", text = "Round 8 found every chain naming its worktree twice, by cd and again by mise -C, which risks two different repositories. mise runs each task from its config root unless a task sets dir to cwd, and no recsys task does, so once cd selects the worktree -C is redundant. A chain now selects its directory once, by its first cd, running mise run run without -C, and the shell guard refuses a mise -C naming another directory (A.158). Worktrees by slug (A.161) remove the path altogether.", maps_to = ["A.158", "A.161"] },
  { source = "SESSION", ref = "2026-10-21 production-grade architecture review, round 8, observation apart from judgment", text = "Round 8 asked for a status result whose observed facts stay apart from evaluated judgments: a dirty worktree is a fact, and whether it blocks an action is policy. The governed tasks already keep evidence, policy, verdict and decision apart, as template:update observes clean false and runs.template.update refuses it as ERR_TEMPLATE_UPDATE_DIRTY, and audit:evidence refuses evidence holding a conclusion. status has no envelope at all, so every envelope must keep the four apart (A.149), status's included (A.157).", maps_to = ["A.149", "A.157"] },
  { source = "SESSION", ref = "2026-10-21 production-grade architecture review, round 9", text = "Round 9 framed the architecture as desired behavior as code (task definitions, Pydantic contracts, policies, tests) and observed behavior as data (execution records, repository state, verdicts, audit events), joined by typed evaluation and decision and ending in enforcement: allow, deny, retry or stop. recsys already splits the two, but its decisions name proceed and refusals with no registered enum, no retry and no stop beyond one task, so every decision ends in one registered action, deny overriding, unknown never allowing, retry bounded and refused for writes, stop halting a sequence (A.170); and every tracked path is classified as desired or observed (A.171).", maps_to = ["A.170", "A.171"] },
  { source = "SESSION", ref = "2026-10-21 production-grade architecture review, round 9, read-only enforcement", text = "Round 9 scoped enforcement for a read-only status: it decides only whether the request is authorized and whether the returned evidence is trustworthy, and never mutates the repository to complete the query. Authorization is A.163; the no-mutation proof, GIT_OPTIONAL_LOCKS=0 with the index and refs unchanged, is A.157's ninth criterion.", maps_to = ["A.157", "A.163"] },
  { source = "SESSION", ref = "2026-10-21 production-grade architecture review, round 10", text = "Round 10 set eight acceptance tests at the gateway before any refactoring, a test progression from acceptance through contract, task wrapper, policy and integration to failure injection, and the nuance that runtime validation does not enforce read-only behavior. Five tests map onto recorded steps; three gain proofs on A.157, A.162 and A.163. A read-only boundary needs the operating system: Landlock lets an unprivileged process restrict itself to reads, inherited by every child, on Linux 5.13 and later, but restricts only the filesystem and TCP, so the boundary is detected by ABI, paired with withheld credentials and a tree digest, and reports detection only where it cannot enforce (A.172). Proofs declare their layer (A.173).", maps_to = ["A.172", "A.173"] },
  { source = "SESSION", ref = "2026-10-21 production-grade architecture review, round 10, tests already planned", text = "Four of round 10's acceptance tests map onto recorded steps: a valid repository and registered status task returning a validated object (A.157, criterion 1); a missing repository directory failing without executing the task (A.165, an unknown project reference refused before anything runs); an unknown argument rejected (A.162); and interactive input handled predictably at EOF (A.150, a prompt failing closed).", maps_to = ["A.150", "A.157", "A.162", "A.165"] },
  { source = "SESSION", ref = "2026-10-21 production-grade architecture review, round 11", text = "Round 11 kept mise run run status as the entry and placed a pipeline behind it: a validated request, authorization and policy, a read-only observer, typed evidence, policy evaluation, a typed verdict and decision, and a structured result with an audit event, so an agent consumes data, not terminal text, above all when status decides whether to commit, open a pull request or merge. Most stages are recorded. New: every run passes the stages in order, each leaving a typed record, a failing stage ending the run (A.174); and commit, pull request and merge decide only from the observer's typed evidence, refusing on unknown, as git's long format is human-readable and subject to change while porcelain is stable (A.175).", maps_to = ["A.174", "A.175"] },
  { source = "SESSION", ref = "2026-10-21 production-grade architecture review, round 11, the entry kept", text = "Round 6 recorded A.165 as one entry point taking no positional arguments. Round 11 judged mise run run status already a reasonable developer-facing entry, to be kept with its implementation improved. Round 11 supersedes that part of round 6: the CLI form stays and the gateway translates it into the same typed request a request document gives, so A.165's no-positional-arguments proof is replaced by one proving both forms yield the same validated request.", maps_to = ["A.165"] },
  { source = "SESSION", ref = "2026-10-21 production-grade architecture review, round 12", text = "Round 12 restated rounds 5 and 7 against a pasted fragment. Two points are new: no attestation of the tool binaries or configuration a run used, and no resource attribution. mise verifies cosign, minisign, SLSA provenance and GitHub artifact attestations natively for aqua tools, aborting an install that fails, and since 2026 records and enforces that provenance in mise.lock; whether recsys's tools use verifying backends is not yet known. Each run therefore binds its tool versions and digests, an install without verifiable provenance is refused (A.176), and each span records CPU time and peak memory (A.151).", maps_to = ["A.176"] },
  { source = "SESSION", ref = "2026-10-21 production-grade architecture review, round 12, claims corrected", text = "Round 12 claimed the command is not versioned, reviewed or tested, records nothing, has no correlation id or duration and evaluates no policy before execution. status is declared in versioned mise.toml, changed through reviewed pull requests and registered in capabilities.toml; every run appends a signed, hash-chained run-summary/v2 with a run id, duration, output digests and a decision; runs.run_request judges each request before the task starts; and the duplicated path was removed in round 8. What holds is status's prose payload (A.149, A.157), the redirected stdin (A.150) and absolute paths (A.161). The third review in a row judged a pasted fragment, so every property behind it read as absent, which a verifiable receipt per run answers (A.167).", maps_to = ["A.150", "A.161", "A.167"] },
  { source = "SESSION", ref = "2026-10-21 production-grade architecture review, round 13", text = "Round 13 listed concrete changes: Pydantic request and result models, a registered tool with a JSON Schema, evidence emitted before the result, typed failure modes, no hardcoded path, non-interaction as contract, and queryable evidence and verdicts in Git. Most map onto recorded steps. New: every gateway failure maps to a registered code (A.174), and records are queryable by run, task and verdict (A.167). Its ask for PR state and check results exposed a defect in the pr-status task ported in A.147: it selects name and conclusion from every statusCheckRollup entry, but GitHub returns two types there, a CheckRun with name, status and conclusion and a StatusContext with context and state, so a StatusContext prints null for both and an in-progress run looks like a missing one. A typed reader discriminates the two (A.177).", maps_to = ["A.177"] },
  { source = "SESSION", ref = "2026-10-21 production-grade architecture review, round 13, changes already planned", text = "Round 13's other changes map onto recorded steps: a Pydantic request (A.165, A.162); a Pydantic result with commit sha, timestamps and provenance (A.157, A.149, A.164, A.176); a registered tool with a JSON Schema (A.162); a span, structured event and attestation before the result (A.151, A.174, A.152); the working directory from configuration (A.161); non-interaction as contract (A.150); and code and data kept in Git and queryable (A.171, A.168).", maps_to = ["A.149", "A.150", "A.151", "A.152", "A.157", "A.161", "A.162", "A.165", "A.168", "A.171"] },
  { source = "SESSION", ref = "2026-10-21 production-grade architecture review, round 14", text = "Round 14 named three findings, each already recorded: shell chains instead of Task-as-Code returning telemetry (A.165, A.153, A.158, A.174); unstructured console text with no evidence or verdict as data (A.149, A.157, A.177, A.152, A.167), true of status's payload though every run emits a signed run-summary/v2 with a decision/v1; and absolute paths (A.161). Two refinements are new: a Python caller gets the same typed result without a shell (A.165); and root discovery keeps a linked worktree's own root apart from its shared repository, since git rev-parse --show-toplevel returns the per-worktree root while --git-common-dir names the shared repository, and conflating them is a known bug class (A.161).", maps_to = ["A.149", "A.152", "A.153", "A.157", "A.158", "A.161", "A.165", "A.167", "A.174", "A.177"] },
  { source = "SESSION", ref = "2026-10-21 production-grade architecture review, round 15", text = "Round 15: a redirected stdin is no complete non-interactive guarantee, since a program can read /dev/tty, raise a GUI prompt, reach the network or change state, so a task should declare that it is non-interactive and fail safely when required inputs are missing. GIT_TERMINAL_PROMPT=0 and GCM_INTERACTIVE=never are known in 2026 not to stop credential-manager GUI and askpass prompts, which need GIT_ASKPASS and SSH_ASKPASS present and empty, SSH_ASKPASS_REQUIRE=never, GCM_GUI_PROMPT=false and credential.interactive=never, so the gateway suppresses every vector (A.150). Each capability declares its interaction, required inputs and network egress, checked before running, with network denied by port where Landlock enforces it and reported unenforced elsewhere (A.178).", maps_to = ["A.178"] },
  { source = "SESSION", ref = "2026-10-21 production-grade architecture review, round 15, claims corrected", text = "Round 15's table credited the command with both cd and -C selecting its directory, the form removed in round 8, since when every chain selects its directory once by cd. Its unknown rows, structured output, policy, evidence, verdict, decision and signing, exist on every run as a signed run-summary/v2 with a decision/v1, unseen from a fragment, which a verifiable receipt per run answers (A.167). Deterministic execution not established is fair and already scoped: inputs, environment, definition and tool digests recorded, external state not reproducible (A.153, A.164, A.176).", maps_to = ["A.153", "A.164", "A.167", "A.176"] },
  { source = "SESSION", ref = "2026-10-21 production-grade architecture review, round 16", text = "Round 16 proposed a dedicated repo:status over the generic dispatcher run given status. run is the gateway, recording, judging and running the task its argument names, which is why a direct mise run status bypasses the ledger and every policy and why always mise run run has been a rule rather than a property. Inverting it, each public task routes itself through the gateway under a namespaced name, its implementation a hidden task refusing to run outside the gateway, so a direct run is governed, the dispatcher retires and names align with operation names (A.179). Until then every operation still runs as mise run run. It also asked to verify no task depends on the caller's directory: mise runs tasks from their config root and recsys sets no dir, but every task receives MISE_ORIGINAL_CWD, so no task or wrapper may read it (A.161).", maps_to = ["A.179"] },
  { source = "SESSION", ref = "2026-10-21 production-grade architecture review, round 16, the path selected once", text = "Round 16 found the absolute path repeated by cd and mise -C and proposed mise -C alone. The repetition was removed in round 8: every chain since selects its directory once, by its first cd, then runs mise run run without -C, as the session rule that a chain begins by changing into its worktree requires. Both forms select the directory once; the rule keeps cd. Worktrees by slug remove the path altogether (A.161).", maps_to = ["A.158", "A.161"] },
  { source = "SESSION", ref = "2026-10-21 production-grade architecture review, round 17", text = "Round 17 laid out nine layers, task, contract and policy as code, observation, evidence, verdict and decision as data, enforcement, and audit with policy version and execution identity, with a strict RepositoryStatus contract, separating is_dirty as observation from a clean-tree rule as expectation, its verdict as judgment and the later permission as decision. The layers map onto recorded steps. Four details tighten them: envelope and evidence models forbid extra fields and coercion, since Pydantic's default is lax and would accept the string false for a bool (A.149); status checks the observed repository against contracts/project-identity.toml, and an unborn branch, porcelain's (initial), has no head sha as a detached HEAD has no branch (A.157); and each rule records its own verdict (A.166).", maps_to = ["A.149", "A.152", "A.157", "A.163", "A.164", "A.166", "A.170", "A.172", "A.175", "A.179"] },
  { source = "SESSION", ref = "2026-10-21 production-grade architecture review, round 18", text = "Round 18 set seven outside-in tests for repo:status. Five map onto recorded proofs: a schema-valid result, a structured failure for a missing repository, an explicit detached HEAD, no mutation (A.157, A.172), and missing evidence never authorizing a later privileged operation (A.175, A.170). Two sharpen A.157: a dirty tree observed accurately without changing files, and an unexpected git failure kept a failure with verdict unknown, never the clean state an empty output would otherwise read as. Its closing point keeps reporting and authorizing distinct: status judges whether its observation succeeded, so a dirty repository is a successful status, while a separate merge policy denies on the same evidence (A.157, A.175).", maps_to = ["A.157", "A.166", "A.170", "A.172", "A.175"] },
  { source = "SESSION", ref = "2026-10-21 production-grade architecture review, round 19", text = "Round 19 asked for the code behind the interface: the run task in mise.toml and the dispatcher that runs status. Read in full, scripts/run_task.py judges a typed RunRequest through runs.run_request before launching and launches only on proceed, takes a per-worktree lock for mutating tasks before deciding, and keeps typed, digested evidence of both streams. It also leaves the child's stdin inherited, sets no timeout or session, passes the environment through, records an absolute evidence path, types RunSummary.verdict as a free string, and signs fail-open: _resolve returns None on an unreadable key and the run proceeds unsigned. Hence A.180, and new proofs on A.150 and A.166.", maps_to = ["A.180"] },
  { source = "SESSION", ref = "2026-10-21 production-grade architecture review, round 19, status read from its code", text = "mise.toml's status task, lines 175 to 196, is a bash script that fails four of A.157's criteria today: git rev-parse --abbrev-ref HEAD names a detached HEAD HEAD; if [ -z \"$(git status --porcelain)\" ] runs git in a command substitution inside a test, where set -e does not apply, so a failed git prints clean; '@{u}' and develop..HEAD map any failure to (none) and (on develop), fabricating state; and git status runs without GIT_OPTIONAL_LOCKS=0. It compares local develop, not origin/develop. status is a plain task, so mise run status runs it with no record or policy, confirming A.179's premise; the gateway's absolute evidence path confirms A.161.", maps_to = ["A.157", "A.161", "A.179"] },
  { source = "SESSION", ref = "2026-10-21 production-grade architecture review, round 19, further facts read from the code", text = "Facts read from the code in round 19 and first stated while answering later repeats. Marking status read-only in contracts/task-effects.toml only spares it the per-worktree lock; nothing enforces read-only (A.172). scripts/run_task.py resolves ROOT from its own location, uses it for mise.toml, task-effects.toml and lock keys, and never reads MISE_ORIGINAL_CWD; the other scripts are unread (A.161). audit:models refuses a model deriving from BaseModel directly, so a status observation contract derives from Contract, and whether Contract forbids extra fields and coercion is unverified, contract_base.py being unread (A.149). The gateway's decision carries one reason code, not per-rule verdicts (A.166), names its policy by path, never by digest (A.152), and records no actor (A.163).", maps_to = ["A.149", "A.152", "A.161", "A.163", "A.166", "A.172"] },
  { source = "SESSION", ref = "2026-10-21 production-grade architecture review, round 25, pinned tools and dry runs", text = "Round 25 paraphrased rounds 5, 7 and 12; only its new claims are recorded, answered from mise.toml as read in round 19. It said the command depends on whatever tool versions mise resolves at that moment: mise.toml pins every tool to an exact version under [tools], requires min_version 2026.10.4, sets lockfile true and auto_install false, and floors releases with minimum_release_age, so nothing resolves at run time; what holds is that a run does not record the versions it used (A.176). It said there is no dry run: status is a read, and the destructive tasks branches:prune, branches:retire and source:restore already default to a dry run unless --yes, which effect classes make a declared property (A.169). Rounds are numbered by arrival: 20 to 22 were retracted repeats, and 23 and 24 verbatim repeats of rounds 18 and 19, left unrecorded.", maps_to = ["A.169", "A.176"] },
  { source = "SESSION", ref = "2026-10-21 production-grade architecture review, round 26", text = "Round 26 paraphrased rounds 6 and 13, all recorded, except an OpenLineage-style event. OpenLineage is a JSON-Schema specification for what a job read and wrote: a run sends at least START and COMPLETE, FAIL or ABORT, names input and output datasets, and a parent facet names the run that spawned it. OpenTelemetry spans (A.151) record timing and call structure, not datasets, and recsys's data tasks, data:fetch, model:fit and site:movielens, leave no record of the files a model was fit on. Each run therefore emits OpenLineage run events with its datasets and digests (A.181).", maps_to = ["A.181"] },
  { source = "SESSION", ref = "2026-10-21 capabilities centralized in cscie103-data-engineering", text = "cscie103-data-engineering is the reference repository whose capabilities every sibling ports. Each capability planned in A.149 to A.181 is imported into cscie103 immediately after it merges here and before the next capability starts: in cscie103's own worktree, under its own plan step tracing to the step here, by source:port from this repository at the merged commit, with its proofs green, check and a merged pull request. Siblings in other worktrees can then port the current capability at any time. A.148 and A.147 came from cscie103 and need no import. Implementation order: A.157; A.150 and A.180; A.149, A.166 and A.170; A.179 and A.158 to A.160; then plan order. Paused work resumes after the last import.", maps_to = ["A.149", "A.150", "A.151", "A.152", "A.153", "A.154", "A.155", "A.156", "A.157", "A.158", "A.159", "A.160", "A.161", "A.162", "A.163", "A.164", "A.165", "A.166", "A.167", "A.168", "A.169", "A.170", "A.171", "A.172", "A.173", "A.174", "A.175", "A.176", "A.177", "A.178", "A.179", "A.180", "A.181"] },
  { source = "SESSION", ref = "2026-10-21 a listing that could not match", text = "Porting cscie103's capability audit, upstream:checkout listed its tree with the pathspecs 'contracts/*remediation*', 'tests/test_*layer*' and 'tests/test_capabilit*'. git ls-tree takes literal paths, so none matched, and the listing returned the other paths with exit 0, silent about files known to exist, among them tests/test_capability_audit.py, read moments before. Fixed at once under the zero-tolerance rule for technical debt, before resuming A.149.", maps_to = ["A.182"] },
  { source = "SESSION", ref = "2026-10-21 a clone reused from another source", text = "Confirming cscie103's move to fustaomni, upstream:checkout of https://github.com/fustaomni/cscie103-data-engineering returned the existing clone made from ltphongssvn's URL in a quarter second: the target was named by basename and commit only, and an existing one was reused after checking HEAD, never origin. A.28's proofs all began from no directory, A.113 required no proof, and A.114's copy verifier trusts the same reuse. 2026 clone caches name each clone by the URL plus a short SHA-256 of it and verify the remote before reuse. Fixed at once under the zero-tolerance rule, before A.183 resumes.", maps_to = ["A.184"] },
  { source = "SESSION", ref = "2026-10-21 cscie103 reached through a redirect", text = "cscie103's merge commits read from ltphongssvn through pull request #174 on 2026-10-18 and from fustaomni from #203 on 2026-10-20: GitHub names a same-repository pull request by its owner, so the repository moved. contracts/provenance.toml still named https://github.com/ltphongssvn/cscie103-data-engineering, reached only by redirect. 2026 practice keeps redirects working but never relies on them in tracked files, and a redirect ends silently once anything is created at the old path. The vendor patch for project-identity.toml keeps its quoted line, reproducing cscie103's file at the pin.", maps_to = ["A.183"] },
  { source = "SESSION", ref = "2026-10-21 the reference repository is workable only under Nix", text = "Importing A.182 to A.184 into cscie103-data-engineering failed twice: the chain named a MacBook path and ran on FAS OnDemand. cscie103's mise.toml runs every task in nix develop (line 87) and declares no [tools], so on FAS none of its tasks can run, and the centralization rule cannot be carried out from where the work happens. Its sibling cscie103-olap-oltp solves this with a MISE_ENV override; cscie103 has none. recsys's founding policy allows only recsys's own mise.toml, so a sibling is trusted by provenance instead: its mise.toml unmodified at a commit on its develop, and a generated mise.local.toml excluded through .git/info/exclude. Pins: databricks 1.15.0, osv-scanner 2.5.1, temurin-17.0.19+10, and recsys's own six.", maps_to = ["A.185"] },
  { source = "SESSION", ref = "2026-10-21 a sibling trusted but not workable", text = "The first real sibling:checkout of cscie103-data-engineering cloned, wrote its FAS mode and trusted it, all three trust facts true. Then cscie103's own gateway died on an empty .venv, No module named pydantic, because nothing ran its setup; worktree:add in this family always trusts and then runs mise run setup in a cleaned environment (D.12). And mise warned that databricks is not in its registry, suggesting databricks-cli, which A.185's own proof had locked in. mise registry lists shorthands offline, so declared names can be proven.", maps_to = ["A.186"] },
  { source = "SESSION", ref = "2026-10-21 a sibling checked out on its release branch", text = "cscie103's repo:history in the FAS clone showed its HEAD at 8749cf7, the Oct 19 release merge on main: git clone takes the remote's default branch, cscie103's is main, and GitFlow work happens on develop. Its plan lacked D.265 and later, which exist only on develop. Yet the trust evidence said head_on_develop, because A.185 tested ancestry and a released main is always an ancestor of develop. git merge --ff-only refuses rather than merges when a fast-forward is impossible, and merging into uncommitted changes is discouraged.", maps_to = ["A.187"] },
  { source = "SESSION", ref = "2026-10-22 the FAS toolchain drifted from the sibling's flake", text = "cscie103's check:offline on FAS failed its policy gate with 35 prefer-string-interpolation findings in 20 policies nobody changed. Its flake.lock pins nixpkgs 39ad350; nixpkgs there ships regal 0.42.0, opa 1.19.1, uv 0.12.22, lefthook 2.1.15, databricks-cli 1.18.0 and Temurin 17.0.20, while the FAS override pinned regal 0.43.0, opa 1.21.1, uv 0.12.23, lefthook 2.2.0, databricks-cli 1.15.0 and Temurin 17.0.19+10, copied from this repository's own pins. betterleaks, osv-scanner and zizmor matched.", maps_to = ["A.188"] },
  { source = "SESSION", ref = "2026-10-22 the corrected pins could not reach a clone mid-feature", text = "After A.188 merged, cscie103's clone was on feature/gate-toolchain with D.274 uncommitted. sibling:checkout puts a sibling on its declared branch, clean, before writing anything, so it refuses there, and cscie103 has no governed way back to an existing branch: start:here only creates one. D.274's gate fails under the drifted regal until the override is rewritten. The override is generated from the declaration and its path is already trusted, so writing it in place moves nothing.", maps_to = ["A.189"] },
  { source = "SESSION", ref = "2026-10-22 a rewritten override left untrusted", text = "sibling:override wrote cscie103's corrected mise.local.toml and announced sibling_override_written; the next task there failed with 'Config files in mise.local.toml are not trusted'. Under paranoid mode mise trust is content-bound, so a changed file must be trusted again. machine_trust.py says so, and sibling:checkout trusts both files after its policy allows them; A.189 assumed an already-trusted path stayed trusted.", maps_to = ["A.190"] },
  { source = "SESSION", ref = "2026-10-23 never rewrite git lineage", text = "The owner set a rule: git lineage is never rewritten. Integrating feature/project-site, 28 commits already pushed by branch:push and 166 behind develop, worktree:refresh ran git rebase origin/develop and stopped at 1/28; finishing it would have replaced every commit and needed a force. 2026 practice merges what is shared, keeps a long-lived branch current by merging its base into it, and undoes a stopped integration with git merge --abort or git rebase --abort. recsys had no governed abort, refresh only rebased, and worktree:continue concluded a rebase alone. cscie103's back_merge.py merges with --no-ff and a message carrying the Plan-Step trailer commit-msg checks, and aborts a failed merge; it has no worktree abort or merge-based refresh.", maps_to = ["A.191"] },
  { source = "SESSION", ref = "2026-10-23 lineage critique, round 1", text = "Critique round 1 on the planned lineage guard set two levels: hook interception before git writes a replacement commit, and DAG ancestry verification with git merge-base --is-ancestor, which holds for commit and merge and fails for rebase and amend; it gave typed frozen Pydantic inputs with a closed Literal source set, stdin closed, and a lineage_rewritten code. 2026 sources: git's reference-transaction hook runs for every command writing refs, receives old, new and ref name per line on stdin, and aborts the transaction on a non-zero exit in the prepared state, so ancestry is checked at the write and refuses it rather than reporting it after; lefthook passes a hook its stdin with use_stdin: true; lefthook documents LEFTHOOK=0 as skipping every hook, so local layers are bypassable and only a server-side ruleset refusing non-fast-forward updates cannot be. Adopted: typed contracts and the ancestry check, moved into reference-transaction; stdin closed. Corrected: merge-base exits 1 for not an ancestor and 128 for an error, so an error is unknown and refuses without being called a rewrite (A.166); contracts derive from Contract, not BaseModel (audit:models); git runs through gitenv's scrubbed environment (ERR_GIT_SPAWN_UNSCRUBBED). Rejected: a second CommandOutcome model with its own schema_version, since one contract per concept (A.71). Added: scope by ref, local branches keep their old tip, tags never move, remote-tracking refs follow their upstream, deletion is not a rewrite; each layer's scoped claim names its bypass. Recorded before any code; implementation waits until every critique round is processed.", maps_to = ["A.192", "A.193", "A.194"] },
  { source = "SESSION", ref = "2026-10-23 lineage critique, round 2", text = "Critique round 2 named two cautions. First, an all-zero old value does not mean a ref is new: git's githooks documentation says that when force updating a reference regardless of its current value, or when creating it anew, the old value is the all-zeroes object name, and that the two are told apart by inspecting the ref's current value with git rev-parse; git update-ref without an expected old value produces exactly that input. Round 1's design would have passed a forced reset, branch -f or update-ref as a creation. The guard now resolves the current tip itself through gitenv, judges ancestry against it, passes a genuinely absent ref as a creation, and refuses a tip it cannot read as unknown. Newer git also denotes symbolic-ref updates with a ref: prefix in the old and new fields, so the update contract models an object name or a ref target, and a symbolic update, which orphans no commit, passes. Second, a deletion rewrites no commit but can remove the last name for some, which garbage collection then prunes; preserving reachable history is its own rule. A local branch deletion is refused unless its tip is reachable from origin/develop, origin/main or an archive tag, as worktree:remove's containment check (A.138) and branches:retire's archive tag already practise, and the server ruleset protects archive tags from update and deletion (A.194). Each layer's claim is worded exactly: in a clone with the hooks installed, no local branch moves to a tip that does not contain its previous tip and none is deleted unless a preserved ref reaches its tip, bypassable by LEFTHOOK=0, core.hooksPath or another clone. Recorded before any code; implementation waits until every critique round is processed.", maps_to = ["A.192", "A.194"] },
  { source = "SESSION", ref = "2026-10-23 lineage critique, round 3, detection behind prevention", text = "Critique round 3: the layered design does not establish that history can never be rewritten, since local hooks are bypassable and commit-source detection has edge cases needing explicit security analysis. GitHub's documentation shows rulesets carry bypass lists and statuses including Disabled, and a ruleset active with an empty bypass list blocked even an organization owner; so the server prevents a rewrite only while it stays active with no bypass actor, and an administrator can change either. No layer alone can promise never; what can be promised is prevention in layers and detection behind them. A reviewed threat register names every known way to rewrite or lose history with its preventing layer, detecting layer and residual risk, and a signed checkpoint of every develop and main tip observed by pr and sync, anchored as the run ledger is (A.87), is verified at every check so a rewrite reaching GitHub is reported naming the commit it lost; an unreadable checkpoint is unknown and fails the gate.", maps_to = ["A.195"] },
  { source = "SESSION", ref = "2026-10-23 lineage critique, round 3, hooks and server", text = "Round 3's commit-source analysis: git's githooks documentation gives prepare-commit-msg's source as message for -m or -F, template, merge, squash, or commit followed by an object name for -c, -C or --amend, and builtin/commit.c tests -m first, setting the source to message. So git commit --amend -m and --amend -F report message and slip past a source check, a false negative for the very case it was for, while -c and -C, which make a new commit from a reused message, report commit, a false positive. prepare-commit-msg is withdrawn as a guard. An amend moves the branch to a commit that does not contain the old tip, so reference-transaction refuses it by ancestry whatever its message source; pre-rebase stays for an early, clean refusal. The edge-case analysis also adds git replace, which changes apparent history without rewriting an object, so refs/replace writes are refused. Server side, the lineage ruleset must be active with an empty bypass list, verified by check:ruleset, and each layer's claim names what bypasses it and which layer detects that bypass (A.195). Recorded before any code; implementation waits until every critique round is processed.", maps_to = ["A.192", "A.194"] },
  { source = "SESSION", ref = "2026-10-23 critique round 4, isolation and credentials", text = "Critique round 4 assessed phase 1, repository isolation: worktree:add is good isolation provided it validates branch names, checks existing worktrees and refuses unsafe overwrites; and the exported prompt variables are not a zero-trust boundary, since GIT_ASKPASS= sets an empty value rather than proving every credential helper is disabled, so authentication and authorization should be controlled independently. The command ran was worktree:add -- lineage-guard, the -- ending mise's options; the critique's -lineage-guard reading is the case a slug check must refuse. worktree.py's slug check promises lowercase kebab-case but tests isalnum or dash, accepting uppercase, Unicode letters, a leading dash and any length, and never asks origin for the branch. 2026 sources: an agent platform runs git with GIT_ASKPASS= and core.askPass= empty, credential.interactive false and GIT_TERMINAL_PROMPT=0 while credential helpers stay enabled; an August 2026 report found git push waiting under an editor's credential helper and its askpass although gh auth status held a valid credential, fixed by an empty helper reset followed by gh auth git-credential; gitcredentials documents that an empty credential.helper resets the helper list. The gateway therefore pins the chain for every git it starts, credential:audit observes the effective chain and token scopes, pushes refuse anything outside the declared allowlist or unknown, and authorization stays with the server rulesets.", maps_to = ["A.196", "A.197"] },
  { source = "SESSION", ref = "2026-10-23 critique round 4, the export line made redundant", text = "Round 4 found every chain begins by exporting the prompt-suppression variables, a caller-side convention rather than a property of the run: a chain that forgets them runs git and gh with prompts possible. A.150 already plans the gateway injecting the non-interactive environment and suppressing every GUI and askpass vector; it gains a proof that a run with none of the variables exported by its caller is still non-interactive, so the export line becomes redundant rather than load-bearing, and prompt suppression is never claimed as a security boundary (A.197).", maps_to = ["A.150", "A.197"] },
  { source = "SESSION", ref = "2026-10-23 critique round 5, hooks installed and failing closed", text = "Critique round 5 on the hook layer: a YAML file does not prove git invokes a hook, so the effective hooks path, installation, permissions and any core.hooksPath override must be verified in every clone and worktree; local hooks are guardrails, not a boundary, and protecting remote refs does not stop rewritten commits being built locally; and hooks must fail closed when mise, uv or Python is missing, a project task manager inside hooks being a bootstrap dependency a minimal independent executable avoids. The quoted configuration was round 1's: round 3 withdrew prepare-commit-msg. 2026 sources: lefthook issue 1548 reports the generated shim prints Can't find lefthook in PATH and exits 0, silently skipping configured hooks, reproduced on lefthook 2.1.15 where git commit recorded the commit; with assert_lefthook_installed true the shim aborts with exit 1; and lefthook install writes one hook into the shared git directory that every worktree uses. This repository's lefthook.yml does not set the option, so its commit-msg and pre-push jobs fail open today. lefthook is made fail closed and hooks:verify observes the effective state wherever hooks are installed.", maps_to = ["A.198"] },
  { source = "SESSION", ref = "2026-10-23 critique round 5, standalone lineage hooks", text = "Round 5's bootstrap point: a hook that runs mise, uv and Python depends on the project's toolchain during every git operation, and fails open if lefthook itself is missing. reference-transaction fires on every ref write, so routing it through mise and Python would also add a process start to every commit, fetch and checkout. The lineage hooks become standalone POSIX sh executables depending on git alone, set -eu, refusing on any missing tool, unreadable value or unexpected input, installed by hooks:install outside lefthook, whose install leaves unconfigured hook names in place. The typed Pydantic lineage:guard of round 1 stays as the reference, and a conformance proof runs both over one decision table, requiring identical verdicts. The round's scope point adds a threat: rewritten commits built locally and published under a new branch name rewrite no existing ref, so neither the hooks nor the ruleset refuse them; the register names it, its residual risk of duplicated history through a pull request, and its detection by patch identity against develop.", maps_to = ["A.192", "A.195"] },
  { source = "SESSION", ref = "2026-10-23 critique round 6, proofs that show why git refused", text = "Critique round 6 assessed the seven planned lineage tests, written for the round 1 design and never run: unit proofs do not show git invokes the hook, a YAML proof does not show installation, one amend and one commit do not cover the variants, the integration helper wrote hooks by hand so neither half proved the production path, the fixture isolated HOME without controlling every git config source, and a non-zero exit is not evidence the policy worked, since missing identity, a conflict or a broken hook fail it too. 2026 sources: a worktree test failed when a global core.hooksPath pre-push hook blocked its push, fixed with GIT_CONFIG_GLOBAL=/dev/null and GIT_CONFIG_NOSYSTEM=1; another fix adds an empty GIT_TEMPLATE_DIR so git init copies no hook, and strips env-injected GIT_CONFIG_PARAMETERS and GIT_CONFIG_COUNT; a hook-exported GIT_DIR overrides -C and redirects a test's git onto the real repository, which matters here since pre-push runs check:offline; and a regression proof injects a hostile GIT_CONFIG_GLOBAL to show the helper hides it. This repository's ERR_TEST_GIT_ENV_LEAKED audit covers repository-local variables only. Proofs now run in one hermetic fixture, install through the real installers, and are differential.", maps_to = ["A.199"] },
  { source = "SESSION", ref = "2026-10-23 critique round 6, the installed path and every variant", text = "Round 6 asked for an outside-in proof of the whole production path. Since round 5 that path is git, the installed standalone sh hook, git plumbing and a structured refusal, with no mise or Python in it, so A.192's acceptance proofs install through hooks:install into a disposable hermetic repository and drive real git commands over a table: refused, each with its code and refs unchanged, are --amend, --amend -m, --amend -F, --amend --no-edit, --amend --allow-empty, rebase, rebase -i, reset --hard, branch -f, update-ref, a tag move, a replace ref and an unpreserved deletion; passed are a commit, a fast-forward, merge --no-ff, a squash merge, cherry-pick, revert, pull --ff-only, fetch, -c and -C reuse and a preserved deletion. Each refusal is attributable because the same operation succeeds unguarded, and the hook writes exactly one command-outcome/v1 line to stderr, read by the contract rather than matched as text. A.198's fail-closed proof likewise runs through a real lefthook install with no lefthook on PATH.", maps_to = ["A.192", "A.198"] },
  { source = "SESSION", ref = "2026-10-23 critique round 7, the lineage decision through the spine", text = "Critique round 7 assessed A.192 against everything as code and as data: policy, workflow, tests, acceptance criteria, configuration, capability, provenance and mutation present; evidence an empty container; verdict partial with no typed rule verdict; decision, state, attestation and audit trail missing; and CommandOutcome mixing observation, judgment and status, where UNKNOWN must not become ALLOW. The table judged the round 1 sketch, which wrote CommandOutcome directly; the house spine already separates typed evidence, Rego, per-rule verdict/v2 and decision/v1 in a signed ledger for gateway tasks, but round 5's standalone sh hooks could not reach it. 2026 sources: hook-time guards run a pinned OPA binary, SHA-256 verified, through subprocess opa eval; undefined rules count as deny and a resolver picks the most restrictive candidate; fail-open is a common default, made auditable by a per-decision source field; and a decision record carries rule ids, a rulebook digest, a decision id and a duration. Here enforcement is fail-closed and not configurable; REQUIRE_REVIEW cannot wait inside a git hook, so it is a deny naming the reviewed route, such as branches:retire for an unpreserved deletion; and audit records are chained with git hash-object and ingested into the signed ledger.", maps_to = ["A.200"] },
  { source = "SESSION", ref = "2026-10-23 critique round 7, hooks enforce only the decision", text = "Round 7's enforcement point: only an authorized decision lets the operation continue. Round 5 made the lineage hooks standalone sh on git alone to fail closed without the toolchain, which left them unable to reach the Rego policy. They now evaluate runs.lineage with the pinned OPA binary, at an absolute path baked in by hooks:install and checked against its SHA-256 at every run, keeping mise, uv and Python out of every ref write. git proceeds only on an explicit allow: deny, unknown, an undefined result, a missing or altered binary and any error all refuse, and each refusal is the one contract line on stderr that names its rule and the decision record appended to the audit chain (A.200).", maps_to = ["A.192", "A.200"] },
  { source = "SESSION", ref = "2026-10-23 critique round 8, strict raw evidence and the server layer", text = "Critique round 8 offered a Pydantic boundary: a frozen, extra-forbidding base, pass, fail and unknown verdicts, allow and deny decisions with unknown denied, LineageEvidence holding operation, source and rewrite_detected, and a RuleVerdict with a free reason_code; it noted Pydantic validates an observation's shape, not its truth, and that authoritative remote protection is a server-side ref-update rule. Adopted: unknown denies, as A.200 records; and truth is checked, each ancestry by two independent probes, merge-base --is-ancestor and an empty rev-list old --not new, disagreement being unknown, with raw exit statuses kept so ingestion re-checks them where the objects exist. Corrected: the base lacked strict=True, and lax mode coerces the string false into False, turning a malformed shell observation into a confident one; rewrite_detected is a conclusion that audit:evidence refuses in evidence, letting whoever builds the evidence decide; reason codes are registered, never free strings; BaseModel gives way to Contract. Superseded: operation and source, withdrawn in round 3, replaced by A.200's classes. 2026 GitHub documentation places pre-receive hook scripts on GitHub Enterprise Server, created by its site administrator; github.com has none, so the server layer there is the ruleset's non-fast-forward rule, GitHub's own ancestry check (A.194), and runs.lineage would serve as a pre-receive policy only after a move to Enterprise Server, which the threat register records as an upgrade path, not a layer.", maps_to = ["A.200", "A.194"] },
  { source = "SESSION", ref = "2026-10-23 critique round 9, durable sequences", text = "Critique round 9's P2: a && chain stops on a non-zero exit but has no checkpoint recovery, structured transitions, retries or compensation, and autonomous execution needs timeouts, bounded retries, a per-worktree lock, idempotency keys and a durable journal, never blindly retrying a commit or pull request. This session met it: FAS OnDemand ended mid-check, and resuming meant reading status, the ledger and the merge state by hand before any commit. Present: the per-worktree lock. Planned: deadlines (A.150), declared sequences (A.153), effect classes (A.169), bounded retry refused for writes (A.170). 2026 sources: frameworks that resume by re-running need idempotent steps, so a non-idempotent effect can fire twice across a crash; the remedy is an attempt marker written before the write and halting on an unknown outcome, most unknowns resolved by a reconciler from the record the effect left; and the rule that a retry able to change the world twice needs the operation persisted with a stable key before the first effect. Every write here leaves an observable record, so resume reconciles by observation and stops only when it cannot. Compensation is absent by design: under the lineage rule a wrong commit is fixed forward.", maps_to = ["A.201"] },
  { source = "SESSION", ref = "2026-10-23 critique round 9, findings mapped to recorded steps", text = "Critique round 9 listed P0 to P2 findings. Already recorded: no universal guarantee, answered by scope over every ref write in a hooked clone, the server ruleset and detection behind it (A.192, A.194, A.195); amend detection by source, withdrawn in round 3 for ancestry and an adversarial matrix (A.192, A.200); end-to-end hook integration (A.192, A.198, A.199); a durable decision record (A.200). Added here: each hook takes exactly git's documented arguments, pre-rebase its upstream and optional branch, reference-transaction one of prepared, committed or aborted, anything else a usage refusal (A.192); provenance bound to execution, every run recording the provenance, policy and lock digests it ran under beside its task definition, ported files already re-proven byte for byte (A.6) with each entry's commit (A.136) (A.164); and SOC 2 alignment, each control naming its owner, access restriction, retention, monitoring and review cadence, the register claiming evidence production and never compliance, which an auditor judges over a period (A.168).", maps_to = ["A.192", "A.164", "A.168", "A.194", "A.195", "A.200"] },
  { source = "SESSION", ref = "2026-10-23 critique round 10, workflows as typed graphs", text = "Critique round 10 proposed representing a whole delivery as a typed agent-workflow/v1 specification, steps with capabilities and depends_on, each capability carrying input and output schemas, a side-effect class, an authorization requirement and an idempotency policy, an orchestrator persisting each step through PENDING, AUTHORIZED, RUNNING, OBSERVED, EVALUATED and SUCCEEDED, REFUSED or FAILED, and signed attestations binding commit, policy version, artifact digests, test results and workflow identity, since a SHA-256 establishes content identity but not who authorized or produced it. Already recorded: declared sequences (A.153), typed tools (A.162), authorization by key (A.163), effect classes (A.169), ordered run stages (A.174), the journal (A.201), decision attestations (A.152) and receipts (A.167). 2026 sources: an attestation binds a subject and digest to a predicate in the in-toto statement format, signed inside a DSSE envelope; verification has two halves, the signature and a policy over the predicate, since a policy that checks only signature validity accepts anything signed by anyone and a valid signature with the wrong source is a policy failure; an unreachable transparency log must not skip verification; and GitHub artifact attestations tie an artifact to a workflow run, commit and repository through Sigstore with no long-lived key. The spec is TOML, sequences become graphs, a completed workflow is an in-toto statement verified in both halves, and CI's gate attests with its workflow identity inside an environment, as this repository's workflow audit requires of id-token.", maps_to = ["A.202"] },
  { source = "SESSION", ref = "2026-10-23 critique round 10, the stopped state and two-half verification", text = "Round 10's step states end in succeeded, refused or failed, leaving no place for an outcome that cannot be known, the case round 9 established must stop rather than be retried; A.201 adds stopped, awaiting reconciliation or a person, makes the states closed with illegal transitions refused, and persists each transition before the next. Its attestation point is taken one step further: a digest identifies content, and a signature identifies a key, but neither authorizes anything until a policy checks which key signed what claim about which source. Receipts (A.167) are therefore verified in both halves, the signature against the published keys and a policy over the claim, so a valid signature on a claim the policy rejects fails, and a verification that cannot complete is unknown, never pass (A.166).", maps_to = ["A.201", "A.167"] },
  { source = "SESSION", ref = "2026-10-23 critique round 11, acceptance first and a walking skeleton", text = "Critique round 11, a closing qualitative assessment of the round 1 sketch, rated task abstraction and outside-in TDD a strong foundation, strict contracts and structured evidence partial, security enforcement and agentic orchestration major gaps, and set the priority of strengthening acceptance proofs around real amend behaviour and installed hook execution before A.192 is treated as a universal lineage guarantee. Each rating maps to steps recorded in rounds 1 to 10: contracts and evidence (A.200), enforcement at the server and detection behind it (A.194, A.195, A.197), orchestration (A.201, A.202), the installed path (A.192, A.198). 2026 outside-in sources: a failing outer-loop acceptance test is the starting signal for implementation, and it stays red while inner loops cycle; a walking skeleton, the thinnest end-to-end path proving every layer connects, comes before any other slice; and a slice whose unit tests pass while its acceptance test is red is not complete. The build therefore runs: A.199's hermetic fixture; A.192's acceptance proofs written red through the real installers, every amend variant included; a walking skeleton refusing one real amend through hooks:install, the installed reference-transaction hook, the pinned OPA binary and runs.lineage; then A.200 and A.192's inner proofs until the acceptance matrix passes. A.198, closing the live fail-open gap, goes early as its own slice. No step claims a universal guarantee.", maps_to = ["A.192", "A.199", "A.200", "A.198", "A.194", "A.195"] },
  { source = "SESSION", ref = "2026-10-23 cscie103 could not be read on FAS without a typed commit", text = "Centralizing recsys's capabilities into cscie103 needs cscie103's develop tip as a 40-character commit, because upstream:checkout reads at a commit, never a branch. Its tasks cannot run on FAS until its clone is set up, a Mac path was twice run on FAS, and no recorded task resolved a branch to its commit, so every route was a typed sha or a raw git call.", maps_to = ["A.204"] },
  { source = "SESSION", ref = "2026-10-23 sibling capabilities live only in chat until planned", text = "On FAS, sibling:checkout refused cscie103 because its flake.lock moved past the pins recsys holds, and those pins have no generator, so they could only be retyped. 2026 practice for committed derived data is a generator with a check mode, gated in CI. Centralizing what recsys built needs cscie103 read on FAS, which A.204 enables, and 2026 template practice lands a capability in the template and lets projects pull it by three-way merge. These three phases were mapped in chat only; they are planned here before any code.", maps_to = ["A.203", "A.205", "A.206"] },
  { source = "SESSION", ref = "2026-10-23 a search over a missing test file reported another file only", text = "source:search over mise.toml and tests/test_upstream.py returned matches_found from mise.toml and said nothing about tests/test_upstream.py, which does not exist; the proofs live in tests/test_upstream_checkout.py. A path that cannot be searched reads as a path with no matches.", maps_to = ["A.148"] },
  { source = "SESSION", ref = "2026-10-23 git and setup calls run unbounded, and source:apply needs stdin", text = "gitenv.git takes only args and cwd, with no deadline; sibling_checkout._run_setup and the A.188 test helper calling mise ls-remote are unbounded subprocesses. source:apply - reads its spec from stdin, which works only because run_task.py passes the caller stdin through, so closing stdin in the gateway must keep that path.", maps_to = ["A.150"] },
  { source = "SESSION", ref = "2026-10-23 gitenv.git suppresses no prompt", text = "gitenv.git scrubs repository-routing variables only and sets none of GIT_TERMINAL_PROMPT, GIT_ASKPASS, SSH_ASKPASS, SSH_ASKPASS_REQUIRE, GCM_INTERACTIVE or GCM_GUI_PROMPT, so a remote asking for credentials would prompt. upstream.tip adds them locally until gitenv owns them.", maps_to = ["A.197"] },
  { source = "SESSION", ref = "2026-10-23 a refresh that changed mise.toml stopped at its own commit-msg hook", text = "worktree:refresh sibling-pin A.203 merged origin/develop with no conflict, but the merge commit ran commit-msg, whose plan steps job called mise, and mise refused the merged mise.toml as untrusted: paranoid trust is bound to content. git left the merge uncommitted, and cmd_refresh re-trusts a changed mise.toml only after the merge commit at line 281, so the re-trust was never reached. mise documents that under paranoid a changed config must be trusted again.", maps_to = ["A.207"] },
  { source = "SESSION", ref = "2026-10-23 the merge commit is now made by the commit after a no-commit merge", text = "A.207 stages the refresh merge with --no-commit and makes the merge commit with git commit -m, after a changed mise.toml is trusted. git records MERGE_HEAD so that commit is the merge commit, and commit-msg runs on it. A.191's proof test_the_merge_commit_names_its_plan_step read the message from the merge call; it now requires the merge to be --no-commit and reads the message from the commit, still ending in Plan-Step.", maps_to = ["A.191", "A.207"] },
  { source = "SESSION", ref = "2026-10-24 the java pin ignored the build nixpkgs records", text = "sibling:pin refused java: nixpkgs ships 17.0.20, matched by temurin-17.0.20+8 and temurin-17.0.20+101. nixpkgs temurin-bin sources.json records build beside version in each architecture entry, and the siblings.toml key path read version alone, so any build of 17.0.20 matched. A.188 pinned temurin-17.0.20+101 that way, and its live proof could not tell builds apart; a Temurin 17.0.20 install elsewhere reported build 17.0.20+8. The key path now reads the whole x86_64 entry and the pin is version plus build.", maps_to = ["A.188", "A.203"] },
  { source = "SESSION", ref = "2026-10-24 a search over untracked files reported no matches", text = "source:search, which searches tracked source, returned 0 matches for strings present in tests/test_sibling_pins.py and scripts/sibling_pins.py, both new and not yet committed, with no notice that they were not searched. source:read read both from disk.", maps_to = ["A.148"] },
  { source = "SESSION", ref = "2026-10-24 nixpkgs records a JDK point release under its base version", text = "With version and build composed, sibling:pin refused java: nixpkgs ships 17.0.20+1; mise lists no version matching it. Adoptium released jdk-17.0.20.1+1, a point release, and nixpkgs temurin-bin sources.json records version 17.0.20 and build 1 for it, while its url, the asset nix downloads, carries the release tag jdk-17.0.20.1%2B1. The shipped release is therefore read from the url tag, with version and build only as a fallback.", maps_to = ["A.203"] },
  { source = "SESSION", ref = "2026-10-24 mise names a Temurin point release by Adoptium semver", text = "sibling:pin read jdk-17.0.20.1+1 from the nixpkgs url tag, and mise listed no such version. Adoptium semver has three numbers, so a point release folds its fourth into the build as patch times 100 plus build: 17.0.20.1+1 is 17.0.20+101, which mise lists as temurin-17.0.20+101. cscie103 moved nixpkgs in 5c10d538, D.86, after A.188 recorded 39ad350.", maps_to = ["A.203"] },
  { source = "SESSION", ref = "2026-10-24 correction: A.188 pinned the point release, in mise naming", text = "The candidate 2026-10-24 the java pin ignored the build nixpkgs records said A.188 pinned temurin-17.0.20+101 without evidence. temurin-17.0.20+101 is the Adoptium semver of jdk-17.0.20.1+1, the point release, so the pin named a real release; only its proof could not tell builds apart.", maps_to = ["A.188", "A.203"] },
  { source = "SESSION", ref = "2026-10-24 sibling:pin listed versions under this repository cooldown", text = "sibling:pin refused osv-scanner: nixpkgs ships 2.7.0, mise lists no version matching it. recsys mise.toml sets minimum_release_age to 2026-10-08, and mise ls-remote, run from this worktree, hides releases newer than that; cscie103 refreshed nixpkgs on 2026-10-22 in 5c10d538. A sibling pin mirrors the sibling flake and is an exact version, which the cooldown does not filter at install, so the listing asks mise with --minimum-release-age 0s.", maps_to = ["A.203"] },
  { source = "SESSION", ref = "2026-10-24 sibling:override left the clone's own mise.toml untrusted on a feature branch", text = "The cscie103 clone was switched to feature/gate-toolchain, its unpushed D.274 to D.276 work, by one recorded bootstrap git switch, since no cscie103 task switches to an existing branch. machine:trust refused its mise.toml under recsys's founding policy, which governs recsys and not cscie103. sibling:override then wrote and trusted mise.local.toml, but mise refused the branch's own mise.toml as untrusted: refresh_override trusts only the file it writes, while sibling:checkout trusts the clone after judging config_unmodified. Under paranoid trust each config file is trusted by its own content.", maps_to = ["A.208"] },
  { source = "SESSION", ref = "2026-10-24 the mid-feature override proof meets the unmodified-config refusal", text = "A.189 proof test_the_override_is_rewritten_on_a_clone_mid_feature leaves an uncommitted change in the clone mise.toml. Under A.208 the override still lands and is trusted, and that modified mise.toml is then refused rather than trusted. The proof keeps every assertion, override written, branch kept and the work untouched, and now also requires the refusal naming mise.toml.", maps_to = ["A.189", "A.208"] },
  { source = "SESSION", ref = "2026-10-24 the rewritten-override proof states the trust sequence", text = "A.190 proof test_a_rewritten_override_is_trusted_again pinned the trusted paths to the override alone, which was all that was trusted then. Under A.208 the override is trusted first and the clone's unmodified mise.toml after it, so the proof keeps exact sequence equality and states both, in that order.", maps_to = ["A.190", "A.208"] },
  { source = "SESSION", ref = "2026-10-24 cscie103 gate failed on a branch fourteen commits behind develop", text = "cscie103 pr refused feature/gate-toolchain: test, policy and problems failed. While the branch sat unpushed, develop landed Regal 0.43 (D.86) and rewrote its policies to string interpolation (D.252); the FAS pins, regenerated from the current lock, ran Regal 0.43 over the branch's older policies, and problems judged a branch behind its base, the gap D.269 names. The branch must take in develop first. cscie103 has no merge-based refresh for its main clone, and a merge commit there runs hooks against a mise.toml that A.208 rightly treats as modified, so the merge needs a governed task.", maps_to = ["A.209"] },
  { source = "SESSION", ref = "2026-10-24 cscie103's feature branch needs two refs merged", text = "cscie103 feature/gate-toolchain renumbered its FAS mode step to D.277 because the pushed fix 6495711f on feature/template-instance-waivers claims D.276 first. Its own commits still carry Plan-Step D.276, which resolve only once 6495711f is in its history, so the branch must merge that ref as well as develop. sibling:refresh therefore takes a named ref of the sibling's origin.", maps_to = ["A.209"] },
  { source = "SESSION", ref = "2026-10-24 Python written through a TOML literal spec carried doubled escapes", text = "A.209's first GREEN refused every step id: the step pattern and the merge message reached the file with doubled backslashes, because the spec wrote Python's escapes twice inside a TOML multi-line literal string, which performs no escaping. The same mistake was made on 9 September and 18 October. Inside a literal spec, Python's escapes are written once.", maps_to = ["A.209"] },
  { source = "SESSION", ref = "2026-10-24 a sibling merge stopping on plan conflicts, and a sibling config edited on FAS", text = "cscie103 feature/gate-toolchain must merge develop and feature/template-instance-waivers, and both sides appended plan entries, so each merge stops on the three plan files. cscie103 D.129 resolves them as data, but nothing concluded the merge governed. Adding cscie103's own plan:resolve task means editing its mise.toml in the FAS clone, which paranoid trust then refuses until a commit that itself runs through mise; trust is bound to content, and only a reviewer can vouch for new content, so it is bound to the digest the reviewer saw.", maps_to = ["A.210", "A.211"] },
  { source = "SESSION", ref = "2026-10-24 cscie103 merge of develop stopped with its config untrusted", text = "sibling:refresh cscie103-data-engineering D.277 stopped on context/plan-ids.toml, context/plan-trace.toml, context/plan.toml, contracts/mutations/d176.toml, scripts/check_all.py and scripts/publish_policy.py. sibling:conclude ran the clone resolver, which resolved and staged the three plan files, then refused on the three code files. The merge had rewritten mise.toml to develop's content, which refresh never trusted because it stopped first, so cscie103's own tasks were refused and its conflicts could not be read or resolved with them.", maps_to = ["A.212"] },
  { source = "SESSION", ref = "2026-10-25 a sibling merge commit left two edited specs out", text = "Resolving cscie103's merge of develop composed check_all.selected and publish_policy.expected, and re-anchored five mutants. Three files had been conflicted and were staged by sibling:conclude; contracts/mutations/d234.toml and d274.toml had merged cleanly, were edited afterwards and never staged, so merge commit f9a7eae kept their old anchors while mutation:check, reading the working tree, passed. Commit 6a848c4 recorded them.", maps_to = ["A.213"] },
  { source = "SESSION", ref = "2026-10-25 a sibling resolution with edits git had merged cleanly", text = "cscie103 feature/gate-toolchain merged develop's PR 218, which issued D.274 to D.281, so four of its ids were issued twice and its commit-msg hook refused the merge. Renumbering them to D.282 to D.285 inside the merge edited the plan files, three scripts, three proofs and mise.ood.toml, deleted d274, d275 and d277.toml and created d282, d283 and d284.toml, none of them conflicted. sibling:conclude refuses the edits as unstaged, offers no way to stage them, would not see the new files at all, and its hooks ran with this repository's VIRTUAL_ENV.", maps_to = ["A.214"] },
  { source = "SESSION", ref = "2026-10-25 cscie103's pr snapshot needed its tracked FAS mode", text = "With every gate passing in its working copy, cscie103's pr refused feature/gate-toolchain: in the snapshot, test and policy failed, the sandbox acceptance proof first, because a clean checkout carries no untracked mise.local.toml and its nested tasks entered nix develop, which FAS lacks. cscie103 D.284 tracks mise.ood.toml, selected by MISE_ENV=ood, for exactly this, and the snapshot keeps MISE_ variables; but run with MISE_ENV=ood in the clone, mise refused mise.ood.toml as untrusted, since sibling:override trusts only mise.local.toml and mise.toml.", maps_to = ["A.215"] },
  { source = "SESSION", ref = "2026-10-26 a plan file resolved by hand would be handed to the resolver", text = "cscie103 PR 226 was refused as conflicting, and merging develop again stopped on the three plan files and contracts/problems.toml: develop had issued D.282 to D.284 while this branch held them. The plan files were resolved by hand, unioned and renumbered to D.287 to D.289, and plan:trace agreed. sibling:conclude would still run the clone's resolver because the plan files were unmerged in the index, and the resolver, reading stages 1 to 3, refuses an id issued on both sides, so a correct resolution could not be concluded.", maps_to = ["A.216"] },
  { source = "SESSION", ref = "2026-10-26 centralizing into cscie103 needs ports planned into it", text = "cscie103 planned D.290 to D.296 to centralize recsys's 49 generic capabilities, D.290 first: the porting tools themselves. source_port.build takes the destination as here, but main passes ROOT, so a plan from recsys refuses every file as already present here, and cscie103 has no source:port yet. build also reads here/contracts/provenance.toml, the record of files a sibling ported from cscie103; cscie103, the canonical source, keeps none, since a file centralized into it becomes its own.", maps_to = ["A.217"] },
  { source = "SESSION", ref = "2026-10-27 cscie103 merge concluded against a reviewed merged config", text = "Concluding cscie103 PR 235's merge refused because its mise.toml, changed on both sides, matched neither parent, although sibling:trust had shown that exact merged content and recorded its digest against HEAD. A.212 trusts only by parent equality and never reads A.211's record, so any merge in which both sides change a sibling's config could never be concluded. The 2026 rule is that an approval binds the exact latest content: the recorded digest is that binding.", maps_to = ["A.218"] },
  { source = "SESSION", ref = "2026-10-28 a sibling clone left on an origin FAS cannot reach", text = "cscie103's repo:configure set the cscie103-data-engineering clone's origin to its SSH address, as it does on every machine. FAS OnDemand reaches GitHub only over HTTPS: SSH timed out on port 22 and was reset on ssh.github.com port 443. The clone could no longer fetch or push, and every governed way to cut a branch there fetches first, so cscie103 could not build its own fix from that clone. contracts/siblings.toml declares the clone's source as HTTPS, and sibling_checkout only compared origin with it. sibling:origin restores the declared source, refusing any origin that names another repository, so a sibling's transport can be repaired from the hub without a raw git command.", maps_to = ["A.219"] },
  { source = "SESSION", ref = "2026-10-28 the hub's siblings gate could not read three siblings on FAS", text = "cscie103's siblings accounted gate, D.322, runs centralization_survey in the pre-push hook and pr's snapshot, and the survey refuses a declared sibling with no mise.toml at its path. On FAS only cs1090a-recsys and the hub were cloned, so every pr from FAS was refused as unreadable for cs1090a-data-science, cs1090a-spec-driven-development and cscie103-olap-oltp. 2026 workspace practice keeps a declarative manifest and an install that clones what it declares, leaving per-repository setup to whoever works there. The survey only reads these siblings, so they are declared here with their sources and no FAS mode, and sibling:checkout clones them and judges the origin, writing and trusting nothing. Their sources were confirmed live under ltphongssvn; a guess under fustaomni was refused as not found.", maps_to = ["A.220"] },
  { source = "SESSION", ref = "2026-11-05 Milestone 2, the lecture critique and critique rounds C1 to C23", text = "Milestone 2 (due November 13) requires a data-wrangling notebook, a revised proposal and numbered slides, and the team needs one command on FAS OnDemand to clone, set up and open the notebook. A critique of the forty updated decks, each conclusion grounded by a live search, added a crossed random-effects bias model and ordinal regression as a sensitivity rung, kept elastic net inside the ridge and lasso rung, and added a prediction-interval coverage audit and a user-level sign-flip permutation test. Twenty-three critique rounds then hardened the plan: resumable, non-interactive commands; a discretionary edge removed from the milestone's critical path; cross-language contract parity and one compatibility policy; an independent completeness oracle; declared estimands with each method proven on synthetic data, convergence apart from singularity, pre-declared coverage targets and a stratified calibration step; data acquisition with a reviewed SHA-256 trust root rather than the publisher's MD5, and onboarding that declares and verifies its every input; a governed results contract carrying figures and environment from which documents are rendered; observations judged by policy with unknown never passed and writes under a fenced lock; negative paths, mutants and a walking skeleton built red first; requirement, observation and verdict kept apart by audit; proof outcomes read from the executor's own report; readiness enforced with typed blocking and evidence bundles bound to their commit; and the plan change itself made one governed, journaled, policy-checked and traced operation, this plan being the last change written without it.", maps_to = ["A.221", "A.222", "A.223", "A.241", "A.235", "A.224", "A.237", "A.225", "A.238", "A.226", "A.227", "A.228", "A.229", "A.230", "A.231", "A.232", "A.233", "A.234", "A.243", "A.236", "A.239", "A.240", "A.242"] },
  { source = "SESSION", ref = "2026-11-05 critique C1 commands can prompt", text = "A command relied on closed stdin alone, so git, ssh or gh could still prompt; the run gateway, not each command line, owns the non-interactive environment: no terminal prompt, no credential-manager window, ssh in batch mode, askpass removed, gh prompts and pagers off.", maps_to = ["A.150", "A.197"] },
  { source = "SESSION", ref = "2026-11-05 critique C1 fail-fast is not resumable", text = "A chain of commands stopped at the first failure but left earlier writes in place and could not resume; multi-step operations run as declared, journaled sequences of idempotent steps, never as shell chains.", maps_to = ["A.153", "A.201", "A.228"] },
  { source = "SESSION", ref = "2026-11-05 critique C5 reproducibility of every fit", text = "Each new model and technique records its fixed split by digest, its seeds, its locked package versions and its configuration, as every fitted model already does.", maps_to = ["A.100"] },
  { source = "SESSION", ref = "2026-11-05 critique C8 durable task state", text = "Every governed task moves through a closed set of states whose terminal states never change; an observation that could not be made is unknown and never becomes a pass; a completed step is not repeated; a retry happens only under a declared policy for an idempotent step; one owner holds an operation by lease and fencing token checked at every write; an action runs only after a validated authorization; and a result holds observations while an independent policy gives the verdict.", maps_to = ["A.45", "A.46", "A.47", "A.163", "A.166", "A.170", "A.174", "A.201"] },
  { source = "SESSION", ref = "2026-11-05 critique C9 every step built red first", text = "Each step's proofs are judged red on their behaviour before any implementation, then green, then the step's mutants run on that green baseline and must be killed before any refactor, and each verdict is recorded in the run ledger and evaluated before the step is decided done.", maps_to = ["A.31", "A.32", "A.41", "A.83", "A.116"] },
  { source = "SESSION", ref = "2026-11-05 critique C10 reuse the contracts already on disk", text = "Evidence, verdicts and decisions are already data: every run writes a hash-chained run record with its decision and reason code, and red and green verdicts are recorded. New steps reuse them rather than adding subsystems, while structured telemetry, signed verification statements and dataset lineage events stay where they are planned.", maps_to = ["A.41", "A.151", "A.152", "A.166", "A.170", "A.181"] },
  { source = "SESSION", ref = "2026-11-05 critique C11 one envelope and signed statements", text = "Every task's input and output is one versioned, schema-backed envelope, and signed verification statements are added where a provenance requirement justifies them, rather than for every artifact.", maps_to = ["A.149", "A.152"] },
  { source = "SESSION", ref = "2026-11-05 critique C12 three kinds of truth", text = "What is required, what was observed and what was concluded are kept apart: requirements change only by reviewed commits, observations carry no verdict, and every verdict names the policy, its digest and the observation it judged, so an independent verifier can recompute it, as a verification summary records its verifier, policy and time.", maps_to = ["A.48", "A.152", "A.156"] },
  { source = "SESSION", ref = "2026-11-05 critique C13 structured results nothing consumes", text = "The tasks already return structured outcomes and hash-chained run records with decisions, but a hand-assembled chain continues on exit codes and binds nothing; multi-step operations become declared, journaled sequences whose results are consumed, and the spec-to-file claim is signed through the sealed run records.", maps_to = ["A.153", "A.201", "A.110"] },
  { source = "SESSION", ref = "2026-11-05 critique C14 each stage traced as a task run", text = "Each stage of a governed sequence is traced as an OpenTelemetry CI/CD task-run span carrying the task name, its run id and its result, so a stage refused by policy is counted apart from a runner that broke, and the same stage correlates across runs.", maps_to = ["A.151"] },
  { source = "SESSION", ref = "2026-11-05 critique C16 durable operation states", text = "A linear chain stops on failure but neither records how far it got nor undoes what it applied; a plan change moves through requested, validated, applied and verified, or ends refused, rolled_back or failed, journaling each transition before the state changes, rolling back each provisional state by discarding its worktree, and reporting done only once its read-back has passed.", maps_to = ["A.242", "A.46", "A.201"] },
  { source = "SESSION", ref = "2026-11-05 critique C17 registration is not correctness", text = "A.223 registers each method's estimand and assumptions and is checked for presence by design; its statistical correctness is proven in the method steps on synthetic data first, with convergence apart from singularity, pre-declared coverage targets, and a stratified calibration diagnostic.", maps_to = ["A.223", "A.230", "A.233", "A.243"] },
  { source = "SESSION", ref = "2026-11-05 critique C18 onboarding establishes its inputs", text = "The publisher of MovieLens 1M offers only an MD5 checksum, which detects accidental corruption but not tampering and is served beside the download it describes, so the trust root is the reviewed SHA-256 pin committed in the repository with its provenance, the origin is allow-listed, and onboarding declares and verifies its repository, revision, tools, lock, data, install locations and kernel scope rather than assuming them; a matching digest proves the bytes equal the pin, not that the source is trustworthy.", maps_to = ["A.224", "A.235", "A.100"] },
  { source = "SESSION", ref = "2026-11-05 critique C19 figures and environment in the results manifest", text = "The results contract already carried every number with its provenance, but figures were output rather than data and the environment was only a lock digest; each figure is now an entry with its digest, title, axis labels, caption and source fields, rendered deterministically, the interpreter, platform and installed packages are recorded, and documents bind figures by id so their labels are checked from data rather than pixels.", maps_to = ["A.237", "A.238", "A.227"] },
  { source = "SESSION", ref = "2026-11-05 critique C20 typed outcomes produced from observed execution", text = "Task and proof outcomes are typed and produced by the executor from what it observed, never accepted from a caller: a proof outcome is a closed set read from the runner's own report, in which a skip, an expected failure or a missing result never counts as a pass and an error stays apart from a failure; the record of what happened carries no verdict, which a policy gives; a task's state must agree with its exit code; and every result names its revision and an immutable run id.", maps_to = ["A.149", "A.240", "A.31", "A.32"] },
  { source = "SESSION", ref = "2026-11-05 critique C21 controls proven over a period", text = "A control is shown to operate over a period rather than at a point: each control maps to the steps that enforce it and to run-ledger evidence retained for the whole period and filterable to any window, with test pass-history kept, so the population of evidence is complete from the first day.", maps_to = ["A.168", "A.41"] },
  { source = "SESSION", ref = "2026-11-05 critique C21 what a signature proves", text = "A signed statement attests the integrity of what was signed and who signed it within a trusted verification system; it never attests that a scientific result is correct, which only research acceptance against pre-declared verdicts decides.", maps_to = ["A.152", "A.236", "A.241"] },
  { source = "SESSION", ref = "2026-11-05 critique C21 typed retryability", text = "Every task's envelope declares whether it may be retried, its attempt budget and its backoff, so a caller can tell a safe retry from a dangerous one, and a task that is not idempotent is never retried automatically.", maps_to = ["A.149", "A.47", "A.201"] },
  { source = "SESSION", ref = "2026-11-05 critique C22 walking skeleton first", text = "Milestone 2 is built walking skeleton first: one number travels from the verified archive through onboarding, the governed notebook run and its results contract to one bound line of the rendered proposal, proven by a single outer acceptance test written red before any step is widened, so the riskiest integration fails early; the plan tooling's own acceptance tests, exact registration, preflight refusals, typed blocking and duplicate-free retry, are built after the milestone.", maps_to = ["A.235", "A.224", "A.237", "A.238", "A.239", "A.242"] },
  { source = "SESSION", ref = "2026-11-05 critique C23 authorized and observable plan changes", text = "A plan change is authorized from its actor's signing key before it runs and traced under one id across its stages; and the argument convention is stated in each task's usage, a task with a usage spec taking a double dash before its arguments and a raw_args task never, since mise forwards a raw_args task's arguments verbatim.", maps_to = ["A.163", "A.151", "A.242"] },
  { source = "SESSION", ref = "2026-11-05 the walking skeleton as its own ready step", text = "The walking-skeleton test was planned as A.238's first proof, to be written red before any Milestone 2 step was widened, but A.238 is blocked behind A.225 and A.223, and a step starts only once it is ready. The skeleton becomes its own step, depending only on what is done, so it can run first; A.238 keeps its other proofs and depends on the skeleton it widens.", maps_to = ["A.244"] },
  { source = "SESSION", ref = "2026-11-05 pr merged while a late check was pending", text = "pr opened a pull request whose second check registered only after the first was running, then tried to merge while that check was still pending, and GitHub refused the merge as unstable; the typed pull-request reader treats a check that registers late as one more to wait for, and merges only once the full set has completed.", maps_to = ["A.177"] },
  { source = "SESSION", ref = "2026-11-05 schema verdicts name no request", text = "A schema verdict judges a request against its schema but names no digest of that request, because its nine callers do not pass one; once every capability's input is typed and validated, each schema verdict names the digest of the request it judged.", maps_to = ["A.162"] },
  { source = "SESSION", ref = "2026-11-05 no contract classified as an observation yet", text = "The three-truths audit refuses a verdict field on any declared observation contract and is proven by its proofs and mutants, but the register declares no real contract as an observation yet, so over the repository's own contracts it audits nothing until each contract class is classified as requirement, observation or verdict.", maps_to = ["A.171"] },
  { source = "SESSION", ref = "2026-11-05 the hub spine lacks the verdict provenance rule", text = "This repository's spine now requires a verdict to name when it was judged and to name its policy and judged evidence by SHA-256, recorded as a vendor patch on the spine ported from cscie103; cscie103's own spine lacks the rule, so under the hub-first parity rule it is offered back to cscie103.", maps_to = ["A.241"] },
  { source = "SESSION", ref = "2026-11-07 the project site before Milestone 2", text = "The group is fixed at three members, Thanh Phong Le, Myra Puruganan and Sandra Palomo, with TF mentor Sukanya Krishna and a first TF meeting to be set, so the open seats, the join call and its note go. The title becomes 'A recommender that records why it recommended, and is judged on it'. The design now holds fourteen models and twelve techniques, and the site must carry each with an interactive lab before Milestone 2 work continues. The site typed in its MovieLens figures, its model, technique and milestone counts and numbers inside its prose; current practice renders a static site from typed, validated data and resolves every number to a committed artifact, so nothing on the site is typed in and Results reads each milestone's recorded evidence.", maps_to = ["A.245", "A.246"] },
  { source = "SESSION", ref = "2026-11-07 the walking skeleton drifted in unclassified", text = "A.244 merged scripts/milestone2.py on 2026-11-07 without classifying it, and centralization:inventory refused: not classified in contracts/centralization.toml. The hub then accounted it as RS.83, declined by X.10 as this project's own course-project pipeline (cscie103 D.439, PR 312), so this register classifies it as project, as it does model_run and data_fetch.", maps_to = ["A.247"] },
  { source = "SESSION", ref = "2026-11-07 recsys lacks status:paths, which the hub ported from it", text = "A.247 could not derive its commit paths: mise run run status:paths was refused ERR_RUN_TASK_UNDECLARED here, and commit paths is not a subcommand of this repository's commit. The hub's scripts/status_paths.py says it was ported from this repository's commit paths as RS.30 (cscie103 D.355); develop no longer holds it. So this repository adopts the hub's version at its develop tip 25ed9e7 through source:port: the script, its policy, its proofs and its mutation spec, with every dependency already here (command_outcome, contract_base, gitenv, repo_report.parse_porcelain, spine).", maps_to = ["A.248"] },
  { source = "SESSION", ref = "2026-11-07 recsys lacks plan:resolve, which the hub ported from it", text = "A.247's refresh from develop stopped on the three plan files, where A.247 and A.248 each appended an entry and nothing contradicts. This repository has worktree:conclude but no governed resolver; the hub's plan:resolve (D.129) was ported from this repository as RS.15, and develop no longer holds it. So this repository adopts the hub's version at 25ed9e7 through source:port, every dependency already here: plan_edit's PLAN, IDS, TRACE, _value and _validated, rebase_state's Operation, _operation and _unmerged, and nix_remediation's ActionableError.", maps_to = ["A.249"] },
  { source = "SESSION", ref = "2026-11-07 a terminated machine left a snapshot worktree registered here", text = "The compute session running A.250's pr ended mid-gate; its snapshot under /tmp vanished while git kept it registered as prunable, and repo_state then ran git status inside the missing directory, failing two proofs in the next gate. The hub fixed its identical code first as D.442, reading git's prunable marker and running nothing inside such a worktree, and this repository adopts it.", maps_to = ["A.251"] },
  { source = "SESSION", ref = "2026-11-08 adopting D.442 alone left repo:state failing here", text = "With D.442 adopted, this repository's repo:state proofs still failed on the vanished /tmp snapshot: repo_report.observe ran git inside every worktree's directory. The hub fixed that as D.443, its proof driving observe itself, and this repository adopts it with D.442 in one change.", maps_to = ["A.252"] },
  { source = "SESSION", ref = "2026-11-08 Milestone 2 re-planned to its brief five days before it is due", text = "With the hub's parity reached (149 entries, 0 open), Milestone 2 became the goal, due Friday November 13 at 9:59 pm ET with the TF presentation in the week of November 9. Read back from the plan, its path ran through A.224, A.221, A.237 and A.238, 56 proofs of onboarding, site-contract parity, governed notebook execution and claims-manifest machinery, of which the brief requires none, and A.237 waited on A.221 and A.238 on A.223 only for site work. Current practice ties each dependency to the milestone it gates and keeps the critical path to what the deliverable needs, and this plan's own critique rounds remove discretionary edges from a milestone's path. The brief is filed as a requirement contract; A.225, A.226 and A.227 widen the walking skeleton A.244 proved, A.225 delivering a real .ipynb with labelled plots and the brief's cleaning checklist; A.226 names the approval status and each staff condition; this step records the presentation; A.221, A.222, A.223, A.224, A.237 and A.238 follow the milestone unchanged.", maps_to = ["A.253"] },
  { source = "SESSION", ref = "2026-11-08 the deployed site, then onboarding, then the notebook", text = "The group set the order for Milestone 2: the project site with all fourteen models and twelve techniques deployed first, then the one-command FAS OnDemand setup that clones the repository, installs its dependencies and sets up and opens the notebook, then the notebook. Read back, A.246 put models 13 and 14 and techniques 11 and 12 with their labs in the repository, and project.json holds models 1 to 14 and techniques 1 to 12, but site:deploy uploads site/ with railway up and no record names the commit the live site was built from; site:status showed the service online without a commit, and the live page, whose title is A.245's, renders its models client-side. Open OnDemand onboarding in 2026 is clone, uv sync from the lock, ipykernel install --user, then open the notebook in that kernel, which A.224 already specifies. So A.254 deploys and records develop's site, A.224 follows it, and A.225 follows A.224 again. Railway marks railway.json deprecated, working until 2026-12-01, after the milestone; A.98 retires it.", maps_to = ["A.254"] },
  { source = "SESSION", ref = "2026-11-09 site:deploy created a new Railway project from an unlinked worktree", text = "site:deploy ran railway up --detach -y --name from a freshly cut worktree, and Railway created project c1bcf3ac with a new service instead of deploying to project 58907094, service 2c8c5ceb, which serves cs1090a.fustaomni.com; the recorder, also reading the directory's link, recorded that stray deployment's SUCCESS and the proof passed. Past sessions record the same failure, a Railway link tied to the working directory breaking in every new worktree, and the CLI's help says --new is implied for -y when nothing is linked. This repository never recorded the site's Railway identity: it lived only in the original checkout's link. Railway's own guidance is to pass explicit --project, --environment and --service rather than link, and its CLI deletes a project matched by id or name, while both projects share one name. So the identity is declared as a requirement, site:deploy and the recorder pass its ids, the record is refused for any other project or service, and the stray project is deleted by id, never the declared one.", maps_to = ["A.254"] },
  { source = "SESSION", ref = "2026-11-09 the project site reviewed page by page before onboarding", text = "The group asked for every page of the project site to be reviewed for accuracy, one page at a time, and for every phase to name its models and techniques the same way, Model 1 to Model 14 and Technique 1 to Technique 12. Reading the site's data against the page captures and the Milestone 2 brief found Milestone 1 still marked current, Milestone 2 described as a 10-minute presentation and given the EDA and feature phases the brief places in Milestone 3, references written as model 14, model 13, Model 13 and bare names, Models 1 to 9, 11 and 12 named without numbers, Model 10 AdaBoost absent from Phase 9, Techniques 2 and 4 absent from Phase 3, the split's T_test and T_val run together, and a baseline note naming the twelfth model. Current practice keeps names consistent through one canonical source and an automated check, which this site already does for its counts. Each page becomes its own step ending in a recorded deployment; npm 12.2.2 follows the reviewed site, and the onboarding command follows both.", maps_to = ["A.256", "A.257", "A.258", "A.259", "A.260", "A.261", "A.255"] },
  { source = "SESSION", ref = "2026-11-09 site review: the Model 1 lab", text = "Reviewed against its own numbers and grounded on the omitted-variable-bias formula: the least-squares slope and intercept, SSE and RMSE (the square roots of SSE over 300) and the omitted-variable value 0.5 + 0.5 x 0.5 = 0.750 are correct. One claim is not: the page says rounding to five levels flattens the slope a little, so the fit sits near the value before rounding. Mean-zero error in the outcome leaves least squares unbiased; the generator, ratings.js line 10, rounds and clamps to 1 to 5, and the clamp, which pulls in the extremes, is what flattens the slope, here 0.627 against 0.750, a 16 percent shortfall that is neither a little nor near. M1.jsx lines 203 to 205 are corrected to name the bounded scale and state the computed shortfall. The selector's M1 and T1 abbreviations are settled with the Phases rule.", maps_to = ["A.260"] },
  { source = "SESSION", ref = "2026-11-09 site review: the Model 2 lab", text = "Reviewed against its own numbers and grounded on the normal equations: solving the shown X'X and X'y gives w = (0.472, 0.423) exactly, b0 equals the mean rating with centred predictors, the residuals sum to zero for any slopes and are orthogonal to each predictor only at the least-squares fit, the SSE and RMSE agree, and VIF 1.70 follows from the sample correlation 0.642. One omission: the page states true slopes of 0.5 and 0.5 beside a fit of 0.472 and 0.423 without saying why it falls short; the same clamp to the 1 to 5 scale explains it, and one line saying so is added, consistent with the Model 1 correction.", maps_to = ["A.260"] },
  { source = "SESSION", ref = "2026-11-09 site review: the Model 3 lab", text = "Reviewed against its own numbers and grounded on centring practice: the count squared and interaction coefficients are identical in both columns, as the highest-order terms are invariant to centring; expanding the centred model reproduces the raw column, with a mean count of about 1.16 hundred ratings, a standardised user mean and a raw intercept of 3.115 against 3.120 shown; the predictions do not move; and the centred VIFs fall toward 1. One phrase is imprecise: a high VIF that centring removes is said to be created by the scaling, but centring changes the origin, not the scale, and what it removes is structural collinearity made by building squared and product terms from uncentred predictors. The sentence is reworded to say so.", maps_to = ["A.260"] },
  { source = "SESSION", ref = "2026-11-09 site review: the Model 4 lab", text = "Reviewed against its own numbers and grounded on ridge shrinkage along principal directions: shrinkage factors 0.950 and 0.471 follow from a sample correlation of 0.911 at lambda 0.1, rotating the least-squares fit into those directions, shrinking and rotating back reproduces b = (0.360, 0.445) exactly, the effective degrees of freedom 1.42 are their sum, and the 1-SE rule is stated as glmnet defines it. One finding: the text calls the ridge path the dark line, but M4.jsx line 107 draws it in colors.ink, the theme's text colour, which is light in the dark theme; the capture shows it white. M4.jsx line 220 is reworded to name the path by what it is, not by a colour that depends on the theme.", maps_to = ["A.260"] },
  { source = "SESSION", ref = "2026-11-09 site review: the Model 5 lab", text = "Reviewed against its own numbers and grounded on the lasso's KKT conditions and soft-thresholding: both kept coefficients have |x'r|/n exactly equal to lambda 0.2072 and the zeroed noise coefficient 0.0526 below it, lambda max is the smallest penalty that zeroes every coefficient, the 1-SE choice is defined as for ridge, and stability selection over 100 half-samples with a 60 percent threshold follows Meinshausen and Buhlmann. Accurate; no change.", maps_to = ["A.260"] },
  { source = "SESSION", ref = "2026-11-09 site review: the Model 6 lab", text = "Reviewed against its own numbers and grounded on distance concentration and kd-tree behaviour: the prediction 3.40 is the mean of the ten neighbours shown, the Euclidean ball and Manhattan octahedron are the right shapes, 0.1 to the power 1/3 is 0.464, the relative contrast is (max - min) / min as Beyer defines it, and small k against large k is the usual trade-off. One finding: the heading reads k-nearest-neighbour regression where the data names model 6 kNN regression; captures show the same drift for Model 9, Random forest against Random Forest, Model 10, with an added (AdaBoost.R2), and Technique 5, Technique with no number and Time-aware cross-validation against Cross-validation. Lab headings are bound to the data so each reads Model N or Technique N with the data's name.", maps_to = ["A.260"] },
  { source = "SESSION", ref = "2026-11-09 site review: Phase 7's tree-index dimension", text = "Phase 7 says tree indexes degrade beyond about twenty dimensions. Grounding while reviewing the Model 6 lab places kd-tree effectiveness at about ten dimensions or fewer, so the Phases page's figure becomes about ten.", maps_to = ["A.258"] },
  { source = "SESSION", ref = "2026-11-09 site review: the Model 7 lab", text = "Reviewed against its own numbers and grounded on cost-complexity pruning and split-selection bias: a leaf mean cannot leave the rating scale, 3 splits make 4 leaves, weakest-link pruning starts from the full tree at alpha 0, the 1-SE rule picks the smallest tree within one standard error, and the single split point of a binary dummy against the hundreds of a continuous mean is Strobl's account of why trees favour continuous features. The shown alpha of 2.718 looked like the constant e, so the code was read: tree.js line 143 records each breakpoint as the weakest link's g, M7.jsx line 315 prints the chosen subtree's alpha, and the cross-validation grid uses the geometric mean of consecutive breakpoints, as CART does. The value is computed, close to e by chance. Accurate; no change.", maps_to = ["A.260"] },
  { source = "SESSION", ref = "2026-11-09 site review: the Model 8 lab", text = "Reviewed against its own numbers and grounded on the variance of an average of correlated trees: 0.15 x 0.475 = 0.071 is the floor, the curve follows rho sigma squared plus (1 - rho) sigma squared over B, one bootstrap leaving out 38.0 percent sits beside the 36.8 percent limit, averaging lowers variance but not bias, and out-of-bag error is a random-split estimate that ignores time, which is why the later window is the honest comparison. Accurate. One label reads RMSE with 1 trees; it takes the singular when B is 1.", maps_to = ["A.260"] },
  { source = "SESSION", ref = "2026-11-09 site review: the Model 9 lab", text = "Reviewed against its own numbers and grounded on scikit-learn's documentation and the random-forest trade-off: max_features 1.0 is scikit-learn's regression default and equivalent to bagged trees, impurity importance gives the pure-noise column 10 percent on training data while permutation importance on later rows gives it none, and the split shares by depth show the roots diversifying, from 98 percent user history at depth 0 under bagging to 50 percent in this forest. One claim is overstated: the page says the variance floor rho sigma squared drops. At max_features 2 its own numbers give a floor of 0.076 against 0.071 for bagging on the same seeded data in the Model 8 lab, because the individual trees' variance rose from 0.475 to 0.543 while rho fell only from 0.15 to 0.14, and its own floor curve is non-monotone. Lowering max_features lowers rho and raises sigma squared, so the floor falls only when the first outweighs the second. The sentence is reworded to state that trade with the page's own numbers. The heading's name is fixed by the shared binding recorded with Model 6.", maps_to = ["A.260"] },
  { source = "SESSION", ref = "2026-11-09 site review: the Model 10 lab", text = "Reviewed against its own numbers and grounded on Drucker's AdaBoost.R2: rows are drawn in proportion to their weights, each loss is the error over the round's largest error D, beta = Lbar / (1 - Lbar) gives 0.303 / 0.697 = 0.435 and a tree weight ln(1 / beta) = 0.832, well-fit rows are multiplied by beta to the power 1 - L, boosting stops once Lbar reaches 0.5, and the ensemble predicts the weighted median. The account of one outlier enlarging D, shrinking every other row's loss and weight and leaving the outlier's share to grow is correct. Accurate. The label after 1 rounds takes the singular, as recorded for Model 8; the heading's added (AdaBoost.R2) moves into the text when the heading is bound to the data, as recorded with Model 6.", maps_to = ["A.260"] },
  { source = "SESSION", ref = "2026-11-09 site review: the Model 11 lab", text = "Reviewed against its own numbers and grounded on gradient boosting with squared error: the first prediction is the training mean, each tree fits the negative gradient, which for squared error is the residual, and the worked row recomputes at every stage, every residual as 4 minus F and every update as F plus 0.1 times h, stage 20 included. Early stopping keeps stage 9 after 15 rounds without improvement, stopping at 24, and the test window is scored once. Accurate; no change.", maps_to = ["A.260"] },
  { source = "SESSION", ref = "2026-11-09 site review: the Model 12 lab", text = "Reviewed against its own numbers and grounded on Breiman's non-negative stacking and the Krogh-Vedelsby ambiguity decomposition: the constraint does not bind because the constrained and unconstrained weights agree, the 0.009 gain with an interval spanning zero is reported honestly, and the average uses the stack's weights normalised to (0.69, 0.31), the convex combination the identity needs. One finding: stacking.js computes the decomposition as mean squared error on the 300 meta-training ratings (M12.jsx lines 54 to 58), while the RMSEs beside it are on the last block; neither the unit nor the rows are named. The decomposition is labelled as mean squared error on the meta-training ratings.", maps_to = ["A.260"] },
  { source = "SESSION", ref = "2026-11-09 site review: the Model 13 lab", text = "Reviewed against its own numbers and grounded on the random-intercept shrinkage factor n / (n + sigma^2 / tau^2): 4 / 6 = 0.667 and 6 / 8 = 0.75 are right, and movie 8's 0.06 x 0.75 = 0.04 holds, but user 4's raw offset -0.21 x 0.667 is -0.14, not the -0.04 shown. M13.jsx line 29 takes the raw offset from a separate no-pooling crossed fit, while crossed.js shrinks each offset's residual after removing the other factor's pooled offsets, which differ between the two fits in a crossed design. The sentence is corrected to show the residual mean the factor actually multiplies, with the no-pooling offset as a separate reference. A single sigma^2 / tau^2 for users and movies is a stated simplification.", maps_to = ["A.260"] },
  { source = "SESSION", ref = "2026-11-09 site review: the Model 14 lab", text = "Reviewed against its own numbers and grounded on cumulative link models and the proportional-odds assumption: four ordered cut-points for five stars, learned rather than equally spaced, with gaps 1.36, 1.83 and 1.64 that recompute. One claim is misattributed: the page says that if a small shift of all the cut-points flips many predictions, the ordinal assumptions are too fragile. Shifting every cut-point equally is a shift of the intercept, so the flip count measures how many latent scores sit near a star boundary, not whether the model's assumption holds; the proportional-odds assumption, one coefficient vector across cut-points, is tested by the Brant test or a likelihood-ratio test against a partial proportional-odds model. The audit is reframed as boundary proximity and the proper check is named.", maps_to = ["A.260"] },
  { source = "SESSION", ref = "2026-11-09 site review: Phase 12's check for Model 14", text = "Phase 12 refits the target with Model 14 as ordered categories. Reviewing the Model 14 lab found that the proportional-odds assumption it rests on is tested by the Brant test or a likelihood-ratio test against a partial proportional-odds model, so Phase 12 names that check alongside the refit.", maps_to = ["A.258"] },
  { source = "SESSION", ref = "2026-11-09 site review: the Technique 1 lab", text = "Reviewed against the MovieLens 1M README and its own numbers: 1,000,209 ratings, 6,040 users with at least 20 ratings each, 3,706 rated of 3,883 listed movies, movies.dat read as Latin-1, the 2000-04-25 to 2003-02-28 span, windows of 800,168, 100,021 and 100,020 that sum to the whole, 200 of 1,209 test users (16.5 percent) never seen in training, and Documentary at 0.76 percent of the training window all hold, as does the split of exploration into structure on all rows and rating values on the training window only. Three findings: the heading lacks its number, Technique 1, fixed by the shared heading binding; a risk-register cell is cut off mid-word, 200 of 1,209 test users never appe, so that column wraps instead of truncating; and the provenance line, T1.jsx line 346, says the files were verified against the MD5 GroupLens publishes, while data-pin.toml and data_fetch.py make the reviewed SHA-256 pin the trust root and the MD5 only a check against accidental corruption, so the line names the SHA-256 pin.", maps_to = ["A.260"] },
  { source = "SESSION", ref = "2026-11-09 data:fetch's own description names the MD5 as its check", text = "Reviewing the Technique 1 lab found that data:fetch's mise.toml description (line 486) and data_fetch.py's docstring (lines 1 and 3) still say the archive is verified against its published MD5, while A.235 made the reviewed SHA-256 pin in contracts/data-pin.toml the trust root and data_fetch.py itself treats the MD5 as guarding only against accidental corruption. The onboarding command runs data:fetch as a stage and must tell a teammate the true trust root, so both texts name the SHA-256 pin and describe the MD5 as corroboration.", maps_to = ["A.224"] },
  { source = "SESSION", ref = "2026-11-09 site review: the Technique 2 lab", text = "Reviewed against its own numbers and grounded on smoothed target encoding and ordered target statistics: S = (3 x 4.60 + 10 x 3.591) / 13 = 3.823, the naive bar 3.908 recomputes with the row's own rating included, prior-only means are the time-ordered form of out-of-fold encoding, the 0.444 gap between in-sample and later correlation is the leak, and ratings missing not at random are stated as a declared limitation. Three findings: T2.jsx line 221 prints a shift of 0.001, validation mean minus training mean, which measures drift between windows, yet concludes that the fallback's leak is small; the leak from fitting mu on all rows instead of the training window is 3.582 - 3.591 = -0.009, so the sentence states both numbers for what each measures. The heading lacks its number, Technique 2, fixed by the shared heading binding. The chart's legend entries overlap and are rewritten so they do not collide.", maps_to = ["A.260"] },
  { source = "SESSION", ref = "2026-11-09 site review: the Technique 3 lab", text = "Reviewed against its own numbers and grounded on Baccianella, Esuli and Sebastiani's macro-averaged measures: a constant 3 gives MAE^M 1.20 and RMSE^M the square root of 2, the per-level errors at 3.59 are its distances to 1 to 5, MAE^M 1.318 and RMSE^M 1.532 recompute, the share-weighted pooled MAE 0.937 and RMSE 1.122 match the page to rounding, and the shares agree with Technique 1's risk register. The distinction between choosing a metric and reweighting training by 1 / n_k is stated correctly. Accurate; the heading is covered by the technique-heading finding.", maps_to = ["A.260"] },
  { source = "SESSION", ref = "2026-11-09 site review: the technique lab headings", text = "Reading every technique capture's heading found Techniques 1 to 10 written as Technique with no number, and five with a name other than the data's: Principal component analysis for PCA, Time-aware cross-validation for Cross-validation, The bias-variance trade-off for Bias-variance, Out-of-bag error and the optimism gap for Out-of-bag error, and Hypothesis tests and intervals for Hypothesis tests and prediction intervals. Only Techniques 11 and 12 follow the Technique N and data-name form. As with the model headings, each lab types its own heading, so the shared binding renders every lab heading as Model N or Technique N with the data's name, and a longer descriptive phrase moves into the lab's opening sentence.", maps_to = ["A.260"] },
  { source = "SESSION", ref = "2026-11-09 site review: the Technique 4 lab", text = "Reviewed against its own numbers and grounded on Jolliffe's note on principal components in regression: PCA never looks at the ratings, a planted low-variance signal is recovered only among the last components, unstandardised rating counts take over the first component, 93.7 percent at three components is consistent with 80, 90 and 95 percent needing 2, 3 and 4, keeping every component preserves distances because PCA is a rotation, the shown loadings have unit length, and the scaler and PCA are fitted inside each fold. Accurate; the heading is covered by the technique-heading finding.", maps_to = ["A.260"] },
  { source = "SESSION", ref = "2026-11-09 site review: the Technique 5 lab", text = "Reviewed against its own numbers and grounded on time-ordered cross-validation practice: folds subdivide only the training window, blocks of equal row count are cut at timestamp boundaries, fold k trains on earlier blocks and validates on the next, with an optional gap and sliding window, five blocks give four folds of about 400 rows, the optimism of random folds is 0.904 - 0.808 = 0.096, and the caveat that time folds are neither independent nor equal in size, so the one-standard-error rule is approximate, is stated. Accurate; the heading is covered by the technique-heading finding.", maps_to = ["A.260"] },
  { source = "SESSION", ref = "2026-11-09 site review: the Technique 6 lab", text = "Reviewed against its own numbers and grounded on calibration-slope practice and the bias-variance decomposition: training error falls with tree splits while held-out error falls then rises, a constant 3.52 gives mean residuals 2.52 and -1.48 at 1 and 5 stars, error by true rating slants for any predictor with noise, which is why Phase 12 calibrates by predicted value, a calibration slope below 1 marks overfitting and above 1 over-shrinkage, and the bias, variance and noise split is drawn only on seeded data, where the true function is known. Accurate; the heading is covered by the technique-heading finding.", maps_to = ["A.260"] },
  { source = "SESSION", ref = "2026-11-09 site review: the Technique 7 lab", text = "Reviewed against its own numbers and grounded on out-of-bag estimation: each row is graded by the roughly one third of trees that never saw it, the estimate converges to leave-one-out cross-validation so agreement with random folds proves nothing about time, the identity temporal - OOB = (temporal - within) + (within - OOB) gives 0.004 - 0.078 = -0.074, the seed spread is stated as model randomness only, the upward bias with few trees matches Breiman, and the negative total gap is explained by an easier later period, which is why the gap is decomposed. Accurate; the heading is covered by the technique-heading finding.", maps_to = ["A.260"] },
  { source = "SESSION", ref = "2026-11-09 site review: the Technique 8 lab", text = "Reviewed against its own numbers and grounded on Hooker and Mentch's critique of permute-and-predict and Strobl's conditional permutation: shuffling later rows measures importance, a plain shuffle of correlated features extrapolates (18 percent of points outside the training data against 3 percent conditionally), refitting without a feature asks what is lost if it is gone, user history's 62 percent and movie history's 34 percent of the summed positive rises recompute, 35 percent lies outside the user interval and 30 percent inside the movie interval, and the caveats on measure, model randomness and synthetic data are stated. Accurate. In the capture the table's last column header is cut to Drop-co; when A.260's layout fixes are made the table is confirmed to sit in its own horizontal-scroll container, with Technique 1's truncated cell.", maps_to = ["A.260"] },
  { source = "SESSION", ref = "2026-11-09 site review: the Technique 9 lab", text = "Reviewed against its own numbers and grounded on Owen's pigeonhole bootstrap and McCullagh's result that no bootstrap is exact for crossed data: resampling ratings is too narrow, resampling users covers user dependence, resampling users and movies independently covers both and is mildly conservative, the widths 0.038, 0.058 and 0.079 and their ratios 1.5 and 2.1 recompute from the endpoints, the paired RMSE difference is recomputed without refitting, percentile endpoints need B in the thousands, and a confidence interval for the mean rating is distinguished from the spread of one new rating. Accurate; the heading is covered by the technique-heading finding.", maps_to = ["A.260"] },
  { source = "SESSION", ref = "2026-11-09 site review: the Technique 10 lab", text = "Reviewed against its own numbers and grounded on Schenker and Gentleman's result that judging differences by overlapping intervals is conservative, worse for paired data: the paired interval narrows as shared error grows, the 0.065 difference with 95 percent interval 0.032 to 0.099 excludes zero and clears the 0.020 smallest meaningful difference, 19 of 60 users favouring the baseline is reported, and one pre-specified comparison stands while the rest are exploratory or Holm-corrected. One finding: the data names Technique 10 Hypothesis tests and prediction intervals, but the lab builds only confidence intervals for a difference in RMSE and no prediction interval, and its heading shortens the name to Hypothesis tests and intervals. Technique 11 audits prediction intervals this lab never constructs. The lab gains the split-conformal construction, calibration residuals to a quantile to an interval around one prediction, which Technique 11 then audits.", maps_to = ["A.260"] },
  { source = "SESSION", ref = "2026-11-09 site review: the Technique 11 lab", text = "Reviewed against its capture and grounded on Lei, G'Sell, Rinaldo, Tibshirani and Wasserman and on conformal prediction beyond exchangeability: split-conformal coverage is marginal over all ratings, not per group, so one width can over-cover steady raters and under-cover noisy ones, and coverage, width and interval score are the right scores. Two findings: the page says the stated share falls inside in the long run without naming the assumption that calibration and test ratings are exchangeable, which the project's time-ordered split breaks, so the text states the assumption and that coverage is what the audit checks rather than what the method promises; and drawn intervals extend past the 1 to 5 scale, so they are intersected with it, which loses no coverage and narrows width and interval score. The capture shows only the state before the audit runs, so the audit's coverage, width, interval score and group coverage are checked against the lab's code when A.260 is implemented.", maps_to = ["A.260"] },
  { source = "SESSION", ref = "2026-11-09 site review: the Technique 12 lab", text = "Reviewed against its own numbers and grounded on cluster sign-flip randomization tests: flipping whole user blocks under sign symmetry gives 2^5 = 32 patterns, the exact two-sided p of 4 / 32 = 0.125 and the smallest attainable p of 2 / 32 = 0.0625 are right, flipping single ratings overstates certainty, and the near-zero skewness checks the symmetry the test needs. Two findings: the null-distribution chart joins the 32 pattern means with a line in arbitrary pattern order, which carries no meaning, so the means are drawn sorted or as a histogram with the observed value marked; and the block states read original (-Z) with no explanation, so the label says original or flipped.", maps_to = ["A.260"] },
  { source = "SESSION", ref = "2026-11-09 site review: the Results page", text = "Reviewed against project.json, results.json and App.jsx: Protocol A at the 0.9 quantile, the paired user-clustered primary comparison, the descriptive 95 percent intervals and the evidence-only milestone sections are right, and the milestone titles come from project.json's milestones, so A.256's milestone correction reaches this page through the same source. Four findings. The primary comparison's three verdicts, written in Phase 4, state no smallest meaningful difference, while Technique 10 judges against 0.020, so the pre-registration states its margin and the verdict uses it. The board's rows come from a separate list in results.json, not from project.json's models, so Models 13 and 14 are absent and no row reads Model N; the rows are rendered from project.json's models and baselines as Model N and name. App.jsx lines 222 and 223 type RMSEM and MAEM flat, as do Phases 0 and 12, while Technique 3 writes MAE^M, so one notation with a true superscript is used everywhere. App.jsx line 236 prints a date typed into results.json although no result is recorded, so the date comes from the recorded run or is not shown until one exists.", maps_to = ["A.261"] },
  { source = "SESSION", ref = "2026-11-09 site review: macro-metric notation on the Phases page", text = "Reviewing the Results page found Phases 0 and 12 writing the macro-averaged metrics as MAEM and RMSEM, flat, while the Results header types the same and Technique 3 writes MAE^M. The Phases page uses the single superscript notation the Results and lab pages adopt.", maps_to = ["A.258"] },
  { source = "SESSION", ref = "2026-11-09 site:record names HEAD, and its --out was taken for the record", text = "Recording A.256's deployment found two hazards. site:record takes the commit from HEAD at record time, so a commit made between site:deploy and site:record is named although it was not built; the deploy should capture the commit it built. And --out names the source-apply spec the recorder writes, yet nothing refuses an --out equal to the record's own path: the spec was written over contracts/site-deployment.json and committed, and the pr gate's deployed proof caught it before anything was pushed. Both are fixed before the next deployment, which is A.258's.", maps_to = ["A.258"] },
  { source = "SESSION", ref = "2026-11-09 the full gate took 70 minutes after a site build", text = "In the feature/site-phases worktree, after site:build installed site/node_modules, a full test:green took 4,211 seconds against 590 earlier in the same worktree and 326 to 375 elsewhere; an interrupted run stood at the eleventh test, in the acceptance lane. Reading tests/acceptance/acceptance_sandbox.py showed every sandbox made with shutil.copytree and a hand-kept EXCLUDED list that names neither node_modules nor dist, while mutation_check.py and safeguards.py already copy from git ls-files --cached --others --exclude-standard, the 2026 practice of letting .gitignore decide what a copy carries. The sandbox reuses safeguards.copy_committable. The file is ported from cscie103-data-engineering, whose copy has the same defect and is fixed there in turn.", maps_to = ["A.262"] },
  { source = "SESSION", ref = "2026-11-09 a gate's time is measured on every run", text = "A full gate took 70 minutes after a site build, then 327 and 314 seconds once the acceptance sandbox stopped copying ignored output, while consecutive runs of one sandbox test took 369 and 26 seconds: the cost is not yet attributed. Current practice puts --durations in pytest's addopts so local and CI runs share one default, reports the slowest 20 rather than every phase, and hides trivial ones with --durations-min; pytest times setup, call and teardown separately, so a slow fixture shows as its own entry.", maps_to = ["A.263"] },
  { source = "SESSION", ref = "2026-11-09 worktree:remove reported success for a name that was not a slug", text = "worktree:remove given feature/site-overview built the path cs1090a-recsys-feature/site-overview and the branch feature/feature/site-overview, found neither, and reported both already removed with exit 0 while the real worktree remained. remove and refresh never check their slug; add checks it with isalnum, which admits uppercase despite its message saying lowercase kebab-case. Git refuses an unregistered path as not a working tree, and worktree managers fail removal of a name they do not know, while treating an already-cleaned worktree as success, which D.105 decided here. The fix refuses a malformed name with the grounded pattern ^[a-z0-9]+(?:-[a-z0-9]+)*$ before anything is looked up, and keeps D.105's success for a well-formed absent slug. worktree.py is ported from cscie103-data-engineering, whose copy has the same gap.", maps_to = ["A.264"] },
  { source = "SESSION", ref = "2026-11-09 a conflicted refresh could not be concluded", text = "Refreshing feature/remove-unknown stopped on plan conflicts; plan:resolve resolved and staged them, and worktree:conclude then failed at commit-msg: the merge commit, Merge remote-tracking branch origin/develop, named no Plan-Step. conclude commits with git commit --no-edit, which uses MERGE_MSG; refresh started the merge with --no-commit and no message, using its Plan-Step message only on the clean path. git merge -m sets the merge commit's message, and a failed merge keeps it in MERGE_MSG. The merge was aborted and is redone once refresh passes -m.", maps_to = ["A.266"] },
  { source = "SESSION", ref = "2026-11-09 PR #87's quality gate never ran a job", text = "PR #87 waited 20 minutes on a quality gate GitHub never registered; pr:logs then read run 42673416178 on the PR's head as failed with no step and no job. Early November 2026 reports describe the same GitHub-side scheduling faults: runs queued with zero jobs and pull request events that start no run. The grounded recovery for a terminal run with an infrastructure failure is one retry of that run, read back afterwards, never a new full dispatch or a commit pushed to provoke one. The repository had no governed way to do this, so the only route was a raw gh run rerun outside the ledger.", maps_to = ["A.265"] },
  { source = "SESSION", ref = "2026-11-09 type errors reached the pr gate twice", text = "Two pull requests were refused at pr's snapshot gate by mypy, each for a test that reached a stdlib module through the module under test; the same defect hit otsafety-gnn on 2026-09-22. recsys runs mypy only at pre-push and in pr by design, mirrored from cscie103, and a full two-platform run takes four to six minutes here. 2026 practice moves mypy to pre-commit on the staged files with an incremental cache, near-instant per commit, and keeps the full run at push and in CI.", maps_to = ["A.267"] },
  { source = "SESSION", ref = "2026-11-09 Railway warned that Config as Code stops working on 2026-12-01", text = "A.258's site:deploy printed: Config as Code (railway.json / railway.toml) is deprecated; existing files keep working until 2026-12-01. Railway's docs make .railway/railway.ts the replacement, applied with the CLI rather than read at deploy time, and a service cannot be managed by both. 2026 migrations pull the file from the live project, check config plan for no drift, cut over with config migrate cutover (reversible), and only then remove railway.json, confirming a deploy afterwards; several report that migrate --apply guessed wrong service names and dropped variables. The ledger shows recsys already ran site:config-migrate, site:config-pull and site:config-plan, so the step begins by reading that state.", maps_to = ["A.268"] },
  { source = "SESSION", ref = "2026-11-09 Milestone 2 is planned before it is built", text = "Milestone 2 is due Friday 2026-11-13 at 9:59 pm ET: an eight to ten minute presentation to the project TF, the slides as a PDF, the notebook that gets, loads and cleans the data, and a revised proposal of one to two pages. 2026 practice for a submitted notebook: run top to bottom from a clean kernel, checked by automation (nbconvert --execute or nbval), seeds set, dependencies pinned, raw data immutable, logic in modules the notebook imports, a linear numbered structure. For milestone talks: about ten slides at roughly a minute each, problem, approach, progress, findings, next steps, charts over text and no code. A revised proposal restates the question in the team's words and refines it into objectives the data can address.", maps_to = ["A.269", "A.270", "A.271"] },
  { source = "SESSION", ref = "2026-11-09 PR #90's integration gate failed on a 429 from raw.githubusercontent.com", text = "PR #90's quality gate failed in test (integration): tests/integration/test_sibling_toolchain.py::test_every_pin_is_the_version_nixpkgs_ships stopped at sibling_pins.fetch with curl (22), error 429, fetching nixpkgs' databricks-cli package.nix. fetch calls curl once, unauthenticated, with no retry, so one throttled response fails the gate; the change under review, A.267, was not involved. GitHub's guidance is to honour retry-after on a 429 and otherwise back off; curl's --retry treats 408, 429, 500, 502, 503 and 504 as transient, retries with exponential backoff, complies with Retry-After since 7.66, and --retry-max-time bounds the total.", maps_to = ["A.272"] },
  { source = "SESSION", ref = "2026-11-09 site:status refused in a fresh worktree", text = "In the new site-railway-iac worktree, site:status ran npx --no-install railway and npm refused: npx canceled due to missing packages, railway@3.16.0. site/node_modules was never installed there; only site:build runs npm ci, and five tasks (railway-login, status, domain, config-pull, config-plan) assume it ran. The railway binary belongs to @railway/cli 5.70.0, while the package named railway is Railway's IaC SDK, whose binary is railway-iac-ts, so npx resolved the wrong package. 2026 practice: npx and npm exec fall back to the public registry on a missing node_modules and run whatever claims the name; wiring bins through package.json scripts makes a missing install fail loudly with no registry traffic.", maps_to = ["A.273"] },
  { source = "SESSION", ref = "2026-11-10 site:status found no linked project in a fresh worktree", text = "Once the CLI ran from the locked install, site:status in the new worktree reported No linked project found: Railway stores the link per directory, so every worktree's site/ starts unlinked. A.254 made deploy and the recorder name explicit ids for this reason, but status, config pull and config plan still read the link, and Railway's own agent guidance says config commands expose no project or environment selectors and should be preceded by railway link --project --environment. The fix links each checkout to the declared ids non-interactively, through the same CLI and target as deploy.", maps_to = ["A.273"] },
  { source = "SESSION", ref = "2026-11-10 the staged type check refused a correct test staged alone", text = "Committing A.273's test file alone, the types (staged) hook ran mypy on tests/test_site_railway_cli.py only and reported import-not-found for site_deployed and nonvacuous, both in scripts/. The full types gate passes because files = scripts and tests hands mypy every script; pytest resolves them by pythonpath = scripts, and mypy had no matching mypy_path. A.267's own commit passed only because each test's script was staged with it. 2026 practice pairs the settings: pythonpath for pytest and mypy_path for mypy, so both resolve the same modules.", maps_to = ["A.274"] },
  { source = "SESSION", ref = "2026-11-10 two identical staged checks took 83 s then 117 s", text = "After A.274 a single staged test took 117 s in the full suite and every commit hook about two minutes. Run twice in a row on the same file, types:staged took 83 s and then 117 s, so the incremental cache was never reused. Neither pyproject.toml, mise.toml nor types_staged.py sets a cache directory, so the darwin and linux runs share .mypy_cache. mypy's OPTIONS_AFFECTING_CACHE includes platform, and a mismatch abandons the cached metadata (options differ), so each platform's run discards the other's. 2026 practice for option variants is a separate --cache-dir per variant, which restores fast incremental runs.", maps_to = ["A.275"] },
  { source = "SESSION", ref = "2026-11-10 site:test refused in a fresh worktree", text = "In the new site-deploys worktree, site:test ran npx --no-install vitest run and npm refused: npx canceled due to missing packages, vitest@5.1.0. A.273 moved the Railway tasks to an npm script after site:install but set site:test aside because vitest names both its package and its binary, so npx could not run the wrong package; it still cannot run at all where site/node_modules was never installed. Vitest's own guide wires it as a package.json test script run with npm run test, and vitest run runs once without watching.", maps_to = ["A.276"] },
  { source = "SESSION", ref = "2026-11-10 centralization:inventory refused four unclassified capabilities", text = "Run on develop, centralization:inventory resolved cscie103's develop to 61b5dc5 and refused four capabilities with no classification: script:scripts/rebase_state.py, script:scripts/site_deployed.py, script:scripts/types_staged.py and task:types:staged. The inventory resolves the upstream tip over the network, so no offline gate runs it, and A.267's and A.273's additions passed every gate unclassified. The register's classes are generic, centralized into cscie103, and project, this repository's own.", maps_to = ["A.277"] },
  { source = "SESSION", ref = "2026-11-10 the test gate killed a passing suite at 900 s on a slower node", text = "On node cr-2 the full hermetic suite passed in 1108 s, with every acceptance setup about 4.5 times slower than on cr-6 that morning, where it took 397 to 490 s. check:offline and pr's snapshot gate then killed it at the test gate's 900 s deadline, a number check_all.py records no basis for, blocking every publish. 2026 practice declares a deadline in its measured form, p95 or slowest passing run times a multiplier with the date, three times being a runaway backstop that still catches a hang, and checks that the declared number equals the arithmetic, so a stale budget fails a check rather than a passing run.", maps_to = ["A.278"] },
  { source = "SESSION", ref = "2026-11-12 worktree:refresh called without its required step", text = "worktree:refresh refused 'refresh <slug> <step> (got [refresh, site-mechanisms])': the step its merge commit names (A.266) is required by worktree.py, but the task declares raw_args = true and no usage spec, so the argument was invisible to mise tasks info, --help and mise.toml. Past sessions settled reading a task's interface from its script before calling it; develop's history shows five refresh merges each naming its branch's step; twelve tasks declare raw_args and every script states its interface only in its own usage line. mise's 2026 documentation gives a raw_args task a usage spec: arguments still pass unchanged, while tasks info and --help show the spec. The root fix declares every raw_args task's arguments there and proves them against the script, as the first slice of A.178.", maps_to = ["A.320"] },
  { source = "SESSION", ref = "2026-11-10 cscie103 D.453 settles this sibling's capabilities, so the register records each disposition", text = "cscie103 merged D.453 as PR #323, its develop at 494764cde04e17017534a2f1a851ab700544b0f3: its ledger for cs1090a-recsys names every capability this repository has and the hub lacks as ported to a hub step or declined by a hub decision, and its survey reports none unaccounted. The hub declined start:switch (X.9), the site, data and model capabilities (X.10), the rebase tools (X.12) and types:staged (X.13), so this register's generic class for start:switch and types:staged contradicts the hub. 2026 practice for a carried fork keeps one table cross-referencing each carried change to its upstream disposition, updated in the same change, with declined dispositions traced to their rationale and every claim tied to an exact upstream commit.", maps_to = ["A.206"] },
  { source = "SESSION", ref = "2026-11-12 the history gate fails with one unnamed leak on every branch", text = "check:offline on feature/task-usage passed 14 of 15 gates and failed secrets (history): betterleaks reported leaks found: 1 and nothing else, because the gate runs it with --redact and no report. The same finding blocked A.260's landing and now A.320's. cscie103 planned the reader as D.456, renumbered D.465 after develop issued D.456 first, and merged it as PR #335: secrets:report writes betterleaks' redacted JSON report and judges each finding by fingerprint on the spine. The 2026 practice is to name and classify a historical finding, rotating a real credential or recording a reviewed fingerprint with its expiry, approver and reason, never to disable the gate.", maps_to = ["A.321"] },
  { source = "SESSION", ref = "2026-11-12 secrets:report names the history gate's finding", text = "secrets:report refused with one finding: generic-api-key at scripts/tools_verify.py:35, commit 549173b4, fingerprint 549173b4b34794a54e165098ff0e69c19b7d2707:scripts/tools_verify.py:generic-api-key:35. Line 35 is KEYS_COMMIT, the public commit SHA of nodejs/release-keys that tools:verify (A.279) pins. The commit is the tip of feature/tools-verify, which was never pushed, so the gate failed every branch because betterleaks git reads every local ref while CI, which never fetched that branch, passed. The 2026 practice suppresses a reviewed false positive by its exact fingerprint with a durable reason, and gates each branch on its own history with the full history as a baseline.", maps_to = ["A.322", "A.323"] },
  { source = "SESSION", ref = "2026-11-12 safeguards:prove finds DATA.MEMBER_UNSAFE inconclusive", text = "safeguards:prove killed every trial but DATA.MEMBER_UNSAFE, judged inconclusive: its proof ended with exit 3, INTERNALERROR, opa eval failed. The safeguard replaces the line some name in fetch.unsafe with false, removing the rule's only binding of name, so the module stops compiling and every opa eval over policies fails, including the session-wide policy check. check never runs safeguards:prove, so the defect sat on develop since A.235. The 2026 practice treats a mutant that does not compile as invalid, reported apart from results and never counted, and replaces it with a valid one.", maps_to = ["A.325"] },
  { source = "SESSION", ref = "2026-11-13 Milestone 2 scope: wrangling scripts and the notebook only", text = "The group set Milestone 2's code scope to the data wrangling scripts, pure functions with pytest proofs, and the Jupyter notebook, with the notebook thin and every piece of wrangling logic in a module it imports. A.225 asks the notebook for a ratings-quality contract, the brief's checks and a temporal split before any feature, and A.244's skeleton holds only a ratings count. 2026 recommender evaluation names a split at one absolute time point as the one that leaks no future rating into training, and asks a split to be checked for temporal overlap and leakage.", maps_to = ["A.326"] },
  { source = "SESSION", ref = "2026-11-13 Milestone 2 scope and the FAS closure", text = "The group prepares the revised proposal, the slides, the presentation and its meeting arrangements outside the repository, so A.226, A.227, A.238, A.253, A.270 and A.271 will not be done here; FAS OnDemand is being closed with development moved to the MacBook Pro, so A.224's onboarding will not be done; A.225 now carries A.269's clauses. recsys's plan_edit.py writes steps, amends steps or decisions, and retracts trace candidates, but no verb writes a decision, and its plan holds none, so each retirement waits on A.82's plan:decide rather than on an edited title.", maps_to = ["A.327"] },
  { source = "SESSION", ref = "2026-11-13 the integration gate killed a passing tier twice on cr-2", text = "FAS OnDemand is being closed, and every piece of work on it must reach develop first. feature/tools-verify's check timed out twice on FAS node cr-2 in test (integration), at the typed 1200 s, in tests/integration/test_generated_gate.py, so no FAS lane can publish. Measured alone on cr-2 on 2026-11-13, the integration tier passed, 6 tests in 1130.37 s. A.278 already computes the test gate's deadline from its slowest passing run times a runaway-backstop multiplier of 3; the integration gate kept a typed number. The 2026 retry rule names a failure that repeats on the same node as a real defect to investigate, never a retry.", maps_to = ["A.340"] },
  { source = "SESSION", ref = "2026-11-13 the Milestone 2 brief's cleaning checks, grounded in 2026 practice", text = "The Milestone 2 brief asks the notebook for the data's size in megabytes, each table's shape, types and summary statistics, and for missing data with its pattern, unusual values, class imbalance, the scale of each numerical feature and information leakage, each with a decision. 2026 data-quality practice counts missing values per column first and checks whether missingness follows a group, checks values against their documented domain for impossible ones, reports class balance and each feature's range before modeling, and splits chronologically before any feature is computed. A.326 holds the readers, the quality contract and the split; these checks join it so the notebook stays thin.", maps_to = ["A.328"] },
  { source = "SESSION", ref = "2026-11-13 the submitted notebook must carry its outputs on the real data", text = "The Milestone 2 brief asks for the notebook used to get, load and clean the data, and the committed notebook is kept free of outputs because its proofs run it on rows they write. data:fetch keeps no archive: it downloads into a temporary directory, unpacks the three tables and publishes them under the checkout's evidence root. 2026 notebook practice trusts an output only from a batch run in a fresh kernel, the way nbclient executes a notebook, so the executed copy for submission is produced that way from the verified folder.", maps_to = ["A.329"] },
  { source = "SESSION", ref = "2026-11-13 the executed notebook's review against the brief and 2026 practice", text = "The executed notebook reports three tables but not the usable joined table the brief asks for, nor its rows and columns after cleaning, which the revised proposal needs. 2026 recommender evaluation practice audits a split after it is made, for leakage and for cold-start exposure, so test ratings whose user or movie never appears in training are counted. Times shown as Unix seconds, an all-zero missing-data plot, wrapped raw dictionaries and code cut off in the PDF make the findings hard to read, and the header lacks the TF mentor. A data wrangling summary of check, finding and decision closes the cleaning section.", maps_to = ["A.330"] },
]
