# context/plan.toml
# This project's plan: intent only, never status (project-plan/v1). plan:status decides
# each step's state from its evidence; plan:add and plan:amend are its only writers.
contract = "project-plan/v1"

threads = [
  { id = "A", title = "Platform" },
]

[[steps]]
id = "A.1"
title = "The project is founded by porting cscie103's governance kernel"
thread = "A"
done_when = [
  { kind = "task", name = "plan:init" },
  { kind = "task", name = "keys:provision" },
]
[[steps]]
id = "A.2"
title = "A signing key's directory is owner-only: made 0700, and refused at use when others can write"
thread = "A"
done_when = [
  { kind = "proof", test = "tests/test_signing.py::test_provisioning_makes_the_key_directory_owner_only" },
  { kind = "proof", test = "tests/test_signing.py::test_a_key_whose_directory_others_can_write_never_signs" },
]
[[steps]]
id = "A.3"
title = "Every gate in the registry resolves in this repository; a withdrawn gate is named, never skipped"
thread = "A"
done_when = [
  { kind = "proof", test = "tests/test_gate_registry.py::test_every_gate_resolves_in_this_repository" },
  { kind = "proof", test = "tests/test_gate_registry.py::test_an_unresolvable_gate_is_named" },
]
[[steps]]
id = "A.4"
title = "A secret scanner pinned under the release cutoff restores the history scan as a gate"
thread = "A"
depends_on = ["A.3"]
because = { "A.3" = "the scan returns as a gate, and every gate must resolve here" }
done_when = [
  { kind = "proof", test = "tests/test_gate_registry.py::test_the_history_is_scanned_for_secrets" },
]
[[steps]]
id = "A.5"
title = "A commit's outcome names its branch, the repository's root commit included"
thread = "A"
done_when = [
  { kind = "proof", test = "tests/test_commit.py::test_the_root_commit_names_its_branch" },
]
[[steps]]
id = "A.6"
title = "Every adapted file is its upstream bytes plus its recorded patch, re-proven by a gate"
thread = "A"
done_when = [
  { kind = "proof", test = "tests/test_provenance.py::test_every_adapted_file_is_upstream_plus_its_patch" },
]
[[steps]]
id = "A.7"
title = "The founding policy's pins come from one source, so a pin cannot drift from its test"
thread = "A"
done_when = [
  { kind = "proof", test = "tests/test_founding_policy.py::test_the_policy_pins_are_the_lockfile_pins" },
]
[[steps]]
id = "A.8"
title = "mise's trust and state directories are owner-only, whatever the umask"
thread = "A"
done_when = [
  { kind = "proof", test = "tests/test_machine_state.py::test_mise_state_is_owner_only" },
]
[[steps]]
id = "A.9"
title = "Every pinned tool installs with verified provenance, or its absence is a recorded decision"
thread = "A"
done_when = [
  { kind = "proof", test = "tests/test_tool_provenance.py::test_every_locked_tool_names_its_provenance" },
]
[[steps]]
id = "A.10"
title = "No installed tool version is outside the pinned set"
thread = "A"
done_when = [
  { kind = "proof", test = "tests/test_tool_provenance.py::test_no_installed_version_is_unpinned" },
]
[[steps]]
id = "A.11"
title = "The policies pass Regal, and Regal runs as a gate"
thread = "A"
depends_on = ["A.9"]
because = { "A.9" = "regal must install with a decided provenance before it gates anything" }
done_when = [
  { kind = "proof", test = "tests/test_gate_registry.py::test_the_policies_are_linted" },
]
[[steps]]
id = "A.12"
title = "Committing nothing is refused by name, and git's reason is never lost"
thread = "A"
done_when = [
  { kind = "proof", test = "tests/test_commit_execution.py::test_nothing_staged_is_refused_before_git_commits" },
]
[[steps]]
id = "A.18"
title = "Every repository mutation is a source:apply spec, never a shell heredoc writing files"
thread = "A"
done_when = [
  { kind = "proof", test = "tests/test_source_apply.py::test_the_claim_names_the_repository_parsed_from_origin" },
  { kind = "task", name = "source:apply" },
]
[[steps]]
id = "A.19"
title = "A branch reaches develop only through the pr task: pushed with a lease, merged on GitHub's verdict"
thread = "A"
depends_on = ["A.18", "A.20"]
because = { "A.18" = "pr and its modules arrive through source:apply specs", "A.20" = "pr merges only on a check that reported; the quality gate is that check" }
done_when = [
  { kind = "proof", test = "tests/test_pr_push_failure.py::test_a_test_cannot_reach_the_real_publication" },
]
[[steps]]
id = "A.20"
title = "Every pull request runs the quality gate in CI, the one check pr waits for before it merges"
thread = "A"
depends_on = ["A.18", "A.22", "A.23"]
because = { "A.18" = "the workflow and its expected-checks contract arrive through source:apply specs", "A.22" = "the audit runs the pinned zizmor", "A.23" = "the workflow passes the audit before it runs" }
done_when = [
  { kind = "proof", test = "tests/test_workflow_audit.py::test_the_repositorys_workflows_pass_the_audit" },
]
[[steps]]
id = "A.21"
title = "A dependency enters only through deps:add, and the environment is exactly the lock through deps:install"
thread = "A"
depends_on = ["A.18"]
because = { "A.18" = "deps:add and deps:install arrive through source:apply specs" }
done_when = [
  { kind = "proof", test = "tests/test_deps_add.py::test_a_package_is_added_with_its_lock" },
]
[[steps]]
id = "A.22"
title = "zizmor 1.30.1 is pinned, its provenance verified and locked, through the founding gate"
thread = "A"
depends_on = ["A.21"]
because = { "A.21" = "the workflow audit's yaml dependency arrives through deps:add first" }
done_when = [
  { kind = "proof", test = "tests/test_tool_provenance.py::test_zizmor_is_pinned_and_its_provenance_verified" },
]
[[steps]]
id = "A.23"
title = "The workflow audit arrives: every workflow passes zizmor and the permission allow-list"
thread = "A"
depends_on = ["A.22"]
because = { "A.22" = "the audit runs the pinned zizmor" }
done_when = [
  { kind = "proof", test = "tests/test_workflow_audit.py::test_an_action_pinned_by_tag_is_refused" },
]
[[steps]]
id = "A.24"
title = "A file is removed only through a source:apply spec, judged like every other write"
thread = "A"
depends_on = ["A.18"]
because = { "A.18" = "removal is one more operation of the engine every mutation goes through" }
done_when = [
  { kind = "proof", test = "tests/test_source_apply.py::test_a_delete_removes_only_an_existing_file_inside_the_repository" },
]
[[steps]]
id = "A.25"
title = "worktree:add takes an optional base, so stacked work gets its own worktree"
thread = "A"
depends_on = ["A.18"]
because = { "A.18" = "worktree.py and its tests arrive through source:apply specs" }
done_when = [
  { kind = "proof", test = "tests/test_worktree_base.py::test_a_worktree_starts_from_a_named_local_branch" },
]
[[steps]]
id = "A.26"
title = "tools:lock and tools:install are tasks, recorded like every other operation"
thread = "A"
depends_on = ["A.25"]
because = { "A.25" = "the work is done in its own worktree, cut by the task" }
done_when = [
  { kind = "proof", test = "tests/test_task_coverage.py::test_every_toolchain_operation_is_a_task" },
]
[[steps]]
id = "A.27"
title = "The founding gate and the re-trust of a checkout are one machine-level task, shipped in the repository"
thread = "A"
depends_on = ["A.25"]
because = { "A.25" = "the work is done in its own worktree, cut by the task" }
done_when = [
  { kind = "proof", test = "tests/test_machine_tasks.py::test_the_trust_task_gates_before_it_trusts" },
]
[[steps]]
id = "A.28"
title = "Another repository is read at a pinned commit by recorded tasks"
thread = "A"
depends_on = ["A.25"]
because = { "A.25" = "the work is done in its own worktree, cut by the task" }
done_when = [
  { kind = "proof", test = "tests/test_repo_history.py::test_another_repository_is_read_at_a_pinned_commit" },
]
[[steps]]
id = "A.29"
title = "Spec building is a task: an upstream file or a formatted edit becomes a measured source:apply spec"
thread = "A"
depends_on = ["A.28"]
because = { "A.28" = "a spec built from upstream reads upstream through the recorded task" }
done_when = [
  { kind = "proof", test = "tests/test_source_port.py::test_an_upstream_file_becomes_a_create_spec" },
]
