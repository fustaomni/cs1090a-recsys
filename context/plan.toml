# context/plan.toml
# This project's plan: intent only, never status (project-plan/v1). plan:status decides
# each step's state from its evidence; plan:add and plan:amend are its only writers.
contract = "project-plan/v1"

threads = [
  { id = "A", title = "Platform" },
]

[[steps]]
id = "A.1"
title = "The project is founded by porting cscie103's governance kernel"
thread = "A"
done_when = [
  { kind = "task", name = "plan:init" },
  { kind = "task", name = "keys:provision" },
]
[[steps]]
id = "A.2"
title = "A signing key's directory is owner-only: made 0700, and refused at use when others can write"
thread = "A"
done_when = [
  { kind = "proof", test = "tests/test_signing.py::test_provisioning_makes_the_key_directory_owner_only" },
  { kind = "proof", test = "tests/test_signing.py::test_a_key_whose_directory_others_can_write_never_signs" },
]
[[steps]]
id = "A.3"
title = "Every gate in the registry resolves in this repository; a withdrawn gate is named, never skipped"
thread = "A"
done_when = [
  { kind = "proof", test = "tests/test_gate_registry.py::test_every_gate_resolves_in_this_repository" },
  { kind = "proof", test = "tests/test_gate_registry.py::test_an_unresolvable_gate_is_named" },
]
[[steps]]
id = "A.4"
title = "A secret scanner pinned under the release cutoff restores the history scan as a gate"
thread = "A"
depends_on = ["A.3"]
because = { "A.3" = "the scan returns as a gate, and every gate must resolve here" }
done_when = [
  { kind = "proof", test = "tests/test_gate_registry.py::test_the_history_is_scanned_for_secrets" },
]
[[steps]]
id = "A.5"
title = "A commit's outcome names its branch, the repository's root commit included"
thread = "A"
done_when = [
  { kind = "proof", test = "tests/test_commit.py::test_the_root_commit_names_its_branch" },
]
[[steps]]
id = "A.6"
title = "Every adapted file is its upstream bytes plus its recorded patch, re-proven by a gate"
thread = "A"
done_when = [
  { kind = "proof", test = "tests/test_provenance.py::test_every_adapted_file_is_upstream_plus_its_patch" },
]
[[steps]]
id = "A.7"
title = "The founding policy's pins come from one source, so a pin cannot drift from its test"
thread = "A"
done_when = [
  { kind = "proof", test = "tests/test_founding_policy.py::test_the_policy_pins_are_the_lockfile_pins" },
]
[[steps]]
id = "A.8"
title = "mise's trust and state directories are owner-only, whatever the umask"
thread = "A"
done_when = [
  { kind = "proof", test = "tests/test_machine_state.py::test_mise_state_is_owner_only" },
]
[[steps]]
id = "A.9"
title = "Every pinned tool installs with verified provenance, or its absence is a recorded decision"
thread = "A"
done_when = [
  { kind = "proof", test = "tests/test_tool_provenance.py::test_every_locked_tool_names_its_provenance" },
]
[[steps]]
id = "A.10"
title = "No installed tool version is outside the pinned set"
thread = "A"
done_when = [
  { kind = "proof", test = "tests/test_tool_provenance.py::test_no_installed_version_is_unpinned" },
]
[[steps]]
id = "A.11"
title = "The policies pass Regal, and Regal runs as a gate"
thread = "A"
depends_on = ["A.9"]
because = { "A.9" = "regal must install with a decided provenance before it gates anything" }
done_when = [
  { kind = "proof", test = "tests/test_gate_registry.py::test_the_policies_are_linted" },
]
[[steps]]
id = "A.12"
title = "Committing nothing is refused by name, and git's reason is never lost"
thread = "A"
done_when = [
  { kind = "proof", test = "tests/test_commit_execution.py::test_nothing_staged_is_refused_before_git_commits" },
]
[[steps]]
id = "A.13"
title = "Every cscie103 capability recsys uses is ported whole or minimally adapted; Databricks, Nix and unused files are withdrawn by name"
thread = "A"
done_when = [
  { kind = "proof", test = "tests/test_provenance.py::test_every_upstream_path_is_ported_or_withdrawn" },
]
[[steps]]
id = "A.14"
title = "Features reach develop only through pr, branches start only through worktree:add, and main moves only through release"
thread = "A"
depends_on = ["A.13"]
because = { "A.13" = "the GitFlow tasks arrive with the port" }
done_when = [
  { kind = "proof", test = "tests/test_gitflow.py::test_every_gitflow_task_is_declared_and_recorded" },
]
[[steps]]
id = "A.15"
title = "Repository settings and the develop-and-main ruleset are code, applied by repo:configure"
thread = "A"
depends_on = ["A.13"]
because = { "A.13" = "repo:configure and the ruleset contract arrive with the port" }
done_when = [
  { kind = "proof", test = "tests/test_repo_settings.py::test_the_ruleset_protects_develop_and_main" },
]
[[steps]]
id = "A.16"
title = "Every repository operation is a declared task run through the recording gateway, enforced as policy"
thread = "A"
depends_on = ["A.13"]
because = { "A.13" = "cscie103's every-operation-is-a-task policy arrives with the port" }
done_when = [
  { kind = "proof", test = "tests/test_task_coverage.py::test_every_operation_is_a_declared_task" },
]
[[steps]]
id = "A.17"
title = "Toolchain operations -- trust, lock, install, prune -- are tasks"
thread = "A"
depends_on = ["A.16"]
because = { "A.16" = "the coverage policy is what names the toolchain operations still run by hand" }
done_when = [
  { kind = "proof", test = "tests/test_task_coverage.py::test_toolchain_operations_are_tasks" },
]
