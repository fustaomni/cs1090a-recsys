# contracts/claims.toml
# claims-register/v1 (A.36). Pillars are credited only with a contract, a task, proofs and the
# run ids of passing runs of that task in the hash-chained ledger; claims keep their verdict and
# the critique findings that decide them. claims:audit checks every entry.
contract = "claims-register/v1"

[[pillars]]
name = "a RED is a verdict from the runner's report"
contract = "scripts/red_verify.py"
task = "test:red"
proofs = ["tests/test_red_verify.py::test_a_red_needs_exit_code_one_and_a_report_from_this_run"]
runs = ["3d04b1be5389479cb745e5d14e5eca36"]

[[pillars]]
name = "GREEN is a verdict from the runner's report, with its scope"
contract = "scripts/green_verify.py"
task = "test:green"
proofs = ["tests/test_green_verify.py::test_green_needs_exit_zero_and_a_report_from_this_run"]
runs = ["e9871da8beb24a44a926a75dcb964592"]

[[pillars]]
name = "another repository is read at its pinned commit"
contract = "scripts/upstream.py"
task = "upstream:checkout"
proofs = ["tests/test_upstream_checkout.py::test_another_repository_is_checked_out_at_a_pinned_commit"]
runs = ["ead7108eef99402a8d4ff5942244d655"]

