# contracts/problems.toml
# ONE REGISTRY OF STABLE PROBLEM CODES (D.177, R60). Every code a policy rule declares is
# registered here with its rule's title; an entry is never rewritten or removed, only retired,
# so a code keeps one meaning for good. problems:register appends what is new; audit:problems
# checks both directions and the registry on origin/develop.
contract = "problems/v1"

