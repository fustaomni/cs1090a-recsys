# contracts/mutations/d355.toml
# D.355: status:paths prints every changed path a commit should name, derived from git.

[[mutants]]
id = "rename-source-dropped"
file = "scripts/status_paths.py"
before = 'if change.original_path is not None and change.status[0] == "R":'
after = "if False:"
killers = ["tests/test_status_paths.py::test_a_rename_names_both_its_sides"]

[[mutants]]
id = "new-directory-collapsed"
file = "scripts/status_paths.py"
before = '"--untracked-files=all", cwd=root'
after = '"--untracked-files=normal", cwd=root'
killers = ["tests/test_status_paths.py::test_a_file_in_a_new_directory_is_named"]

[[mutants]]
id = "ignored-named"
file = "scripts/status_paths.py"
before = '"--untracked-files=all", cwd=root'
after = '"--untracked-files=all", "--ignored", cwd=root'
killers = ["tests/test_status_paths.py::test_an_ignored_file_is_not_named"]

[[mutants]]
id = "failure-read-as-clean"
file = "scripts/status_paths.py"
before = "    if status.returncode != 0:"
after = "    if False:"
killers = ["tests/test_status_paths.py::test_outside_a_repository_is_refused_not_read_as_clean"]

[[mutants]]
id = "unanswered-allowed"
file = "policies/runs/status_paths/status_paths.rego"
before = "\tinput.status_paths.answered == false"
after = "\tinput.status_paths.answered == \"never\""
killers = ["tests/test_status_paths.py::test_outside_a_repository_is_refused_not_read_as_clean"]
