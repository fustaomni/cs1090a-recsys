# contracts/mutations/A.276.toml
# A.276: site:test back on npx without an install, and the proofs that must catch it.

[[mutants]]
id = "tests-back-on-npx"
file = "mise.toml"
before = 'run = "mise run site:install && cd site && mise exec node@24 -- npm run --silent test"'
after = 'run = "cd site && mise exec node@24 -- npx --no-install vitest run"'
killers = [
  "tests/test_site_railway_cli.py::test_no_task_runs_any_tool_through_npx",
  "tests/test_site_railway_cli.py::test_site_test_installs_the_locked_site_first",
]
