# contracts/mutations/A.262.toml
# A.262: the sandbox's tree walk restored, and the proof that must catch it.

[[mutants]]
id = "copytree-again"
file = "tests/acceptance/acceptance_sandbox.py"
before = '        copy_committable(SOURCE, root)'
after = '        __import__("shutil").copytree(SOURCE, root, symlinks=True)'
killers = ["tests/acceptance/test_sandbox.py::test_the_sandbox_copies_only_what_a_commit_could_contain"]
