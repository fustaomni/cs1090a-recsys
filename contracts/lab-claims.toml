# contracts/lab-claims.toml
# lab-claims/v1 (A.260): every claim a lab's prose states, with the vitest case that checks it
# against the lab's computation, named as file > describe > it. Each lab is verified against
# the rendered Interactive mechanisms page before its prose is corrected.
contract = "lab-claims/v1"

[[claims]]
lab = "M1"
claim = "Ratings only take the values 1 to 5."
evidence = "site/src/mechanisms/lib/lib.test.js > seeded data > gives ratings only on the five integer levels"

[[claims]]
lab = "M1"
claim = "User and movie history are standardised, with correlation rho."
evidence = "site/src/mechanisms/lib/lib.test.js > seeded data > draws user and movie history standard normal, correlated rho"

[[claims]]
lab = "M1"
claim = "Least squares is the lowest point of the bowl, where the sum of squared residuals is smallest."
evidence = "site/src/mechanisms/lib/lib.test.js > simple least squares > computes the same SSE from sums as directly, and is the bowl's lowest point"

[[claims]]
lab = "M1"
claim = "b1 = cov(x, y) / var(x), and b0 is the mean rating since x is centred."
evidence = "site/src/mechanisms/lib/lib.test.js > simple least squares > has slope cov/var and intercept the mean rating once x is centred"

[[claims]]
lab = "M1"
claim = "Predictions outside [1, 5] are counted, and the residuals use the unclipped predictions."
evidence = "site/src/mechanisms/lib/lib.test.js > errors in and out of range > counts predictions outside [1, 5] and never scores worse after clipping"

[[claims]]
lab = "M1"
claim = "Leaving movie history out, the slope absorbs rho times its effect: in expectation, before rounding, it is the user effect plus rho times the movie effect."
evidence = "site/src/mechanisms/lib/lib.test.js > omitted-variable bias > absorbs rho times the movie effect when movie history is correlated"

[[claims]]
lab = "M1"
claim = "Rounding to the five levels, which also caps ratings at 1 and 5, flattens the slope."
evidence = "site/src/mechanisms/lib/lib.test.js > rounding to levels > flattens the fitted slope, since the levels cap ratings at 1 and 5"

[[claims]]
lab = "M2"
claim = "Both predictors are centred, so the intercept is the mean rating."
evidence = "site/src/mechanisms/lib/regression.test.js > least squares by QR > solves the centred normal equations, with the intercept at the mean rating"

[[claims]]
lab = "M2"
claim = "The bowl is the sum of squared residuals over the two slopes."
evidence = "site/src/mechanisms/lib/regression.test.js > the multi-linear bowl > is the sum of squared residuals, expanded through the normal equations"

[[claims]]
lab = "M2"
claim = "As the predictors correlate, resampled slopes spread out."
evidence = "site/src/mechanisms/lib/regression.test.js > collinearity > spreads resampled coefficients more as the predictors correlate"

[[claims]]
lab = "M2"
claim = "Slopes that fit equally well trade off: resampled fits scatter along the valley floor."
evidence = "site/src/mechanisms/lib/regression.test.js > collinearity > trades the slopes off along the valley as the predictors correlate"

[[claims]]
lab = "M2"
claim = "The least squares slopes solve the centred normal equations."
evidence = "site/src/mechanisms/lib/regression.test.js > least squares by QR > satisfies the normal equations X'X b = X'y"

[[claims]]
lab = "M2"
claim = "The residual sum is zero for any slopes because b0 is the mean rating; the other two sums vanish only at the least squares fit."
evidence = "site/src/mechanisms/lib/regression.test.js > the multi-linear bowl > leaves residuals summing to zero for any slopes once the intercept is the mean"

[[claims]]
lab = "M2"
claim = "VIF = 1 / (1 - R^2) is the same for each slope, about 1 / (1 - rho^2)."
evidence = "site/src/mechanisms/lib/regression.test.js > collinearity > raises the VIF of correlated predictors to about 1 / (1 - rho^2)"

[[claims]]
lab = "M3"
claim = "Centring changes what the lower coefficients mean, not the predictions."
evidence = "site/src/mechanisms/lib/regression.test.js > polynomial and interaction terms > predicts exactly the same after centring"

[[claims]]
lab = "M3"
claim = "The count-squared and interaction coefficients are identical centred and raw."
evidence = "site/src/mechanisms/lib/regression.test.js > polynomial and interaction terms > keeps the curvature and interaction coefficients, shifting only the lower ones"

[[claims]]
lab = "M3"
claim = "With the curvature held at the sliders, the drawn surface does not move when centring is toggled."
evidence = "site/src/mechanisms/lib/regression.test.js > polynomial terms with the curvature held > draws the same surface whether or not the predictors are centred"

[[claims]]
lab = "M3"
claim = "A high VIF that centring removes was created by the scaling of the powers of count."
evidence = "site/src/mechanisms/lib/regression.test.js > polynomial and interaction terms > cuts the VIF that uncentred powers of count create"

[[claims]]
lab = "M3"
claim = "The ratings sit on the five levels."
evidence = "site/src/mechanisms/lib/regression.test.js > polynomial terms with the curvature held > draws its ratings on the five integer levels"

[[claims]]
lab = "M4"
claim = "Ridge adds lambda times the squared norm to the mean squared error, solving (X'X/n + lambda I) b = X'y/n."
evidence = "site/src/mechanisms/lib/penalized.test.js > ridge > is least squares at lambda = 0 and solves (X'X/n + lambda I) b = X'y/n"

[[claims]]
lab = "M4"
claim = "As lambda grows the coefficients are pulled toward each other, never exactly to zero."
evidence = "site/src/mechanisms/lib/penalized.test.js > ridge > pulls correlated coefficients toward each other, never exactly to zero"

[[claims]]
lab = "M4"
claim = "Resampled least squares fits scatter along the valley while the ridge fits stay close together."
evidence = "site/src/mechanisms/lib/ridge.test.js > ridge, as Model 4 shows it > scatters resampled fits less than least squares does"

[[claims]]
lab = "M4"
claim = "Each direction keeps d / (d + lambda) of its least squares value, so the weak, collinear direction is shrunk hardest."
evidence = "site/src/mechanisms/lib/ridge.test.js > ridge, as Model 4 shows it > keeps d / (d + lambda) of least squares along each eigen-direction"

[[claims]]
lab = "M4"
claim = "The effective degrees of freedom are the sum of the directions' shrinkage factors."
evidence = "site/src/mechanisms/lib/penalized.test.js > ridge > has effective degrees of freedom equal to the trace of its hat matrix"

[[claims]]
lab = "M4"
claim = "Lambda is chosen on time-ordered folds, each validated on rows later than its training rows."
evidence = "site/src/mechanisms/lib/penalized.test.js > selection and tuning > validates every fold on rows later than all its training rows"

[[claims]]
lab = "M4"
claim = "The 1-SE rule takes the largest lambda within one standard error of the minimum."
evidence = "site/src/mechanisms/lib/penalized.test.js > selection and tuning > takes the largest lambda within one standard error of the minimum"

[[claims]]
lab = "M4"
claim = "The predictors are standardised on the training rows, and the intercept, the mean rating, is never penalised."
evidence = "site/src/mechanisms/lib/ridge.test.js > ridge, as Model 4 shows it > standardises each predictor on the rows it is given, to mean 0 and variance 1"

[[claims]]
lab = "M5"
claim = "Coordinate descent soft-thresholds each coefficient, and one whose z lands inside plus or minus lambda is set exactly to zero."
evidence = "site/src/mechanisms/lib/penalized.test.js > lasso by coordinate descent > soft-thresholds: shrinks by lambda and zeroes anything within it"

[[claims]]
lab = "M5"
claim = "Lasso adds lambda times the L1 norm to half the mean squared error, so at its solution |x'r| / n equals lambda for each kept predictor and is at most lambda for each zeroed one."
evidence = "site/src/mechanisms/lib/penalized.test.js > lasso by coordinate descent > satisfies the KKT conditions at its solution"

[[claims]]
lab = "M5"
claim = "Every coefficient is zero at or above lambda max."
evidence = "site/src/mechanisms/lib/penalized.test.js > lasso by coordinate descent > zeroes every coefficient from lambda_max up, and frees one just below it"

[[claims]]
lab = "M5"
claim = "The drawn path is coordinate descent from zero, ending at the lasso solution."
evidence = "site/src/mechanisms/lib/penalized.test.js > lasso by coordinate descent > records a path that starts at zero and ends at the solution"

[[claims]]
lab = "M5"
claim = "Over half-samples the noise predictor, which has no effect, is selected far less often than the histories."
evidence = "site/src/mechanisms/lib/penalized.test.js > selection and tuning > selects the irrelevant predictor far less often than the ones that matter"

[[claims]]
lab = "M5"
claim = "Raise rho and the two correlated histories trade places from sample to sample."
evidence = "site/src/mechanisms/lib/lasso.test.js > lasso, as Model 5 shows it > lets the two correlated histories trade places across half-samples at high rho"

[[claims]]
lab = "M5"
claim = "Ridge never sets a coefficient to zero; lasso does."
evidence = "site/src/mechanisms/lib/penalized.test.js > ridge > pulls correlated coefficients toward each other, never exactly to zero"

[[claims]]
lab = "M5"
claim = "The 1-SE lambda is the largest within one standard error of the minimum on time-ordered folds."
evidence = "site/src/mechanisms/lib/penalized.test.js > selection and tuning > takes the largest lambda within one standard error of the minimum"

[[claims]]
lab = "M6"
claim = "kNN learns no equation: a prediction is the mean rating of the k nearest training rows."
evidence = "site/src/mechanisms/lib/neighbours.test.js > nearest neighbours > predicts the mean rating of those neighbours"

[[claims]]
lab = "M6"
claim = "The k nearest rows are found in order of distance."
evidence = "site/src/mechanisms/lib/neighbours.test.js > nearest neighbours > returns the k closest rows in order of distance"

[[claims]]
lab = "M6"
claim = "The drawn neighbourhood holds exactly the k rows; its radius is the distance to the k-th, so it grows with k."
evidence = "site/src/mechanisms/lib/knn.test.js > kNN, as Model 6 shows it > draws a neighbourhood holding exactly the k nearest rows, its radius growing with k"

[[claims]]
lab = "M6"
claim = "Manhattan distance is never below Euclidean, and Gower lies in [0, 1] for mixed features."
evidence = "site/src/mechanisms/lib/neighbours.test.js > nearest neighbours > keeps Manhattan at or above Euclidean, and Gower within [0, 1]"

[[claims]]
lab = "M6"
claim = "Gower's octahedron holds the query's own group, since a row in another group pays a quarter of the distance for that alone."
evidence = "site/src/mechanisms/lib/knn.test.js > kNN, as Model 6 shows it > charges a row in another group a quarter of the Gower distance for that alone"

[[claims]]
lab = "M6"
claim = "The k-d tree finds exactly what brute force finds while visiting fewer rows."
evidence = "site/src/mechanisms/lib/neighbours.test.js > nearest neighbours > finds exactly what brute force finds with a k-d tree, visiting fewer rows"

[[claims]]
lab = "M6"
claim = "Tree indexes lose that advantage as dimensions grow."
evidence = "site/src/mechanisms/lib/knn.test.js > kNN, as Model 6 shows it > loses the k-d tree's advantage as the dimension grows"

[[claims]]
lab = "M6"
claim = "As the dimension grows every point sits at nearly the same distance: the relative contrast collapses."
evidence = "site/src/mechanisms/lib/neighbours.test.js > nearest neighbours > concentrates distances as the dimension grows"
