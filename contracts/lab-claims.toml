evidence = "site/src/mechanisms/lib/tree.test.js > importance and drawing > gives impurity shares that sum to one"

[[claims]]
lab = "M7"
claim = "Permutation importance is the rise in later-window RMSE when a feature is shuffled, none for a feature the model never uses."
evidence = "site/src/mechanisms/lib/tree.test.js > importance and drawing > measures no permutation importance for a feature the model never uses"

[[claims]]
lab = "M7"
claim = "The surface is flat steps with vertical walls at the split thresholds."
evidence = "site/src/mechanisms/lib/tree.test.js > importance and drawing > draws a surface whose cells are flat between the split thresholds"

