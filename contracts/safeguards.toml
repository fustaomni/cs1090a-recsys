# contracts/safeguards.toml
# safeguards-register/v1 (A.52). Each safeguard names one mutation that disables exactly its
# guard and the proof that must fail when it is applied; safeguards:prove runs every trial.
contract = "safeguards-register/v1"

[[safeguards]]
id = "SA.INPUT_MISSING"
engine = "source:apply"
guard = "ERR_SOURCE_APPLY_INPUT_MISSING"
path = "policies/runs/source_apply/source_apply.rego"
anchor = "\tnot input.source_apply\n"
mutant = "\tfalse\n"
proof = "tests/test_source_apply.py::test_an_absent_request_is_refused_by_the_policy"

[[safeguards]]
id = "SA.PATH_OUTSIDE"
engine = "source:apply"
guard = "ERR_SOURCE_APPLY_PATH_OUTSIDE"
path = "policies/runs/source_apply/source_apply.rego"
anchor = "\tnot operation.inside\n"
mutant = "\tfalse\n"
proof = "tests/test_source_apply.py::test_a_path_outside_the_repository_is_refused"

[[safeguards]]
id = "SA.CREATE_EXISTS"
engine = "source:apply"
guard = "ERR_SOURCE_APPLY_CREATE_EXISTS"
path = "policies/runs/source_apply/source_apply.rego"
anchor = "\toperation.op == \"create\"\n\toperation.exists_before\n"
mutant = "\toperation.op == \"create\"\n\tfalse\n"
proof = "tests/test_source_apply.py::test_creating_a_file_that_exists_is_refused"

[[safeguards]]
id = "SA.REPLACE_MISSING"
engine = "source:apply"
guard = "ERR_SOURCE_APPLY_REPLACE_MISSING"
path = "policies/runs/source_apply/source_apply.rego"
anchor = "\tnot operation.exists_before\n"
mutant = "\tfalse\n"
proof = "tests/test_source_apply.py::test_replacing_in_a_missing_file_is_refused"

[[safeguards]]
id = "SA.ANCHOR_COUNT"
engine = "source:apply"
guard = "ERR_SOURCE_APPLY_ANCHOR_COUNT"
path = "policies/runs/source_apply/source_apply.rego"
anchor = "\toperation.anchor_count != operation.expected_count\n"
mutant = "\tfalse\n"
proof = "tests/test_source_apply.py::test_an_anchor_found_twice_is_refused"

[[safeguards]]
id = "SA.PYTHON_UNPARSEABLE"
engine = "source:apply"
guard = "ERR_SOURCE_APPLY_PYTHON_UNPARSEABLE"
path = "policies/runs/source_apply/source_apply.rego"
anchor = "\tfile.python_parses == false\n"
mutant = "\tfalse\n"
proof = "tests/test_source_apply.py::test_a_python_file_left_unparseable_is_refused"

[[safeguards]]
id = "SA.TOML_UNPARSEABLE"
engine = "source:apply"
guard = "ERR_SOURCE_APPLY_TOML_UNPARSEABLE"
path = "policies/runs/source_apply/source_apply.rego"
anchor = "\tfile.toml_parses == false\n"
mutant = "\tfalse\n"
proof = "tests/test_source_apply.py::test_a_toml_file_left_unparseable_is_refused"

[[safeguards]]
id = "SA.LINE_TOO_LONG"
engine = "source:apply"
guard = "ERR_SOURCE_APPLY_LINE_TOO_LONG"
path = "policies/runs/source_apply/source_apply.rego"
anchor = "\toperation.longest_written_python_line > input.source_apply.line_limit\n"
mutant = "\tfalse\n"
proof = "tests/test_source_apply.py::test_a_written_python_line_over_100_is_refused"

[[safeguards]]
id = "LEDGER.INPUT_MISSING"
engine = "runs:verify"
guard = "ERR_LEDGER_INPUT_MISSING"
path = "policies/runs/ledger/ledger.rego"
anchor = "\tnot input.ledger\n"
mutant = "\tfalse\n"
proof = "tests/test_ledger_signing.py::test_an_absent_request_is_refused_by_the_policy"

[[safeguards]]
id = "LEDGER.CHAIN_BROKEN"
engine = "runs:verify"
guard = "ERR_LEDGER_CHAIN_BROKEN"
path = "policies/runs/ledger/ledger.rego"
anchor = "\tnot report.intact\n"
mutant = "\tfalse\n"
proof = "tests/test_ledger_policy.py::test_a_broken_chain_is_refused_by_the_policy"

[[safeguards]]
id = "LEDGER.SIGNATURE_INVALID"
engine = "runs:verify"
guard = "ERR_LEDGER_SIGNATURE_INVALID"
path = "policies/runs/ledger/ledger.rego"
anchor = "\tsome position in input.ledger.invalid_signatures\n"
mutant = "\tsome position in input.ledger.invalid_signatures\n\tposition < 0\n"
proof = "tests/test_ledger_signing.py::test_a_forged_signature_is_refused"

[[safeguards]]
id = "LEDGER.UNSIGNED_AFTER_SIGNING"
engine = "runs:verify"
guard = "ERR_LEDGER_UNSIGNED_AFTER_SIGNING"
path = "policies/runs/ledger/ledger.rego"
anchor = "\tsome position in input.ledger.unsigned_after_signing\n"
mutant = "\tsome position in input.ledger.unsigned_after_signing\n\tposition < 0\n"
proof = "tests/test_ledger_signing.py::test_an_unsigned_record_after_signing_began_is_refused"

[[safeguards]]
id = "LEDGER.WAIVER_UNMATCHED"
engine = "runs:verify"
guard = "ERR_LEDGER_WAIVER_UNMATCHED"
path = "policies/runs/ledger/ledger.rego"
anchor = "\tsome position in input.ledger.waivers_unmatched\n"
mutant = "\tsome position in input.ledger.waivers_unmatched\n\tposition < 0\n"
proof = "tests/test_ledger_signing.py::test_a_waiver_must_name_the_exact_record"
