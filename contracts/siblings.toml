# contracts/siblings.toml
# siblings/v1 (A.185): each sibling repository worked on from here, at its canonical source, with
# the tools its FAS mode pins in place of the Nix devshell it otherwise runs every task inside.
# Pins predate this repository's release floor: databricks 1.15.0 (2026-09-03), osv-scanner
# 2.5.1 (2026-08-17), Temurin 17.0.19+10 (2026-05); the other six are this repository's own.
contract = "siblings/v1"

[[siblings]]
name = "cscie103-data-engineering"
source = "https://github.com/fustaomni/cscie103-data-engineering"
branch = "develop"

[siblings.tools]
betterleaks = "1.9.0"
databricks-cli = "1.15.0"
java = "temurin-17.0.19+10"
lefthook = "2.2.0"
opa = "1.21.1"
osv-scanner = "2.5.1"
regal = "0.43.0"
uv = "0.12.23"
zizmor = "1.30.1"
