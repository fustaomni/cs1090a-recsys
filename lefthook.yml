# lefthook.yml
# Git hooks, committed so they belong to the repository rather than to one machine.
# Mirrored from cscie103-data-engineering. Everything runs through `mise run`, so no version
# or binary path appears here and this file cannot drift from the toolchain.
#
#   pre-commit  fast and offline: branch guard, format, lint
#   commit-msg  every commit names the plan steps it serves
#   pre-push    the offline gate
#
# pre-commit runs audit:workflows too, restored with the workflow audit and the first workflow.

pre-commit:
  # Not parallel: the formatter rewrites files, so it finishes before any check reads them.
  parallel: false
  jobs:
    # Branch guard first: a commit on develop or main is refused before any work.
    - name: branch
      run: mise run start:check
    - name: format
      run: mise run fmt
      stage_fixed: true
    - name: lint
      run: mise run lint
    # EVERY COMMIT, NOT ONLY ONES TOUCHING A WORKFLOW (M38, D.95): offline and about a second, so
    # a token widening refused here never exists as a commit. CI's required gate is the backstop.
    - name: workflows
      run: mise run audit:workflows

commit-msg:
  jobs:
    - name: plan steps
      run: mise run plan:trailers {1}

pre-push:
  jobs:
    - name: gate (offline)
      run: mise run check:offline
